name: Upgrade CHASS Viewer Ability & Comment UI v3.6.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chass-viewer-ability-comment-v361
  cancel-in-progress: false

jobs:
  upgrade-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify v3.5.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f viewer/viewer-core.js
          test -f viewer/viewer-app.js
          test -f viewer/viewer.css
          grep -Fq "CHASS Viewer v3.5.1: hard hidden-state guard" viewer/viewer.css
          grep -Fq "TIME評価乖離" viewer/viewer-app.js
          grep -Fq "sanitizeViewerMarketPayload" viewer/viewer-core.js
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          echo "v3.5.1 baseline OK"

      - name: Apply robust v3.6.1 upgrade
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          core_path = Path("viewer/viewer-core.js")
          app_path = Path("viewer/viewer-app.js")
          css_path = Path("viewer/viewer.css")

          core = core_path.read_text(encoding="utf-8")
          app = app_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label} anchor not found")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              start_i = text.find(start)
              if start_i < 0:
                  raise SystemExit(f"{label} start not found")
              end_i = text.find(end, start_i)
              if end_i < 0:
                  raise SystemExit(f"{label} end not found")
              return text[:start_i] + replacement + text[end_i:]

          # --------------------------------------------------------
          # viewer-core.js
          # Public ability score/rank only.
          # --------------------------------------------------------
          if "abilityScore:" not in core:
              core = replace_once(
                  core,
                  "  const market = raw.market || {};",
                  "  const ability = raw.ability && typeof raw.ability === 'object' ? raw.ability : {};\n"
                  "  const market = raw.market || {};",
                  "sanitizeHorse ability object",
              )

              core = replace_once(
                  core,
                  "    mark: textOrNull(raw.mark),\n"
                  "    aiWinRate: finiteOrNull(probability.win ?? raw.win ?? raw.winProb),",
                  "    mark: textOrNull(raw.mark),\n"
                  "    abilityScore: finiteOrNull(\n"
                  "      ability.totalScore ?? ability.score ?? raw.abilityScore ?? raw.overallScore ?? raw.score\n"
                  "    ),\n"
                  "    abilityRank: finiteOrNull(raw.abilityRank),\n"
                  "    aiWinRate: finiteOrNull(probability.win ?? raw.win ?? raw.winProb),",
                  "sanitizeHorse public ability fields",
              )

              core = replace_once(
                  core,
                  "            horseName: textOrNull(horse.horseName) || '',\n"
                  "            odds: finiteOrNull(horse.odds),",
                  "            horseName: textOrNull(horse.horseName) || '',\n"
                  "            abilityRank: finiteOrNull(horse.abilityRank),\n"
                  "            abilityScore: finiteOrNull(horse.score),\n"
                  "            odds: finiteOrNull(horse.odds),",
                  "tabular market ability fields",
              )

          # --------------------------------------------------------
          # viewer-app.js
          # --------------------------------------------------------
          if "const expandedSecondaryRaces = new Set();" not in app:
              app = replace_once(
                  app,
                  "const expandedRaces = new Set();",
                  "const expandedRaces = new Set();\n"
                  "const expandedSecondaryRaces = new Set();",
                  "secondary expansion state",
              )

          app = app.replace(
              "if (['○', '▲'].includes(text)) return 'is-sub';",
              "if (['○', '▲', '△'].includes(text)) return 'is-sub';",
              1,
          )

          # Missing TIME must not become 0 seconds.
          new_time_seconds = r"""function timeSeconds(horse) {
            const direct = horse.predictedTimeSec;
            if (direct != null && direct !== '' && Number.isFinite(Number(direct))) {
              const value = Number(direct);
              return value > 0 ? value : null;
            }

            const text = String(horse.predictedTimeText || '').trim();
            if (!text || text === '—') return null;

            const match = /^(\d+):(\d{2}(?:\.\d+)?)$/.exec(text);
            if (!match) return null;

            const value = Number(match[1]) * 60 + Number(match[2]);
            return Number.isFinite(value) && value > 0 ? value : null;
          }"""
          app = replace_between(
              app,
              "function timeSeconds(horse) {",
              "\n\nfunction raceRanks(race) {",
              new_time_seconds,
              "timeSeconds",
          )

          # Equal TIME / AI values receive equal ranks.
          new_race_ranks = r"""function raceRanks(race) {
            const active = race.horses.filter((horse) => horse.runnerStatus === 'active');

            const byTime = active
              .map((horse) => ({ horse, value: timeSeconds(horse) }))
              .filter((item) => item.value != null)
              .sort((a, b) => a.value - b.value || Number(a.horse.horseNo || 999) - Number(b.horse.horseNo || 999));

            const byWin = active
              .filter((horse) => horse.aiWinRate != null)
              .sort((a, b) => Number(b.aiWinRate) - Number(a.aiWinRate) || Number(a.horseNo || 999) - Number(b.horseNo || 999));

            const timeRank = new Map();
            let previousTime = null;
            let currentTimeRank = 0;
            byTime.forEach((item, index) => {
              if (previousTime == null || Math.abs(item.value - previousTime) > 1e-9) {
                currentTimeRank = index + 1;
              }
              timeRank.set(Number(item.horse.horseNo), currentTimeRank);
              previousTime = item.value;
            });

            const winRank = new Map();
            let previousWin = null;
            let currentWinRank = 0;
            byWin.forEach((horse, index) => {
              const value = Number(horse.aiWinRate);
              if (previousWin == null || Math.abs(value - previousWin) > 1e-12) {
                currentWinRank = index + 1;
              }
              winRank.set(Number(horse.horseNo), currentWinRank);
              previousWin = value;
            });

            return { timeRank, winRank };
          }"""
          app = replace_between(
              app,
              "function raceRanks(race) {",
              "\n\nfunction timeGapInfo(horse, ranks) {",
              new_race_ranks,
              "raceRanks",
          )

          # ◎ / 💎 / ⚠ visible by default.
          # ○ / ▲ / △ behind a secondary expansion control.
          new_mark_hierarchy = r"""const SECONDARY_MARKS = new Set(['○', '▲', '△']);

          function horseHasPrimarySignal(horse) {
            return horse.mark === '◎'
              || Boolean(horse.longshotMark)
              || Boolean(horse.dangerMark);
          }

          function horseHasSecondarySignal(horse) {
            return SECONDARY_MARKS.has(String(horse.mark || ''));
          }

          function horseIsMarked(horse) {
            return horseHasPrimarySignal(horse) || horseHasSecondarySignal(horse);
          }

          function primaryHorses(race) {
            const explicit = race.horses.filter(horseHasPrimarySignal);
            if (explicit.length) {
              const priority = (horse) => {
                if (horse.mark === '◎') return 0;
                if (horse.longshotMark) return 1;
                if (horse.dangerMark) return 2;
                return 3;
              };
              return [...explicit].sort((a, b) => priority(a) - priority(b));
            }

            return [...race.horses]
              .filter((horse) => horse.runnerStatus === 'active')
              .sort((a, b) => Number(b.aiWinRate ?? -1) - Number(a.aiWinRate ?? -1))
              .slice(0, Math.min(1, race.horses.length));
          }

          function secondaryHorses(race, primary) {
            const primaryNos = new Set(primary.map((horse) => Number(horse.horseNo)));
            return race.horses.filter((horse) =>
              !primaryNos.has(Number(horse.horseNo))
              && horseHasSecondarySignal(horse)
            );
          }"""
          app = replace_between(
              app,
              "function horseIsFeatured(horse) {",
              "\n\nfunction legendChip(symbol, label, className) {",
              new_mark_hierarchy,
              "mark hierarchy",
          )

          if "legendChip('△', '連下', 'is-sub')" not in app:
              app = replace_once(
                  app,
                  "    legendChip('▲', '単穴', 'is-sub'),\n"
                  "    legendChip('💎', '穴', 'is-longshot'),",
                  "    legendChip('▲', '単穴', 'is-sub'),\n"
                  "    legendChip('△', '連下', 'is-sub'),\n"
                  "    legendChip('💎', '穴', 'is-longshot'),",
                  "△ legend",
              )

          helpers = r"""function abilityBadge(horse) {
            const badge = document.createElement('div');
            badge.className = 'viewer-ability-badge';
            badge.title = '公開用総合能力指数';

            const label = document.createElement('span');
            label.textContent = '能力';

            const score = document.createElement('strong');
            score.textContent = horse.abilityScore == null
              ? '—'
              : formatViewerNumber(horse.abilityScore, 1);

            const rank = document.createElement('em');
            rank.textContent = horse.abilityRank == null ? '' : `${horse.abilityRank}位`;

            badge.append(label, score, rank);
            return badge;
          }

          function shortComment(horse, ranks) {
            const facts = [];
            const no = Number(horse.horseNo);
            const aiRank = ranks?.winRank?.get(no);
            const timeRank = ranks?.timeRank?.get(no);

            if (horse.abilityRank != null && horse.abilityRank <= 3) {
              facts.push(`能力${horse.abilityRank}位`);
            }
            if (aiRank != null && aiRank <= 3) {
              facts.push(`AI勝率${aiRank}位`);
            }
            if (timeRank != null && timeRank <= 3) {
              facts.push(`予想TIME${timeRank}位`);
            }
            if (horse.expectedValue != null && horse.expectedValue >= 1) {
              facts.push(`EV ${formatViewerNumber(horse.expectedValue, 2)}×`);
            }

            const reasons = [];
            if (horse.longshotReason) reasons.push(`💎 ${horse.longshotReason}`);
            if (horse.dangerReason) reasons.push(`⚠ ${horse.dangerReason}`);

            if (!reasons.length) {
              if (horse.mark === '◎') reasons.push('◎ 本命評価');
              else if (horse.mark === '○') reasons.push('○ 対抗評価');
              else if (horse.mark === '▲') reasons.push('▲ 単穴評価');
              else if (horse.mark === '△') reasons.push('△ 連下評価');
              else if (horse.longshotMark) reasons.push('💎 穴評価');
              else if (horse.dangerMark) reasons.push('⚠ 注意評価');
            }

            return [...facts, ...reasons].filter(Boolean).join('・');
          }

          """
          if "function abilityBadge(horse)" not in app:
              app = replace_once(
                  app,
                  "function mobileHorseCard(horse, featured = false, ranks = null) {",
                  helpers + "function mobileHorseCard(horse, featured = false, ranks = null) {",
                  "ability/comment helpers",
              )

          new_mobile_card = r"""function mobileHorseCard(horse, featured = false, ranks = null) {
            const card = document.createElement('article');
            card.className = 'viewer-horse-card';
            if (featured) card.classList.add('is-featured');
            if (horse.runnerStatus !== 'active') card.classList.add('viewer-runner-inactive');

            const top = document.createElement('div');
            top.className = 'viewer-horse-card-top viewer-horse-card-top-v36';

            const marks = markCell(horse);
            marks.classList.add('viewer-horse-card-marks', 'is-leading');
            if (!marks.childElementCount) marks.classList.add('is-empty');

            const identity = document.createElement('div');
            identity.className = 'viewer-horse-identity';

            const no = document.createElement('span');
            no.className = 'viewer-horse-no';
            no.textContent = horse.horseNo ?? '—';

            const name = document.createElement('strong');
            name.className = 'viewer-horse-name';
            name.textContent = horse.horseName || '—';

            identity.append(no, name);

            const ability = abilityBadge(horse);
            top.append(marks, identity, ability);

            const marketAvailable = horse.popularity != null
              || horse.odds != null
              || horse.expectedValue != null
              || (horse.aiWinRate != null && horse.odds != null);

            if (marketAvailable) {
              const marketMetrics = document.createElement('div');
              marketMetrics.className = 'viewer-horse-metrics viewer-market-metrics';
              marketMetrics.append(
                metric('人気', horse.popularity == null ? '—' : `${horse.popularity}人気`, horse.popularity != null ? 'has-market' : ''),
                metric('オッズ', horse.odds == null ? '—' : formatViewerNumber(horse.odds, 1), horse.odds != null ? 'has-market' : ''),
                metric('EV', evText(horse), horse.expectedValue != null || (horse.aiWinRate != null && horse.odds != null) ? 'is-ev has-market' : 'is-ev'),
              );
              card.append(top, marketMetrics);
            } else {
              const marketMissing = document.createElement('div');
              marketMissing.className = 'viewer-market-missing-row';
              marketMissing.textContent = '市場データ未取得';
              card.append(top, marketMissing);
            }

            const predictionMetrics = document.createElement('div');
            predictionMetrics.className = 'viewer-horse-metrics viewer-prediction-metrics';

            const timeRank = ranks?.timeRank?.get(Number(horse.horseNo));
            predictionMetrics.append(
              metric('AI勝率', formatViewerPercent(horse.aiWinRate), 'is-primary'),
              metric('複勝率', formatViewerPercent(horse.aiTop3Rate), 'is-primary'),
              metric('予想TIME', timeText(horse), timeRank && timeRank <= 3 ? 'is-time-top' : ''),
            );
            card.append(predictionMetrics);

            const comment = featured ? shortComment(horse, ranks) : '';
            if (comment) {
              const note = document.createElement('p');
              note.className = 'viewer-short-comment';
              note.textContent = comment;
              card.append(note);
            }

            const gapInfo = ranks ? timeGapInfo(horse, ranks) : null;
            if (gapInfo) {
              const diagnostic = document.createElement('div');
              diagnostic.className = 'viewer-time-diagnostic';
              diagnostic.textContent = `⏱ ${gapInfo.text} — TIME評価乖離`;
              diagnostic.title = '予想TIME順位に対してAI勝率順位が低い馬です。AI勝率自体は変更していません。';
              card.append(diagnostic);
            }

            return card;
          }"""
          app = replace_between(
              app,
              "function mobileHorseCard(horse, featured = false, ranks = null) {",
              "\n\nfunction horseRow(horse) {",
              new_mobile_card,
              "mobile horse card",
          )

          new_mobile_race_body = r"""function mobileRaceBody(race) {
            const shell = document.createElement('div');
            shell.className = 'viewer-mobile-race-body';

            const primary = primaryHorses(race);
            const secondary = secondaryHorses(race, primary);
            const ranks = raceRanks(race);
            const hasPrimarySignal = primary.some(horseHasPrimarySignal);

            const focusWrap = document.createElement('section');
            focusWrap.className = 'viewer-focus';

            const focusHead = document.createElement('div');
            focusHead.className = 'viewer-focus-head';

            const focusTitle = document.createElement('strong');
            focusTitle.textContent = hasPrimarySignal ? '注目馬' : 'AI注目馬';

            const status = marketStatus(race);
            const marketBadge = document.createElement('span');
            marketBadge.className = `viewer-market-badge is-${status.state}`;
            marketBadge.textContent = status.text;

            focusHead.append(focusTitle, marketBadge);

            const focusList = document.createElement('div');
            focusList.className = 'viewer-focus-list';
            primary.forEach((horse) => focusList.append(mobileHorseCard(horse, true, ranks)));
            focusWrap.append(focusHead, focusList);

            const secondaryWrap = document.createElement('div');
            secondaryWrap.className = 'viewer-secondary-horses';
            secondaryWrap.hidden = true;
            secondary.forEach((horse) => secondaryWrap.append(mobileHorseCard(horse, true, ranks)));

            const allWrap = document.createElement('div');
            allWrap.className = 'viewer-all-horses';
            allWrap.hidden = true;
            race.horses.forEach((horse) =>
              allWrap.append(mobileHorseCard(horse, horseIsMarked(horse), ranks))
            );

            const actions = document.createElement('div');
            actions.className = 'viewer-action-row';
            const key = raceKey(race);

            const secondaryToggle = document.createElement('button');
            secondaryToggle.type = 'button';
            secondaryToggle.className = 'viewer-secondary-button';

            const allToggle = document.createElement('button');
            allToggle.type = 'button';
            allToggle.className = 'viewer-expand-button';

            const setSecondary = (expanded) => {
              secondaryWrap.hidden = !expanded;
              secondaryToggle.hidden = secondary.length === 0;
              secondaryToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
              secondaryToggle.textContent = expanded
                ? '○▲△を閉じる'
                : `○▲△を見る（${secondary.length}頭）`;
              if (expanded) expandedSecondaryRaces.add(key);
              else expandedSecondaryRaces.delete(key);
            };

            const setAll = (expanded) => {
              allWrap.hidden = !expanded;
              focusWrap.hidden = expanded;
              secondaryWrap.hidden = expanded ? true : !expandedSecondaryRaces.has(key);
              secondaryToggle.hidden = expanded || secondary.length === 0;
              allToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
              allToggle.textContent = expanded
                ? '注目馬に戻す'
                : `全頭を見る（${race.horses.length}頭）`;
              if (expanded) expandedRaces.add(key);
              else expandedRaces.delete(key);
            };

            secondaryToggle.addEventListener('click', () => {
              setSecondary(secondaryToggle.getAttribute('aria-expanded') !== 'true');
            });

            allToggle.addEventListener('click', () => {
              setAll(allToggle.getAttribute('aria-expanded') !== 'true');
            });

            actions.append(secondaryToggle, allToggle);
            shell.append(focusWrap, secondaryWrap, allWrap, actions);

            setSecondary(expandedSecondaryRaces.has(key));
            setAll(expandedRaces.has(key));
            return shell;
          }"""
          app = replace_between(
              app,
              "function mobileRaceBody(race) {",
              "\n\nfunction raceCard(race) {",
              new_mobile_race_body,
              "mobile race body",
          )

          if "abilityScore: market.abilityScore" not in app:
              app = replace_once(
                  app,
                  "        ...horse,\n"
                  "        odds: market.odds ?? horse.odds,",
                  "        ...horse,\n"
                  "        abilityScore: market.abilityScore ?? horse.abilityScore,\n"
                  "        abilityRank: market.abilityRank ?? horse.abilityRank,\n"
                  "        odds: market.odds ?? horse.odds,",
                  "market ability merge",
              )

          # --------------------------------------------------------
          # CSS
          # --------------------------------------------------------
          marker = "/* CHASS Viewer v3.6.1: ability + comments + compact hierarchy */"
          patch = r"""
          /* CHASS Viewer v3.6.1: ability + comments + compact hierarchy */
          .viewer-horse-card-top-v36 {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 8px;
          }

          .viewer-horse-card-marks.is-leading {
            justify-content: flex-start;
            min-width: 0;
          }

          .viewer-horse-card-marks.is-leading.is-empty {
            display: none;
          }

          .viewer-ability-badge {
            display: grid;
            grid-template-columns: auto auto;
            align-items: baseline;
            gap: 1px 5px;
            min-width: 70px;
            padding: 5px 7px;
            border: 1px solid var(--viewer-line);
            border-radius: 9px;
            background: var(--viewer-panel-2);
            text-align: right;
          }

          .viewer-ability-badge span {
            grid-column: 1;
            color: var(--viewer-muted);
            font-size: 8px;
            font-weight: 800;
          }

          .viewer-ability-badge strong {
            grid-column: 2;
            color: var(--viewer-text);
            font-size: 13px;
            line-height: 1;
          }

          .viewer-ability-badge em {
            grid-column: 1 / -1;
            color: var(--viewer-muted);
            font-size: 8px;
            font-style: normal;
            font-weight: 800;
          }

          .viewer-short-comment {
            margin: 6px 0 0;
            padding: 6px 8px;
            border-left: 2px solid var(--viewer-positive);
            border-radius: 0 7px 7px 0;
            background: var(--viewer-panel-2);
            color: var(--viewer-muted);
            font-size: 9px;
            font-weight: 700;
            line-height: 1.45;
          }

          .viewer-secondary-horses {
            border-top: 1px solid var(--viewer-line);
          }

          .viewer-secondary-horses[hidden] {
            display: none !important;
          }

          .viewer-action-row {
            display: flex;
            border-top: 1px solid var(--viewer-line);
            background: var(--viewer-panel-2);
          }

          .viewer-action-row .viewer-expand-button,
          .viewer-secondary-button {
            flex: 1 1 0;
            min-width: 0;
            min-height: 38px;
            border: 0;
            background: transparent;
            color: var(--viewer-muted);
            font-size: 10px;
            font-weight: 850;
            cursor: pointer;
          }

          .viewer-secondary-button[hidden] {
            display: none !important;
          }

          .viewer-secondary-button + .viewer-expand-button {
            border-left: 1px solid var(--viewer-line);
          }

          @media (max-width: 720px) {
            .viewer-horse-card-top-v36 {
              gap: 6px;
            }

            .viewer-ability-badge {
              min-width: 64px;
              padding: 5px 6px;
            }

            .viewer-ability-badge strong {
              font-size: 12px;
            }

            .viewer-short-comment {
              margin-top: 5px;
              padding: 5px 7px;
              font-size: 8px;
            }

            .viewer-action-row .viewer-expand-button,
            .viewer-secondary-button {
              min-height: 36px;
              font-size: 9px;
            }
          }
          """
          if marker not in css:
              css = css.rstrip() + "\n\n" + patch.strip() + "\n"

          core_path.write_text(core, encoding="utf-8")
          app_path.write_text(app, encoding="utf-8")
          css_path.write_text(css, encoding="utf-8")
          print("Applied CHASS Viewer v3.6.1 successfully.")
          PY

          cat > tests/viewer-ability-comment-v361.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { sanitizeViewerMarketPayload } from '../viewer/viewer-core.js';

          test('v3.6.1 exposes public ability score and rank only', () => {
            const market = sanitizeViewerMarketPayload({
              ok: true,
              date: '2026-09-12',
              track: '阪神',
              organization: 'JRA',
              horseColumns: [
                'horseNumber', 'horseName', 'abilityRank', 'score',
                'winProb', 'top3Prob', 'odds', 'popularity',
                'expectedValue', 'evRank', 'abilityPopularityGap',
                'diamond', 'warning',
              ],
              races: [{
                raceNumber: 2,
                raceName: '2歳未勝利',
                horses: [[6, 'テストホース', 2, 86.4, .22, .51, null, null, null, null, null, null, null]],
              }],
            });

            const horse = market.races[0].horses[0];
            assert.equal(horse.abilityRank, 2);
            assert.equal(horse.abilityScore, 86.4);
            assert.equal('distanceScore' in horse, false);
            assert.equal('courseScore' in horse, false);
            assert.equal('modelWeights' in horse, false);
          });

          test('v3.6.1 mobile UI has left marks, right ability and collapsible secondary marks', () => {
            const app = fs.readFileSync(new URL('../viewer/viewer-app.js', import.meta.url), 'utf8');
            const css = fs.readFileSync(new URL('../viewer/viewer.css', import.meta.url), 'utf8');

            assert.match(app, /SECONDARY_MARKS = new Set\(\['○', '▲', '△'\]\)/);
            assert.match(app, /○▲△を見る/);
            assert.match(app, /viewer-ability-badge/);
            assert.match(app, /公開用総合能力指数/);
            assert.match(app, /viewer-short-comment/);
