name: CHASS Workflow Cleanup + Consolidation v1.1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "まず audit_only。確認後 archive_safe_batch1"
        required: true
        default: "audit_only"
        type: choice
        options:
          - audit_only
          - archive_safe_batch1

permissions:
  contents: write

concurrency:
  group: chass-workflow-cleanup-consolidation-v11
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail

          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test -d .github/workflows
          test -f .github/workflows/CHASS-Workflow-Cleanup-Consolidation-v1.1.yml

          # 最新実装が本体へ反映済みであることを確認。
          grep -Fq "jra-drive-input-v1.5.0" jra-drive-prediction-input.mjs
          grep -Fq "CHASS-JRA-AUTO-LOAD-v1.5.2" app.js
          grep -Fq "CHASS-JRA-RACE-STATE-ISOLATION-v1.9.7" app.js
          grep -Fq "export async function readJraOfficialOddsCacheForViewer" jra-official-cache.mjs

          git diff --quiet

      - name: Build safe batch-1 plan
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          # この第1次整理は、最新版の実装が本体へ反映済みと確認できた
          # workflow_dispatch 型の旧 patch / installer のみを対象にする。
          CANDIDATES=(
            ".github/workflows/CHASS-JRA-Drive-Prediction-Input-v1.4.yml"
            ".github/workflows/CHASS-JRA-Drive-Prediction-Input-v1.4.1.yml"
            ".github/workflows/CHASS-JRA-Drive-Prediction-Input-v1.4.2.yml"
            ".github/workflows/CHASS-JRA-Drive-Prediction-Input-v1.4.3.yml"
            ".github/workflows/CHASS-JRA-Drive-Prediction-Input-v1.4.4.yml"

            ".github/workflows/CHASS-JRA-Friday-Drive-Fallback-v1.5.yml"
            ".github/workflows/CHASS-JRA-Friday-Drive-Fallback-v1.5.1.yml"

            ".github/workflows/CHASS-JRA-Auto-Load-Frontend-v1.5.yml"
            ".github/workflows/autoload_v151.yml"
            ".github/workflows/autoload_v152.yml"

            ".github/workflows/CHASS-JRA-Race-State-Isolation-All-Odds-Backfill-v1.9.yml"
            ".github/workflows/CHASS-JRA-Race-State-Isolation-All-Odds-Backfill-v1.9.1.yml"
            ".github/workflows/CHASS-JRA-Race-State-Isolation-All-Odds-Backfill-v1.9.2.yml"
            ".github/workflows/CHASS-JRA-Race-State-Isolation-All-Odds-Backfill-v1.9.3.yml"
            ".github/workflows/CHASS-JRA-Race-State-Isolation-All-Odds-Backfill-v1.9.4.yml"
            ".github/workflows/CHASS-JRA-Race-State-Isolation-All-Odds-Backfill-v1.9.5.yml"
            ".github/workflows/CHASS-JRA-Race-State-Isolation-All-Odds-Backfill-v1.9.6.yml"
            ".github/workflows/CHASS-JRA-Race-State-Isolation-All-Odds-Backfill-v1.9.7.yml"

            ".github/workflows/CHASS-JRA-Saved-Market-Persistence-v1.8.yml"
            ".github/workflows/CHASS-JRA-Saved-Market-Persistence-v1.8.1.yml"
            ".github/workflows/CHASS-JRA-Saved-Market-Persistence-v1.8.2.yml"
            ".github/workflows/CHASS-JRA-Saved-Market-Persistence-v1.8.3.yml"
            ".github/workflows/CHASS-JRA-Saved-Market-Persistence-v1.8.4.yml"
            ".github/workflows/CHASS-JRA-Saved-Market-Persistence-v1.8.5.yml"
            ".github/workflows/CHASS-JRA-Saved-Market-Persistence-v1.8.6.yml"
          )

          PLAN=/tmp/chass-cleanup-v11-plan.tsv
          : > "$PLAN"

          archive_count=0
          blocked_count=0
          missing_count=0

          for file in "${CANDIDATES[@]}"; do
            if [ ! -f "$file" ]; then
              printf 'MISSING\t%s\t%s\n' "$file" "candidate_not_present" >> "$PLAN"
              missing_count=$((missing_count + 1))
              continue
            fi

            # 定期/自動実行 workflow は絶対に自動退避しない。
            if grep -Eq '^[[:space:]]+(schedule|workflow_call|workflow_run|repository_dispatch|push|pull_request):' "$file"; then
              printf 'BLOCKED_ACTIVE_TRIGGER\t%s\t%s\n' "$file" "non_manual_trigger_detected" >> "$PLAN"
              blocked_count=$((blocked_count + 1))
              continue
            fi

            # 手動 workflow であることを必須条件にする。
            if ! grep -Eq 'workflow_dispatch:' "$file"; then
              printf 'BLOCKED_UNKNOWN\t%s\t%s\n' "$file" "workflow_dispatch_not_detected" >> "$PLAN"
              blocked_count=$((blocked_count + 1))
              continue
            fi

            printf 'ARCHIVE\t%s\t%s\n' "$file" "verified_superseded_manual_patch" >> "$PLAN"
            archive_count=$((archive_count + 1))
          done

          total_workflows="$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')"

          echo "archive_count=$archive_count" >> "$GITHUB_OUTPUT"
          echo "blocked_count=$blocked_count" >> "$GITHUB_OUTPUT"
          echo "missing_count=$missing_count" >> "$GITHUB_OUTPUT"
          echo "total_workflows=$total_workflows" >> "$GITHUB_OUTPUT"

          {
            echo "## CHASS Workflow Cleanup + Consolidation v1.1"
            echo
            echo "### SAFE BATCH 1 AUDIT"
            echo "- Mode: ${{ inputs.mode }}"
            echo "- 現在の workflow 数: $total_workflows"
            echo "- 退避可能: $archive_count"
            echo "- 自動退避禁止: $blocked_count"
            echo "- 既に存在しない: $missing_count"
            echo
            echo "|判定|ファイル|理由|"
            echo "|---|---|---|"
            while IFS=$'\t' read -r status file reason; do
              echo "|$status|\`$file\`|$reason|"
            done < "$PLAN"
            echo
            echo "### Safety"
            echo "- 削除は行わない"
            echo "- schedule / push / pull_request / workflow_call 等は自動で BLOCKED"
            echo "- 最新実装マーカーが本体に存在しない場合は開始前に失敗"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive verified superseded workflows
        if: ${{ inputs.mode == 'archive_safe_batch1' }}
        shell: bash
        run: |
          set -euo pipefail

          PLAN=/tmp/chass-cleanup-v11-plan.tsv
          STAMP="$(date -u +'%Y%m%d-%H%M%S')"
          ARCHIVE_DIR="archive/workflows/superseded/$STAMP"
          mkdir -p "$ARCHIVE_DIR"

          moved=0
          while IFS=$'\t' read -r status file reason; do
            [ "$status" = "ARCHIVE" ] || continue

            [ -f "$file" ] || {
              echo "::error::Planned archive file disappeared: $file"
              exit 1
            }

            git mv "$file" "$ARCHIVE_DIR/$(basename "$file")"
            moved=$((moved + 1))
          done < "$PLAN"

          if [ "$moved" -eq 0 ]; then
            echo "No verified superseded workflows to archive."
            exit 0
          fi

          # 稼働中/保護対象を最終確認。
          test -f .github/workflows/CHASS-Workflow-Cleanup-Consolidation-v1.0.yml
          test -f .github/workflows/CHASS-Workflow-Cleanup-Consolidation-v1.1.yml
          test -f .github/workflows/CHASS-JRA-Integrated-Race-Odds-Cache-Refresh-v2.0.yml
          test -f .github/workflows/CHASS-JRA-Result-Cache-Bridge-v1.0.yml
          test -f .github/workflows/publish-ai-snapshot.yml
          test -f .github/workflows/finalize-deploy.yml
          test -f .github/workflows/apply-nar-stabilization.yml
          test -f .github/workflows/repair-layout.yml

          cat > "$ARCHIVE_DIR/MANIFEST.md" <<EOF
          # CHASS Workflow Archive Manifest

          Archived at (UTC): $STAMP

          ## Purpose
          最新実装が本体へ反映済みと確認できた、過去の手動 patch / installer workflow を
          Actions 一覧から外すための可逆整理です。

          ## Policy
          - 削除: 0
          - 自動/定期 trigger を持つ workflow: 対象外
          - 必要時は .github/workflows/ へ戻して復元可能
          EOF

          {
            echo
            echo "## Archived files"
            while IFS=$'\t' read -r status file reason; do
              [ "$status" = "ARCHIVE" ] || continue
              echo "- $(basename "$file")"
            done < "$PLAN"
          } >> "$ARCHIVE_DIR/MANIFEST.md"

          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: archive verified superseded workflows batch 1"
          git push origin HEAD:main

          {
            echo
            echo "### archive_safe_batch1 完了"
            echo "- 移動数: $moved"
            echo "- Archive: \`$ARCHIVE_DIR\`"
            echo "- 削除: 0"
          } >> "$GITHUB_STEP_SUMMARY"
