name: CHASS JRA Saved Odds Overlay Fallback v1.9.9.1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate_only=検証のみ / apply_and_deploy=修正・main反映・本番デプロイ"
        required: true
        default: apply_and_deploy
        type: choice
        options:
          - validate_only
          - apply_and_deploy
      smoke_date:
        description: "本番確認用日付"
        required: true
        default: "2026-09-12"
        type: string
      smoke_track:
        description: "本番確認用競馬場"
        required: true
        default: "中山"
        type: string

permissions:
  contents: write

concurrency:
  group: chass-jra-saved-odds-overlay-fallback-v1991
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE_URL: https://chass-keiba-lab7.h7625421.workers.dev
      INPUT_MODE: ${{ inputs.mode }}
      SMOKE_DATE: ${{ inputs.smoke_date }}
      SMOKE_TRACK: ${{ inputs.smoke_track }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate v1.9.8 baseline and saved-market architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f jra-odds-client.js
          test -f jra-odds-fetch.mjs
          test -f worker.js
          test -f tests/jra-j3.test.mjs
          test -f tests/jra-saved-market-contract-v19.test.mjs
          test -f package.json
          test -f wrangler.jsonc
          grep -Fq "window.CHASS_JRA_ODDS_CLIENT" jra-odds-client.js
          grep -Fq "readJraOfficialOddsCache" jra-odds-fetch.mjs
          if grep -Fq "readJraOfficialOddsCacheForViewer" jra-odds-fetch.mjs; then
            echo "::error::Strict current odds service already contains viewer fallback. Refusing unsafe baseline."
            exit 11
          fi
          grep -Fq "async function publicViewerMarketOverlay(day,races,env)" worker.js
          grep -Fq "readJraOfficialOddsCacheForViewer" worker.js
          grep -Fq "viewerMarketOverlay=await publicViewerMarketOverlay(day,races,env)" worker.js
          node --check jra-odds-client.js
          node --check jra-odds-fetch.mjs
          node --check worker.js

      - name: Install saved-odds overlay fallback client
        shell: bash
        run: |
          set -euo pipefail
          cp jra-odds-client.js /tmp/jra-odds-client.before-v1991.js
          cat > /tmp/jra-odds-client-v1991.b64 <<'B64'
          
          B64
          base64 -d /tmp/jra-odds-client-v1991.b64 > jra-odds-client.js
          node --check jra-odds-client.js
          grep -Fq "CHASS-JRA-SAVED-ODDS-OVERLAY-FALLBACK-v1.9.9.1" jra-odds-client.js
          grep -Fq "/api/jra/odds?" jra-odds-client.js
          grep -Fq "/api/chass/v1/public/day-ai?" jra-odds-client.js
          grep -Fq "viewerMarket" jra-odds-client.js
          grep -Fq "保存オッズ" jra-odds-client.js
          grep -Fq "現在値ではありません" jra-odds-client.js
          grep -Fq "if(applied===false)" jra-odds-client.js
          if grep -Fq "readJraOfficialOddsCacheForViewer" jra-odds-fetch.mjs; then
            echo "::error::Viewer fallback leaked into strict current odds service."
            exit 12
          fi
          git diff -- jra-odds-client.js

      - name: Add v1.9.9.1 regression guard
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v1991-test.b64 <<'B64'
          
          B64
          base64 -d /tmp/v1991-test.b64 > tests/jra-saved-odds-overlay-fallback-v1991.test.mjs
          node --check tests/jra-saved-odds-overlay-fallback-v1991.test.mjs
          node --test tests/jra-saved-odds-overlay-fallback-v1991.test.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if [ -f mcp/package.json ]; then npm ci --prefix mcp; fi

      - name: Full regression check
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Explicitly verify the two v1.9.9 failures are repaired
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/jra-j3.test.mjs
          node --test tests/jra-saved-market-contract-v19.test.mjs
          node --test tests/jra-saved-odds-overlay-fallback-v1991.test.mjs

      - name: Validate change scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\\n' "$changed"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              jra-odds-client.js|tests/jra-saved-odds-overlay-fallback-v1991.test.mjs) ;;
              *) echo "::error::Unexpected modified file: $f"; exit 21 ;;
            esac
          done <<< "$changed"
          git diff --exit-code -- jra-odds-fetch.mjs worker.js app.js index.html

      - name: Validation-only conclusion
        if: ${{ inputs.mode == 'validate_only' }}
        run: |
          echo "## v1.9.9.1 validation PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- strict current odds endpoint: unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- saved odds fallback: public viewer overlay" >> "$GITHUB_STEP_SUMMARY"
          echo "- acquisition timestamp required for saved odds" >> "$GITHUB_STEP_SUMMARY"

      - name: Cloudflare authentication preflight
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx -y wrangler@4 whoami

      - name: Commit v1.9.9.1 source
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jra-odds-client.js tests/jra-saved-odds-overlay-fallback-v1991.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Use timestamped persisted JRA odds as client fallback"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy CHASS Worker and assets
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        run: npx -y wrangler@4 deploy

      - name: Production asset smoke
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code="$(curl -sS --max-time 20 -o /tmp/prod-client.js -w '%{http_code}' "$PRODUCTION_BASE_URL/jra-odds-client.js?ts=$(date +%s)" || true)"
            if [ "$code" = "200" ] && grep -Fq "CHASS-JRA-SAVED-ODDS-OVERLAY-FALLBACK-v1.9.9.1" /tmp/prod-client.js; then break; fi
            sleep 4
          done
          grep -Fq "CHASS-JRA-SAVED-ODDS-OVERLAY-FALLBACK-v1.9.9.1" /tmp/prod-client.js
          code="$(curl -sS --max-time 20 -G -o /tmp/viewer-market.json -w '%{http_code}' --data-urlencode "date=$SMOKE_DATE" --data-urlencode "track=$SMOKE_TRACK" --data-urlencode "organization=JRA" --data-urlencode "format=tabular" --data-urlencode "viewerMarket=1" "$PRODUCTION_BASE_URL/api/chass/v1/public/day-ai" || true)"
          echo "viewer market smoke HTTP=$code"
          if [ "$code" = "200" ]; then
            node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/viewer-market.json','utf8'));
          if(x.ok!==true)process.exit(1);
          const overlay=Array.isArray(x.viewerMarketOverlay)?x.viewerMarketOverlay:[];
          const rows=overlay.flatMap(r=>Array.isArray(r.horses)?r.horses:[]);
          const saved=rows.filter(h=>h.oddsStatus==='saved'&&h.oddsFetchedAt);
          const finalRows=rows.filter(h=>h.oddsStatus==='final');
          console.log(`viewerMarketOverlay races=${overlay.length} timestampedSaved=${saved.length} final=${finalRows.length}`);
          NODE
          else
            echo "::warning::Public viewer-market diagnostic unavailable for the smoke date; deployed client marker is verified."
          fi

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CHASS JRA Saved Odds Overlay Fallback v1.9.9.1"
            echo "- Mode: \`$INPUT_MODE\`"
            echo "- v1.9.9 failure 1: fixed — apply callback is rejected only on explicit boolean false"
            echo "- v1.9.9 failure 2: fixed — strict /api/jra/odds remains isolated from persisted viewer fallback"
            echo "- Priority: strict current odds -> timestamped persisted viewer odds -> unavailable"
            echo "- Saved odds label: 保存オッズ + acquisition time + 現在値ではありません"
            echo "- Exact race selection: date / track / race + generation guard"
            echo "- NAR logic: unchanged"
            echo "- prediction/ability logic: unchanged"
            echo "- D1 schema: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
