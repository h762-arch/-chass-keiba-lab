      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if [ -f mcp/package.json ]; then npm ci --prefix mcp; fi

      - name: Full regression check
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Validate change scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              jra-odds-fetch.mjs|jra-odds-client.js|app.js|index.html|tests/jra-saved-odds-timestamp-fallback-v199.test.mjs) ;;
              *) echo "::error::Unexpected modified file: $f"; exit 21 ;;
            esac
          done <<< "$changed"

      - name: Validation-only conclusion
        if: ${{ inputs.mode == 'validate_only' }}
        shell: bash
        run: |
          {
            echo "## CHASS JRA Saved Odds Timestamp Fallback v1.9.9"
            echo "- validation: PASS"
            echo "- production changes: NONE"
            echo "- saved odds policy: exact race only + acquisition timestamp required"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cloudflare authentication preflight
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx -y wrangler@4 whoami

      - name: Commit v1.9.9 source
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            jra-odds-fetch.mjs \
            jra-odds-client.js \
            app.js \
            index.html \
            tests/jra-saved-odds-timestamp-fallback-v199.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Use timestamped saved JRA odds when current cache expires"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Deploy CHASS Worker
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4 deploy

      - name: Production assets smoke
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail

          for i in 1 2 3 4 5 6; do
            code="$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$PRODUCTION_BASE_URL/api/chass/v1/public/health" || true)"
            [ "$code" = "200" ] && break
            sleep 4
          done
          test "$code" = "200"
          node -e "const x=require('/tmp/health.json');if(x.ok!==true)process.exit(1)"

          for i in 1 2 3 4 5 6; do
            code="$(curl -sS --max-time 20 -o /tmp/prod-odds-client.js -w '%{http_code}' "$PRODUCTION_BASE_URL/jra-odds-client.js?ts=$(date +%s)" || true)"
            if [ "$code" = "200" ] && grep -Fq "CHASS-JRA-SAVED-ODDS-TIMESTAMP-FALLBACK-v1.9.9" /tmp/prod-odds-client.js; then
              break
            fi
            sleep 4
          done
          grep -Fq "CHASS-JRA-SAVED-ODDS-TIMESTAMP-FALLBACK-v1.9.9" /tmp/prod-odds-client.js

          code="$(curl -sS --max-time 20 -o /tmp/prod-index.html -w '%{http_code}' "$PRODUCTION_BASE_URL/index.html?ts=$(date +%s)" || true)"
          test "$code" = "200"
          grep -Fq "<strong>単勝オッズ</strong>" /tmp/prod-index.html

      - name: Production saved-odds API smoke
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          qdate="$(node -p "encodeURIComponent(process.env.SMOKE_DATE)")"
          qtrack="$(node -p "encodeURIComponent(process.env.SMOKE_TRACK)")"
          qrace="$(node -p "encodeURIComponent(process.env.SMOKE_RACE)")"

          code=""
          for i in 1 2 3 4 5; do
            code="$(curl -sS -D /tmp/odds.headers --max-time 20 -o /tmp/odds.json -w '%{http_code}' \
              "$PRODUCTION_BASE_URL/api/jra/odds?date=$qdate&track=$qtrack&race=$qrace" || true)"
            [ "$code" = "200" ] && break
            sleep 4
          done

          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/odds.json','utf8'));
          if(x.ok!==true)throw new Error('odds api ok=false');
          if(!Array.isArray(x.odds)||x.odds.length<1)throw new Error('odds rows missing');
          if(!['current','saved','final'].includes(String(x.oddsFreshness||'')))throw new Error('oddsFreshness missing');
          if((x.oddsFreshness==='saved'||x.oddsFreshness==='final')&&!x.oddsAcquiredAt)throw new Error('saved/final odds timestamp missing');
          console.log({
            oddsFreshness:x.oddsFreshness,
            oddsAcquiredAt:x.oddsAcquiredAt,
            oddsHorseCount:x.quality?.oddsHorseCount,
            oddsSnapshotType:x.oddsSnapshotType
          });
          NODE

          echo "### Production odds smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- target: $SMOKE_DATE $SMOKE_TRACK ${SMOKE_RACE}R" >> "$GITHUB_STEP_SUMMARY"
          node -e "const x=require('/tmp/odds.json'); console.log('- freshness: '+x.oddsFreshness+'\n- acquiredAt: '+(x.oddsAcquiredAt||'unknown')+'\n- horses: '+(x.quality?.oddsHorseCount||0))" >> "$GITHUB_STEP_SUMMARY"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CHASS JRA Saved Odds Timestamp Fallback v1.9.9"
            echo "- Mode: \`$INPUT_MODE\`"
            echo "- Current odds: strict D1 row first"
            echo "- Expired exact-race odds: saved fallback enabled"
            echo "- Saved odds: acquisition timestamp shown; never labeled as current"
            echo "- Final odds: preserved as final"
            echo "- Race identity guard: preserved"
            echo "- JRA horse identity / prediction logic: unchanged"
            echo "- NAR logic: unchanged"
            echo "- D1 schema: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"
