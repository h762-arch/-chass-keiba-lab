name: CHASS JRA Saved Odds Timestamp Fallback v1.9.9

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate_only=検証のみ / apply_and_deploy=修正・main反映・本番デプロイ"
        required: true
        default: apply_and_deploy
        type: choice
        options:
          - validate_only
          - apply_and_deploy
      smoke_date:
        description: "本番API確認用の日付"
        required: true
        default: "2026-09-12"
        type: string
      smoke_track:
        description: "本番API確認用の競馬場"
        required: true
        default: "中山"
        type: string
      smoke_race:
        description: "本番API確認用のレース番号"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: chass-jra-saved-odds-timestamp-fallback-v199
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE_URL: https://chass-keiba-lab7.h7625421.workers.dev
      INPUT_MODE: ${{ inputs.mode }}
      SMOKE_DATE: ${{ inputs.smoke_date }}
      SMOKE_TRACK: ${{ inputs.smoke_track }}
      SMOKE_RACE: ${{ inputs.smoke_race }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Validate current baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f jra-official-cache.mjs
          test -f jra-odds-fetch.mjs
          test -f jra-odds-client.js
          test -f app.js
          test -f index.html
          test -f package.json
          test -f wrangler.jsonc
          grep -Fq "readJraOfficialOddsCacheForViewer" jra-official-cache.mjs
          grep -Fq "readJraOfficialOddsCache" jra-odds-fetch.mjs
          grep -Fq "window.CHASS_JRA_ODDS_CLIENT" jra-odds-client.js
          grep -Fq "function commitJraOdds(data,generation)" app.js
          grep -Fq "function marketSourceLabel(race=state.race)" app.js
          node --check jra-official-cache.mjs
          node --check jra-odds-fetch.mjs
          node --check jra-odds-client.js
          node --check app.js

      - name: Patch saved-odds fallback and timestamp display
        shell: bash
        run: |
          set -euo pipefail
          cp jra-odds-fetch.mjs /tmp/jra-odds-fetch.before-v199.mjs
          cp jra-odds-client.js /tmp/jra-odds-client.before-v199.js
          cp app.js /tmp/app.before-v199.js
          cp index.html /tmp/index.before-v199.html

          cat > /tmp/patch-v199.b64 <<'B64'
