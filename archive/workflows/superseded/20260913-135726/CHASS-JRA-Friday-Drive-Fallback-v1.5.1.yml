            echo "- Past-run capacity from Drive: 10"
            echo "- 1-5 recent runs: primary"
            echo "- 6-10 runs: supporting evidence"
            echo "- Drive forecast odds/popularity used as ability market: NO"
            echo "- Production Worker deploy: completed"
          } >> "$GITHUB_STEP_SUMMARY"
