# retrigger after cleanup

name: CHASS Apply Drive Runtime Decommission

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'CHASS_DRIVE_RUNTIME_DECOMMISSION_PATCH.zip'
      - '.github/workflows/CHASS-Apply-Drive-Runtime-Decommission.yml'

permissions:
  contents: write

concurrency:
  group: chass-drive-runtime-decommission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-audit-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      BASELINE_SHA: f77949584fe6e4d83dde95033ba5c894d244eb46
      PATCH_ZIP: CHASS_DRIVE_RUNTIME_DECOMMISSION_PATCH.zip
      PATCH_SHA256: 53e76015216aaee9f8b4d8cb43bf2a672ba5877cde4269cf6eb964a4971593f6
      TEMP_WORKFLOW: .github/workflows/CHASS-Apply-Drive-Runtime-Decommission.yml
      IMMUTABLE_0006_SHA256: a6287099178296d31c745cb49a25b9736d807c3665bf7364a665e0842ab6ad77

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" != "main"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD

      - name: Verify pre-apply branch diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASELINE_SHA" HEAD | sort > /tmp/preapply.txt
          cat > /tmp/preapply.expected <<EOF
          $PATCH_ZIP
          $TEMP_WORKFLOW
          EOF
          sort -o /tmp/preapply.expected /tmp/preapply.expected
          diff -u /tmp/preapply.expected /tmp/preapply.txt

      - name: Verify PATCH SHA-256
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum "$PATCH_ZIP" | awk '{print $1}')"
          echo "PATCH SHA-256: $ACTUAL"
          test "$ACTUAL" = "$PATCH_SHA256"

      - name: Verify exact ZIP entries and safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, stat, zipfile
          expected = sorted([
              ".github/workflows/CHASS-JRA-Health-Smoke-v1.0.yml",
              "CHANGED_FILES_DRIVE_DECOMMISSION.txt",
              "reports/10_DRIVE_RUNTIME_DECOMMISSION.md",
              "tests/google-drive-runtime-decommission.test.mjs",
              "worker.js",
              "wrangler.jsonc",
          ])
          with zipfile.ZipFile("CHASS_DRIVE_RUNTIME_DECOMMISSION_PATCH.zip") as z:
              names = sorted(z.namelist())
              if names != expected:
                  raise SystemExit(f"ZIP whitelist mismatch: {names}")
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or ".." in p.parts or "\\" in info.filename:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink forbidden: {info.filename}")
              if z.testzip():
                  raise SystemExit("ZIP integrity check failed")
          PY

      - name: Capture protected baseline
        shell: bash
        run: |
          set -euo pipefail
          sha256sum migrations/*.sql | sort > /tmp/migrations.before
          test "$(sha256sum migrations/0006_jra_background_refresh.sql | awk '{print $1}')" = "$IMMUTABLE_0006_SHA256"
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          test "$(node -p "require('./mcp/package.json').name")" = "chass-keiba-lab-mcp"
          test "$(node -p "require('./mcp/package.json').version")" = "9.9.35"

      - name: Expand PATCH
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("CHASS_DRIVE_RUNTIME_DECOMMISSION_PATCH.zip") as z:
              z.extractall(".")
          PY

      - name: Apply exact deletion manifest
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/CHASS-JRA-D1-Retention-v1.0.yml \
            google-drive-readonly-api.mjs \
            google-drive-readonly-import.mjs \
            jra-drive-prediction-input.mjs \
            tests/google-drive-cloudflare-api.test.mjs \
            tests/google-drive-readonly-import.test.mjs \
            tests/jra-drive-friday-fallback-v15.test.mjs \
            tests/jra-drive-prediction-input.test.mjs
          do
            test -e "$f"
            rm -f "$f"
          done
          rm -f "$PATCH_ZIP" "$TEMP_WORKFLOW"

      - name: Verify decommission invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "from './jra-race-fetch.mjs'" worker.js
          ! grep -Fq "jra-drive-prediction-input.mjs" worker.js
          ! grep -Fq "/api/drive-read/health" worker.js
          ! grep -Fq "/api/chass/v1/drive" worker.js
          ! grep -Fq "handleDriveReadHealth" worker.js
          ! grep -Fq "handleDriveReadBridge" worker.js
          ! grep -Fq '"CHASS_DRIVE_SPREADSHEET_ID"' wrangler.jsonc
          grep -Fq '"ENABLE_BACKGROUND_PRECOMPUTE": "false"' wrangler.jsonc
          grep -Fq '"ENABLE_PRECOMPUTED_VIEWER": "false"' wrangler.jsonc
          grep -Fq '"binding": "DB"' wrangler.jsonc
          grep -Fq '"*/5 * * * *"' wrangler.jsonc
          grep -Fq '"0 11 * * *"' wrangler.jsonc
          grep -Fq '"30 11 * * *"' wrangler.jsonc

      - name: Static active-runtime scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          forbidden = [
              "oauth2.googleapis.com",
              "sheets.googleapis.com",
              "GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON",
              "ENABLE_DRIVE_READ_IMPORT",
              "CHASS_DRIVE_SPREADSHEET_ID",
              "/api/drive-read/health",
              "/api/chass/v1/drive",
              "handleDriveReadHealth",
              "handleDriveReadBridge",
          ]
          files = []
          for name in ["worker.js","worker-entry.mjs","wrangler.jsonc","server.mjs","app.js"]:
              p=Path(name)
              if p.exists(): files.append(p)
          for root in [Path("src"),Path("mcp")]:
              if root.exists():
                  files.extend(p for p in root.rglob("*") if p.is_file() and p.suffix in {".js",".mjs",".json"})
          wf=Path(".github/workflows")
          if wf.exists():
              files.extend(p for p in wf.iterdir() if p.is_file() and p.suffix in {".yml",".yaml"})
          hits=[]
          for p in files:
              s=p.read_text(encoding="utf-8",errors="replace")
              for token in forbidden:
                  if token in s:
                      hits.append((str(p),token))
          if hits:
              for p,t in hits: print("FORBIDDEN",p,t)
              raise SystemExit(1)
          print("Drive runtime scan PASS")
          PY

      - name: Verify migrations and protected prediction files unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum migrations/*.sql | sort > /tmp/migrations.after
          diff -u /tmp/migrations.before /tmp/migrations.after
          test "$(sha256sum migrations/0006_jra_background_refresh.sql | awk '{print $1}')" = "$IMMUTABLE_0006_SHA256"
          git diff --exit-code "$BASELINE_SHA" -- migrations/
          git diff --exit-code "$BASELINE_SHA" -- app.js
          git diff --exit-code "$BASELINE_SHA" -- src/prediction/precomputed-snapshot.mjs
          git diff --exit-code "$BASELINE_SHA" -- src/prediction/background-precompute.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix mcp

      - name: Full regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: JRA J1-J5
        shell: bash
        run: |
          set -euo pipefail
          npm run test:jra-j1
          npm run test:jra-j2
          npm run test:jra-j3
          npm run test:jra-j4
          npm run test:jra-j5

      - name: Protected targeted tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/nar-*.test.mjs
          node --test tests/public-read-only-api.test.mjs
          node --test tests/ai-data-bridge.test.mjs
          node --test tests/google-drive-runtime-decommission.test.mjs
          node --test tests/google-drive-production.test.mjs
          node --test tests/nar-exchange-race.test.mjs
          node --test tests/precomputed-snapshot.test.mjs tests/background-precompute.test.mjs
          node --test tests/model-governance.test.mjs tests/model-governance-schema.test.mjs
          node --test tests/historical-race-audit.test.mjs
          node --test tests/active-race-integrity.test.mjs tests/repository-layout.test.mjs

      - name: Migration dry-run 0001-0012
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          migrations=sorted(Path("migrations").glob("*.sql"))
          actual=[p.name[:4] for p in migrations]
          expected=[f"{i:04d}" for i in range(1,13)]
          if actual != expected:
              raise SystemExit(f"Unexpected migration sequence: {actual}")
          db=sqlite3.connect(":memory:")
          try:
              for p in migrations:
                  db.executescript(p.read_text(encoding="utf-8"))
          finally:
              db.close()
          print("Migration dry-run PASS")
          PY

      - name: Verify exact final 14-file diff
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-only "$BASELINE_SHA" | sort > /tmp/final.txt
          cat > /tmp/final.expected <<'EOF'
          .github/workflows/CHASS-JRA-D1-Retention-v1.0.yml
          .github/workflows/CHASS-JRA-Health-Smoke-v1.0.yml
          CHANGED_FILES_DRIVE_DECOMMISSION.txt
          google-drive-readonly-api.mjs
          google-drive-readonly-import.mjs
          jra-drive-prediction-input.mjs
          reports/10_DRIVE_RUNTIME_DECOMMISSION.md
          tests/google-drive-cloudflare-api.test.mjs
          tests/google-drive-readonly-import.test.mjs
          tests/google-drive-runtime-decommission.test.mjs
          tests/jra-drive-friday-fallback-v15.test.mjs
          tests/jra-drive-prediction-input.test.mjs
          worker.js
          wrangler.jsonc
          EOF
          sort -o /tmp/final.expected /tmp/final.expected
          diff -u /tmp/final.expected /tmp/final.txt
          test ! -e "$PATCH_ZIP"
          test ! -e "$TEMP_WORKFLOW"

      - name: Commit tested Hotfix to work branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" != "main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: fully decommission Google Drive runtime"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CHASS Drive Runtime Decommission"
            echo
            echo "- Baseline: \`$BASELINE_SHA\`"
            echo "- PATCH SHA-256: \`$PATCH_SHA256\`"
            echo "- Production deploy: **NO**"
            echo "- Production D1 migration: **NO**"
            echo "- Precompute / Viewer flags: **OFF**"
            echo "- main direct push: **NO**"
          } >> "$GITHUB_STEP_SUMMARY"
