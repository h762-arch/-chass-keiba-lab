name: CHASS Signal Policy v1.1.1 One-Shot Apply

on:
  push:
    branches:
      - chass/signal-policy-v1-1
    paths:
      - '.github/workflows/CHASS-Signal-Policy-v1.1.1-Apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chass-signal-policy-v1-1-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" != "main" || { echo "::error::Run this only on a dedicated branch, not main."; exit 1; }
          test "$GITHUB_REF_NAME" = "chass/signal-policy-v1-1" || { echo "::error::Expected branch chass/signal-policy-v1-1."; exit 1; }
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "4abda552218887701a8bd52379890250de54a6a6" || { echo "::error::main moved after audit; stop for re-review."; exit 1; }
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          test -f app.js
          APP_BLOB="$(git hash-object app.js)"
          if [ "$APP_BLOB" != "edebc2440567ad0eb45f65d51287d1f1cb302e7c" ] && ! grep -q "CHASS-SIGNAL-v1.0" app.js; then
            echo "::error::app.js changed from the audited baseline. Stop instead of patching an unknown source. blob=$APP_BLOB"
            exit 1
          fi
          PRE_CHANGED="$(git diff --name-only origin/main...HEAD | sort)"
          EXPECTED="$(printf '%s\n' .github/workflows/CHASS-Signal-Policy-v1.1-Apply.yml .github/workflows/CHASS-Signal-Policy-v1.1.1-Apply.yml | sort)"
          if [ "$PRE_CHANGED" != "$EXPECTED" ]; then
            echo "::error::Branch contains unexpected changes before apply:"
            echo "Changed:"
            echo "$PRE_CHANGED"
            echo "Expected:"
            echo "$EXPECTED"
            exit 1
          fi

      - name: Materialize audited patcher and focused test
        shell: bash
        env:
          PATCHER_B64: 
          TEST_B64: 
        run: |
          set -euo pipefail
          mkdir -p /tmp/chass-signal-policy tests
          printf '%s' "$PATCHER_B64" | base64 -d > /tmp/chass-signal-policy/apply_signal_policy_v1.py
          printf '%s' "$TEST_B64" | base64 -d > tests/signal-policy-v1.test.mjs
          python3 -m py_compile /tmp/chass-signal-policy/apply_signal_policy_v1.py
          node --check tests/signal-policy-v1.test.mjs

      - name: Apply fixed signal policy
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/chass-signal-policy/apply_signal_policy_v1.py app.js
          node --check app.js
          grep -q "CHASS-SIGNAL-v1.0" app.js
          ! grep -q "popularity>=1&&popularity<=3&&h.ev!=null&&h.ev<75" app.js

      - name: Align legacy place-longshot regression fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('regression.test.mjs')
          s=p.read_text(encoding='utf-8')
          pattern=r"(test\('place longshot is separated from win longshot'.*?h\.place=35;)(h\.ev=90;)"
          replacement=r"\1h.odds=40;h.ev=120;"
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'expected one legacy place-longshot fixture, got {n}')
          p.write_text(s2,encoding='utf-8')
          PY
          grep -q "h.odds=40;h.ev=120;" regression.test.mjs

      - name: Run focused signal-policy tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/signal-policy-v1.test.mjs

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix mcp

      - name: Compatibility safety check
        shell: bash
        run: |
          set -euo pipefail
          grep -qF "reconcileMarketDerivedValues(next.horses,next.race);" app.js
          grep -qF "applyFrozenSignalSnapshot(next.horses,existing.marketSnapshot?.signalSnapshot||null);" app.js
          node --check app.js
          node --check regression.test.mjs

      - name: Full regression
        run: npm run check

      - name: Stage downloadable replacement artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHASS_SIGNAL_POLICY_v1_1_1_REPLACE_ONLY
          path: |
            app.js
            regression.test.mjs
            tests/signal-policy-v1.test.mjs
          if-no-files-found: error
          retention-days: 14

      - name: Final safety audit
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          git diff --check
          rm -f .github/workflows/CHASS-Signal-Policy-v1.1-Apply.yml
          rm -f .github/workflows/CHASS-Signal-Policy-v1.1.1-Apply.yml
          CHANGED="$(git diff --name-only origin/main -- | sort)"
          EXPECTED="$(printf '%s\n' app.js regression.test.mjs tests/signal-policy-v1.test.mjs | sort)"
          if [ "$CHANGED" != "$EXPECTED" ]; then
            echo "::error::Unexpected final tree diff."
            echo "Changed:"
            echo "$CHANGED"
            echo "Expected:"
            echo "$EXPECTED"
            exit 1
          fi
          echo "Final net diff is exactly app.js + regression.test.mjs + tests/signal-policy-v1.test.mjs"

      - name: Commit final three-file change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(signals): enforce CHASS diamond warning policy v1"
          git push origin "HEAD:$GITHUB_REF_NAME"
