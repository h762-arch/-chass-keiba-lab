name: Fix CHASS Viewer Date Availability v3.4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chass-viewer-date-availability-v34
  cancel-in-progress: false

jobs:
  fix-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify v3.3 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f viewer/index.html
          test -f viewer/viewer-core.js
          test -f viewer/viewer-app.js
          test -f viewer/viewer.css
          grep -Fq "TIME評価乖離" viewer/viewer-app.js
          grep -Fq "viewer-race-nav" viewer/viewer-app.js
          grep -Fq "buildViewerMarketDayUrl" viewer/viewer-app.js
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          echo "v3.3 baseline OK"

