name: Polish CHASS Viewer Empty Date UI v3.5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chass-viewer-empty-date-v35
  cancel-in-progress: false

jobs:
  polish-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify v3.4 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f viewer/index.html
          test -f viewer/viewer-core.js
          test -f viewer/viewer-app.js
          test -f viewer/viewer.css
          grep -Fq "showNoSavedDate" viewer/viewer-app.js
          grep -Fq "buildViewerRecentUrl" viewer/viewer-app.js
          grep -Fq "最新保存日" viewer/viewer-app.js
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          echo "Date Availability v3.4 baseline OK"

