name: Upgrade CHASS Viewer Market UI v3.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chass-viewer-market-ui-v31
  cancel-in-progress: false

jobs:
  upgrade-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Smart Viewer v3 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f viewer/viewer-core.js
          test -f viewer/viewer-app.js
          test -f viewer/viewer.css
          test -f viewer/index.html
          grep -Fq "全頭を見る" viewer/viewer-app.js
          grep -Fq "viewer-track-chip" viewer/viewer-app.js
          grep -Fq "format: 'compact'" viewer/viewer-core.js
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          echo "Smart Viewer v3 baseline OK"

      - name: Apply Market UI v3.1 files
