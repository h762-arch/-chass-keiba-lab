"""Offline validation only: no GitHub dispatch or race/API acquisition."""
import json
import os
from pathlib import Path
import subprocess
import tempfile
import unittest
import yaml

ROOT = Path(__file__).resolve().parent
WORKFLOW = ROOT / "CHASS-NAR-EARLY-Live-Smoke-Once-v1.yml"
CONFIG = yaml.safe_load(WORKFLOW.read_text(encoding="utf-8"))
STEPS = CONFIG["jobs"]["smoke"]["steps"]
RUN = STEPS[3]["run"]
VALIDATOR = RUN.split("node --input-type=module <<'NODE'\n", 1)[1].split("\nNODE\n", 1)[0]
AUTH = {"formalKpiReadiness": "HOLD", "probabilityDecision": "MODEL_HOLD", "productionActivationDecision": "NO-GO", "saved": False, "freezeExecuted": False}


def report(status="HOLD"):
    return {"version": "CHASS_NAR_EARLY_SMOKE_ONCE_V1", "status": status,
            "reasons": ["LIVE_CAPTURE_FAILED"] if status == "HOLD" else [], **AUTH}


class WorkflowTests(unittest.TestCase):
    def run_validator(self, data, exit_code, receipt=None, raw=False):
        with tempfile.TemporaryDirectory(prefix="chass-smoke-yaml-test-") as temp:
            parent = Path(temp)
            safe = parent / "chass-nar-smoke-safe"
            safe.mkdir()
            (parent / "chass-nar-smoke-stdout-private.json").write_text(data if raw else json.dumps(data), encoding="utf-8")
            (parent / "chass-nar-smoke-stderr-private.jsonl").write_text(json.dumps(receipt) if receipt else "PRIVATE_STDERR", encoding="utf-8")
            child = subprocess.run(["node", "--input-type=module"], input=VALIDATOR, text=True, capture_output=True,
                                   env={**os.environ, "RUNNER_TEMP": temp, "SMOKE_EXIT": str(exit_code)}, timeout=5)
            files = {p.name: p.read_text(encoding="utf-8") for p in safe.iterdir()}
            return child, files, json.loads(files["report.json"])

    def test_workflow_structure_and_permissions(self):
        self.assertEqual(set(CONFIG["on"]), {"workflow_dispatch"})
        self.assertEqual(CONFIG["permissions"], {"contents": "read"})
        self.assertFalse(CONFIG["concurrency"]["cancel-in-progress"])
        self.assertEqual(CONFIG["jobs"]["smoke"]["timeout-minutes"], 5)
        self.assertEqual(STEPS[1]["with"]["persist-credentials"], False)
        self.assertEqual(RUN.count("node scripts/run-live-nar-early-smoke-once-v1.mjs"), 1)
        self.assertNotIn("${{ inputs.", RUN)
        self.assertNotIn("secrets.", WORKFLOW.read_text(encoding="utf-8"))
        paths = STEPS[-1]["with"]["path"].splitlines()
        self.assertEqual(len(paths), 3)
        self.assertTrue(all("/chass-nar-smoke-safe/" in p and "*" not in p for p in paths))

    def test_shell_and_node_syntax(self):
        for step in STEPS:
            if "run" in step:
                subprocess.run(["bash", "-n"], input=step["run"], text=True, check=True, capture_output=True)
        subprocess.run(["node", "--input-type=module", "--check"], input=VALIDATOR, text=True, check=True, capture_output=True)

    def test_context_guard_first_attempt_main_and_exact_sha(self):
        valid = {"SMOKE_REF": "refs/heads/main", "SMOKE_EVENT": "workflow_dispatch", "SMOKE_ATTEMPT": "1", "SMOKE_SHA": "a" * 40, "SMOKE_EXPECTED": "a" * 40}
        for patch in [{}, {"SMOKE_REF": "refs/heads/other"}, {"SMOKE_ATTEMPT": "2"}, {"SMOKE_EXPECTED": "b" * 40}, {"SMOKE_EVENT": "push"}]:
            child = subprocess.run(["bash"], input=STEPS[0]["run"], text=True, capture_output=True, env={**os.environ, **valid, **patch})
            self.assertEqual(child.returncode == 0, not patch)

    def test_hold_preserves_real_exit_and_no_stderr(self):
        child, files, parsed = self.run_validator(report(), 2)
        self.assertEqual(child.returncode, 2)
        self.assertEqual(parsed["status"], "HOLD")
        self.assertEqual(parsed["wrapperExitCode"], 2)
        self.assertEqual(files["exit-code.txt"], "2\n")
        self.assertNotIn("PRIVATE", json.dumps(files))

    def test_valid_degraded_runner_is_ready_without_promoting_authority(self):
        data = report("LOCAL_PRESTART_MAPPING_READY")
        data.update(execution={"runnerExitCode": 0}, runnerReport={"status": "LOCAL_PRESTART_MAPPING_READY", "mappedPredictionReadiness": "FINAL5_READY_DEGRADED"})
        child, _, parsed = self.run_validator(data, 0)
        self.assertEqual(child.returncode, 0)
        self.assertEqual(parsed["status"], "LOCAL_PRESTART_MAPPING_READY")
        self.assertEqual(parsed["formalKpiReadiness"], "HOLD")

    def test_success_requires_real_runner_exit_and_readiness(self):
        for runner in [{"status": "HOLD"}, {"status": "LOCAL_PRESTART_MAPPING_READY", "mappedPredictionReadiness": "PREDICTION_HOLD"}]:
            data = report("LOCAL_PRESTART_MAPPING_READY")
            data.update(execution={"runnerExitCode": 2}, runnerReport=runner)
            child, _, parsed = self.run_validator(data, 0)
            self.assertEqual(child.returncode, 2)
            self.assertEqual(parsed["reasons"], ["ACTIONS_REPORT_INVALID"])

    def test_conflicting_exit_is_hold(self):
        child, _, parsed = self.run_validator(report(), 0)
        self.assertEqual(child.returncode, 2)
        self.assertEqual(parsed["reasons"], ["ACTIONS_REPORT_INVALID"])

    def test_non_json_is_not_uploaded(self):
        child, files, parsed = self.run_validator("PRIVATE_RAW_API", 2, raw=True)
        self.assertEqual(child.returncode, 2)
        self.assertEqual(parsed["reasons"], ["ACTIONS_REPORT_INVALID"])
        self.assertNotIn("PRIVATE", json.dumps(files))

    def test_forbidden_nested_payload_is_not_uploaded(self):
        for key in ["sourceRef", "snapshot", "RESULT", "resultSnapshot", "body", "stack", "message"]:
            data = {**report(), "runnerReport": {key: "PRIVATE_RAW_API"}}
            child, files, parsed = self.run_validator(data, 2)
            self.assertEqual(child.returncode, 2)
            self.assertEqual(parsed["reasons"], ["ACTIONS_REPORT_INVALID"])
            self.assertNotIn("PRIVATE", json.dumps(files))

    def test_bad_authority_is_hold(self):
        data = {**report(), "productionActivationDecision": "GO"}
        child, _, parsed = self.run_validator(data, 2)
        self.assertEqual(child.returncode, 2)
        self.assertEqual(parsed["productionActivationDecision"], "NO-GO")

    def test_receipt_projects_hashes_and_clocks_only(self):
        receipt = {"launch": {"commit": "a" * 40, "launchAt": "2026-10-19T00:00:00.000Z", "freezeAt": "2026-10-19T00:00:30.000Z", "appSourceSha256": "b" * 64, "invocationSha256": "c" * 64, "sourceRef": "PRIVATE_SOURCE"}}
        _, files, _ = self.run_validator(report(), 2, receipt)
        self.assertEqual(set(json.loads(files["launch-receipt.json"])), {"commit", "launchAt", "freezeAt", "appSourceSha256", "invocationSha256"})
        self.assertNotIn("PRIVATE", json.dumps(files))


if __name__ == "__main__":
    unittest.main(verbosity=2)
