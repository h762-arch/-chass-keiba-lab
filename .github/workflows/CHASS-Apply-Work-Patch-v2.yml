name: CHASS Apply Work Patch v2

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'CHASS_WORK_PATCH_v2.zip'
      - '.github/workflows/CHASS-Apply-Work-Patch-v2.yml'

permissions:
  contents: write

concurrency:
  group: chass-apply-work-patch-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-tested-patch:
    if: github.actor != 'github-actions[bot]'
    name: Verify, expand, test, and commit PATCH v2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASELINE_SHA: d9efc6e726f3c1849225de5eced91e25299b5cb4
      PATCH_ZIP: CHASS_WORK_PATCH_v2.zip
      EXPECTED_PATCH_SHA256: 2e9201dd4fb2c05f6fd54d490fca04f6c8d344bd4381ab40d6bef3b5a8011824
      EXPECTED_0006_SHA256: a6287099178296d31c745cb49a25b9736d807c3665bf7364a665e0842ab6ad77
      APPLY_COMMIT_MESSAGE: "feat: add CHASS audit, precompute, governance foundations and NAR exchange fix"

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Safety guard - never apply on main
        shell: bash
        run: |
          set -euo pipefail

          echo "Branch: ${GITHUB_REF_NAME}"
          echo "HEAD:   $(git rev-parse HEAD)"

          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "::error::This patch workflow must never run on the default/production branch."
            exit 1
          fi

          git cat-file -e "${BASELINE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASELINE_SHA}" HEAD

      - name: Verify pre-apply branch contains only workflow and transport ZIP
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-only "${BASELINE_SHA}..HEAD" | sort > /tmp/preexisting-files.txt

          cat > /tmp/allowed-preexisting-files.txt <<'EOF'
          .github/workflows/CHASS-Apply-Work-Patch-v2.yml
          CHASS_WORK_PATCH_v2.zip
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/allowed-preexisting-files.txt
          sort -o /tmp/allowed-preexisting-files.txt /tmp/allowed-preexisting-files.txt

          echo "Files already changed on branch:"
          cat /tmp/preexisting-files.txt

          diff -u /tmp/allowed-preexisting-files.txt /tmp/preexisting-files.txt

      - name: Verify PATCH ZIP exists and SHA-256 matches
        shell: bash
        run: |
          set -euo pipefail

          test -f "${PATCH_ZIP}"

          ACTUAL="$(sha256sum "${PATCH_ZIP}" | awk '{print $1}')"
          echo "Expected SHA-256: ${EXPECTED_PATCH_SHA256}"
          echo "Actual   SHA-256: ${ACTUAL}"

          test "${ACTUAL}" = "${EXPECTED_PATCH_SHA256}"

          unzip -t "${PATCH_ZIP}"

      - name: Verify exact 33-file PATCH whitelist and ZIP safety
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/expected-files.txt <<'EOF'
          app.js
          CHANGED_FILES.txt
          package.json
          worker.js
          wrangler.jsonc
          docs/CHASS_GITHUB_UPLOAD_AND_PR_DRAFT.md
          docs/CHASS_MODEL_GOVERNANCE_V1.md
          migrations/0011_model_governance.sql
          migrations/0012_precomputed_snapshots.sql
          reports/00_BASELINE_AUDIT.md
          reports/01_NAR_JRA_EXCHANGE_HOTFIX.md
          reports/02_HISTORICAL_RACE_AUDIT.md
          reports/03_METRIC_ELIGIBILITY.md
          reports/04_SAFE_RECOVERY_LOG.md
          reports/05_PRECOMPUTED_ARCHITECTURE.md
          reports/06_MODEL_GOVERNANCE.md
          reports/07_FULL_REGRESSION.md
          reports/08_FINAL_HANDOFF.md
          reports/09_PRE_PR_AUDIT_CORRECTION.md
          scripts/export-historical-audit-sheets.mjs
          scripts/rebuild-historical-audit.mjs
          src/nar/exchange-origin.mjs
          src/prediction/background-precompute.mjs
          src/prediction/precomputed-snapshot.mjs
          src/research/historical-race-audit.mjs
          src/research/model-governance.js
          tests/background-precompute.test.mjs
          tests/fixtures/nar-exchange-kawasaki-2026-06-16-6.html
          tests/historical-race-audit.test.mjs
          tests/model-governance-schema.test.mjs
          tests/model-governance.test.mjs
          tests/nar-exchange-race.test.mjs
          tests/precomputed-snapshot.test.mjs
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/expected-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt

          unzip -Z1 "${PATCH_ZIP}" | sed '/\/$/d' | sort > /tmp/actual-files.txt

          echo "PATCH contents:"
          cat /tmp/actual-files.txt

          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          python - <<'PY'
          import stat
          import zipfile
          from pathlib import PurePosixPath

          path = "CHASS_WORK_PATCH_v2.zip"
          with zipfile.ZipFile(path) as z:
              for info in z.infolist():
                  name = info.filename
                  p = PurePosixPath(name)

                  if name.startswith("/") or name.startswith("\\"):
                      raise SystemExit(f"unsafe absolute path: {name}")
                  if ".." in p.parts:
                      raise SystemExit(f"unsafe traversal path: {name}")
                  if p.parts and p.parts[0] in {".git", ".github", "node_modules"}:
                      raise SystemExit(f"forbidden ZIP path: {name}")

                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"symlink is forbidden: {name}")

          print("ZIP path safety OK")
          PY

          unzip -p "${PATCH_ZIP}" CHANGED_FILES.txt \
            | sed '/^[[:space:]]*$/d' \
            | sort > /tmp/manifest-files.txt

          diff -u /tmp/expected-files.txt /tmp/manifest-files.txt

      - name: Capture protected baseline invariants
        shell: bash
        run: |
          set -euo pipefail

          test -f migrations/0006_jra_background_refresh.sql
          BEFORE_0006="$(sha256sum migrations/0006_jra_background_refresh.sql | awk '{print $1}')"

          echo "0006 SHA before apply: ${BEFORE_0006}"
          test "${BEFORE_0006}" = "${EXPECTED_0006_SHA256}"

          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          test "$(node -p "require('./mcp/package.json').name")" = "chass-keiba-lab-mcp"

      - name: Expand approved PATCH into repository
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/chass-work-patch-v2
          mkdir -p /tmp/chass-work-patch-v2
          unzip -oq "${PATCH_ZIP}" -d /tmp/chass-work-patch-v2

          while IFS= read -r file; do
            mkdir -p "$(dirname "${file}")"
            cp "/tmp/chass-work-patch-v2/${file}" "${file}"
          done < /tmp/expected-files.txt

      - name: Verify protected files and feature flags after apply
        shell: bash
        run: |
          set -euo pipefail

          AFTER_0006="$(sha256sum migrations/0006_jra_background_refresh.sql | awk '{print $1}')"
          echo "0006 SHA after apply: ${AFTER_0006}"
          test "${AFTER_0006}" = "${EXPECTED_0006_SHA256}"

          test -f migrations/0011_model_governance.sql
          test -f migrations/0012_precomputed_snapshots.sql

          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.jsonc', 'utf8');

          for (const [key, expected] of [
            ['ENABLE_BACKGROUND_PRECOMPUTE', 'false'],
            ['ENABLE_PRECOMPUTED_VIEWER', 'false'],
          ]) {
            const re = new RegExp(`"${key}"\\s*:\\s*"([^"]+)"`);
            const value = text.match(re)?.[1];
            if (value !== expected) {
              throw new Error(`${key} must remain ${expected}; got ${value}`);
            }
          }

          console.log('Precompute/Viewer feature flags remain OFF');
          NODE

          if grep -RInE 'Google[[:space:]_-]*Drive[[:space:]_-]*(OAuth|Runtime)|drive\\.googleapis\\.com|oauth2\\.googleapis\\.com' \
              app.js worker.js src 2>/dev/null; then
            echo "::error::Unexpected Google Drive runtime/auth integration detected in changed runtime code."
            exit 1
          else
            echo "No new Google Drive runtime/auth signature detected in runtime code."
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix mcp

      - name: Run targeted new tests
        run: |
          node --test \
            tests/historical-race-audit.test.mjs \
            tests/model-governance.test.mjs \
            tests/model-governance-schema.test.mjs \
            tests/precomputed-snapshot.test.mjs \
            tests/background-precompute.test.mjs \
            tests/nar-exchange-race.test.mjs

      - name: Run JRA J1-J5 regression
        run: |
          npm run test:jra-j1
          npm run test:jra-j2
          npm run test:jra-j3
          npm run test:jra-j4
          npm run test:jra-j5

      - name: Run full CHASS regression
        run: npm run check

      - name: Migration dry-run 0001 through 0012
        shell: bash
        run: |
          set -euo pipefail

          rm -f /tmp/chass-migration-dry-run.sqlite

          python - <<'PY'
          import glob
          import sqlite3

          files = sorted(glob.glob("migrations/*.sql"))
          expected = [f"migrations/{i:04d}_" for i in range(1, 13)]

          for prefix in expected:
              matches = [f for f in files if f.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one migration matching {prefix}, got {matches}")

          db = sqlite3.connect("/tmp/chass-migration-dry-run.sqlite")
          try:
              for f in files:
                  number = int(f.split("/")[-1].split("_", 1)[0])
                  if number > 12:
                      continue
                  sql = open(f, "r", encoding="utf-8").read()
                  print(f"Applying {f}")
                  db.executescript(sql)
              db.commit()
          finally:
              db.close()

          print("Migration dry-run 0001-0012 OK")
          PY

      - name: Stage approved PATCH and remove transport files
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r file; do
            git add -- "${file}"
          done < /tmp/expected-files.txt

          # The ZIP and this temporary apply workflow are transport-only.
          # Remove both from the final branch tree so the PR contains only
          # the 33 approved PATCH files.
          git rm -f -- "${PATCH_ZIP}"
          git rm -f -- ".github/workflows/CHASS-Apply-Work-Patch-v2.yml"

      - name: Verify final staged diff is exactly approved PATCH
        shell: bash
        run: |
          set -euo pipefail

          # Compare the INDEX to the protected baseline. Using --cached is
          # required because newly expanded PATCH files may be new/untracked
          # paths until they are staged.
          git diff --cached --name-only "${BASELINE_SHA}" | sort > /tmp/final-source-files.txt

          echo "Final staged files:"
          cat /tmp/final-source-files.txt

          diff -u /tmp/expected-files.txt /tmp/final-source-files.txt

          echo "Approved PATCH staged diff:"
          git diff --cached --stat "${BASELINE_SHA}"

      - name: Commit tested PATCH to work branch only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No PATCH changes to commit."
          else
            git commit -m "${APPLY_COMMIT_MESSAGE}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Final summary
        run: |
          echo "✅ PATCH SHA-256 verified"
          echo "✅ Exact 33-file whitelist verified"
          echo "✅ ZIP path safety verified"
          echo "✅ migrations/0006 unchanged"
          echo "✅ Feature flags remain OFF"
          echo "✅ Targeted new tests passed"
          echo "✅ JRA J1-J5 passed"
          echo "✅ Full CHASS regression passed"
          echo "✅ Migration dry-run 0001-0012 passed"
          echo "✅ PATCH committed only to ${GITHUB_REF_NAME}"
          echo "⏸ No PR created"
          echo "⏸ No merge"
          echo "⏸ No deploy"
          echo "⏸ No production D1 apply"
