name: CHASS Viewer Transition Test Contract Publish v1

"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: chass-viewer-transition-test-contract-publish-v1
  cancel-in-progress: false

jobs:
  validate:
    name: Revalidate exact Viewer transition patch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Checkout current main read-only
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Permit only this publisher as main drift
        id: base
        shell: bash
        env:
          EXPECTED_BASE_SHA: "260f592e3f7506732cc51af3eec20213c6b4c3c5"
          PUBLISHER_PATH: ".github/workflows/CHASS-Viewer-Transition-Test-Contract-Publish-v1.yml"
        run: |
          set -euo pipefail

          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD || {
            echo "::error::validated base is not an ancestor of current main"
            exit 1
          }

          git diff --name-only "$EXPECTED_BASE_SHA..HEAD" | sort -u > /tmp/main-drift.txt
          test "$(wc -l < /tmp/main-drift.txt | tr -d ' ')" -eq 1 || {
            echo "::error::main contains changes beyond this publisher workflow"
            cat /tmp/main-drift.txt
            exit 1
          }
          test "$(cat /tmp/main-drift.txt)" = "$PUBLISHER_PATH" || {
            echo "::error::unexpected main drift"
            cat /tmp/main-drift.txt
            exit 1
          }

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refuse if target branch already exists
        shell: bash
        env:
          BRANCH_NAME: "chass/viewer-transition-test-contract-v1"
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::error::branch already exists: $BRANCH_NAME"
            exit 1
          fi

      - name: Materialize and verify fixed patch
        shell: bash
        env:
          EXPECTED_PATCH_SHA256: "0fd7f2c918f3cb5daeb9bc16224cc471de05591c6935829d17fd37d93018efed"
        run: |
          set -euo pipefail

          cat > /tmp/viewer-transition.patch.gz.b64 <<'CHASS_PATCH_B64'
          
          CHASS_PATCH_B64

          base64 --decode /tmp/viewer-transition.patch.gz.b64 | gzip -dc > /tmp/viewer-transition.patch
          test -s /tmp/viewer-transition.patch

          ACTUAL="$(sha256sum /tmp/viewer-transition.patch | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_PATCH_SHA256" || {
            echo "::error::patch SHA mismatch. expected=$EXPECTED_PATCH_SHA256 actual=$ACTUAL"
            exit 1
          }

      - name: Enforce exact six-file test allowlist
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/allowed-paths.txt <<'EOF'
          tests/background-precompute.test.mjs
          tests/helpers/production-runtime-contract.mjs
          tests/jra-early-input-enrichment.test.mjs
          tests/precompute-runtime-adapter.test.mjs
          tests/precompute-runtime-gate.test.mjs
          tests/viewer-transition-contract.test.mjs
          EOF

          sort -u /tmp/allowed-paths.txt -o /tmp/allowed-paths.txt
          git apply --check /tmp/viewer-transition.patch
          git apply --numstat /tmp/viewer-transition.patch \
            | cut -f3- \
            | sed '/^[[:space:]]*$/d' \
            | sort -u > /tmp/changed-paths.txt

          diff -u /tmp/allowed-paths.txt /tmp/changed-paths.txt

          while IFS= read -r path; do
            case "$path" in
              tests/*) ;;
              *)
                echo "::error::non-test path detected: $path"
                exit 1
                ;;
            esac
          done < /tmp/changed-paths.txt

      - name: Apply tests-only patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/viewer-transition.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          diff -u /tmp/allowed-paths.txt <(git diff --cached --name-only | sort -u)
          test -z "$(git diff --name-only)"

      - name: Confirm repository Viewer stays ON
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config?.vars?.ENABLE_PRECOMPUTED_VIEWER !== 'true') {
            throw new Error('repository Viewer must remain ON in this PR');
          }
          NODE

      - name: Install dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --prefix mcp --ignore-scripts

      - name: Full check with Viewer ON
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee /tmp/check-viewer-on.log
          grep -E 'tests 904$' /tmp/check-viewer-on.log
          grep -E 'pass 904$' /tmp/check-viewer-on.log
          grep -E 'fail 0$' /tmp/check-viewer-on.log
          grep -E 'skipped 0$' /tmp/check-viewer-on.log

      - name: Full check with isolated Viewer OFF candidate
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.jsonc /tmp/wrangler-viewer-on.jsonc

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.jsonc';
          const before = fs.readFileSync(path, 'utf8');
          const from = '"ENABLE_PRECOMPUTED_VIEWER": "true"';
          const to = '"ENABLE_PRECOMPUTED_VIEWER": "false"';
          const count = before.split(from).length - 1;
          if (count !== 1) throw new Error(`expected exactly one Viewer ON token, found ${count}`);
          fs.writeFileSync(path, before.replace(from, to));
          NODE

          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "wrangler.jsonc"

          node <<'NODE'
          const fs = require('node:fs');
          const before = fs.readFileSync('/tmp/wrangler-viewer-on.jsonc', 'utf8');
          const after = fs.readFileSync('wrangler.jsonc', 'utf8');
          const expected = before.replace(
            '"ENABLE_PRECOMPUTED_VIEWER": "true"',
            '"ENABLE_PRECOMPUTED_VIEWER": "false"'
          );
          if (after !== expected) throw new Error('Viewer was not the only byte-level config replacement');
          NODE

          npm run check 2>&1 | tee /tmp/check-viewer-off.log
          grep -E 'tests 904$' /tmp/check-viewer-off.log
          grep -E 'pass 904$' /tmp/check-viewer-off.log
          grep -E 'fail 0$' /tmp/check-viewer-off.log
          grep -E 'skipped 0$' /tmp/check-viewer-off.log

          cp /tmp/wrangler-viewer-on.jsonc wrangler.jsonc
          test -z "$(git diff --name-only)"
          diff -u /tmp/allowed-paths.txt <(git diff --cached --name-only | sort -u)

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: viewer-transition-test-contract-publish-validation-${{ github.run_id }}
          path: |
            /tmp/check-viewer-on.log
            /tmp/check-viewer-off.log
            /tmp/viewer-transition.patch
            /tmp/changed-paths.txt
          retention-days: 1

  publish:
    name: Create tests-only Draft PR
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.validate.outputs.base_sha }}
      BRANCH_NAME: "chass/viewer-transition-test-contract-v1"

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Reconfirm validated base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "::error::main moved after validation; refusing to publish"
            exit 1
          }

          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
            echo "::error::branch appeared after validation; refusing to overwrite"
            exit 1
          fi

      - name: Download validated patch evidence
        uses: actions/download-artifact@v4
        with:
          name: viewer-transition-test-contract-publish-validation-${{ github.run_id }}
          path: /tmp/validated

      - name: Reverify patch and create branch
        shell: bash
        env:
          EXPECTED_PATCH_SHA256: "0fd7f2c918f3cb5daeb9bc16224cc471de05591c6935829d17fd37d93018efed"
        run: |
          set -euo pipefail

          ACTUAL="$(sha256sum /tmp/validated/viewer-transition.patch | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED_PATCH_SHA256"

          git switch -c "$BRANCH_NAME"
          git apply --check /tmp/validated/viewer-transition.patch
          git apply /tmp/validated/viewer-transition.patch
          git diff --check

          cat > /tmp/allowed-paths.txt <<'EOF'
          tests/background-precompute.test.mjs
          tests/helpers/production-runtime-contract.mjs
          tests/jra-early-input-enrichment.test.mjs
          tests/precompute-runtime-adapter.test.mjs
          tests/precompute-runtime-gate.test.mjs
          tests/viewer-transition-contract.test.mjs
          EOF
          sort -u /tmp/allowed-paths.txt -o /tmp/allowed-paths.txt

          test "$(git diff --name-only | wc -l)" -eq 6
          diff -u /tmp/allowed-paths.txt <(git diff --name-only | sort -u)
          test -z "$(git diff --name-only | grep -v '^tests/' || true)"

          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config?.vars?.ENABLE_PRECOMPUTED_VIEWER !== 'true') {
            throw new Error('Viewer must remain ON in published test-contract PR');
          }
          NODE

      - name: Commit and push tests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- tests/background-precompute.test.mjs \
                    tests/helpers/production-runtime-contract.mjs \
                    tests/jra-early-input-enrichment.test.mjs \
                    tests/precompute-runtime-adapter.test.mjs \
                    tests/precompute-runtime-gate.test.mjs \
                    tests/viewer-transition-contract.test.mjs

          diff -u /tmp/allowed-paths.txt <(git diff --cached --name-only | sort -u)
          test -z "$(git diff --name-only)"

          git commit -m "test: separate Viewer transition state from safety invariants"

          test "$(git diff HEAD^ HEAD --name-only | wc -l)" -eq 6
          diff -u /tmp/allowed-paths.txt <(git diff HEAD^ HEAD --name-only | sort -u)

          git push origin "$BRANCH_NAME"

      - name: Open Draft PR
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/pr-body.md <<'EOF'
          ## Purpose
          Separate the transitionable `ENABLE_PRECOMPUTED_VIEWER` state from invariant production safety checks.

          ## Validation
          - Browser-capable GitHub CI validated Viewer ON: 904/904 PASS, skip 0.
          - Browser-capable GitHub CI validated isolated Viewer OFF candidate: 904/904 PASS, skip 0.
          - Exact patch SHA-256: `0fd7f2c918f3cb5daeb9bc16224cc471de05591c6935829d17fd37d93018efed`
          - Changed files: exactly six test files.

          ## Safety
          - `wrangler.jsonc` is not changed by this PR.
          - Viewer remains ON in repository configuration.
          - No application/runtime logic change.
          - No workflow change in this PR.
          - No deploy.
          - No D1 write or migration.
          - This workflow does not merge the PR.
          EOF

          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH_NAME" \
            --title "test: separate Viewer transition state from production safety invariants" \
            --body-file /tmp/pr-body.md

          {
            echo "## Draft PR created"
            echo
            echo "- Branch: `$BRANCH_NAME`"
            echo "- Viewer repository setting: **ON**"
            echo "- Merge: **NOT performed**"
            echo "- Deploy: **NOT performed**"
            echo "- D1: **NOT touched**"
          } >> "$GITHUB_STEP_SUMMARY"
