name: CHASS PreOdds Policy v1 One-Shot Apply

on:
  push:
    branches:
      - chass/preodds-policy-v1
    paths:
      - .github/workflows/CHASS-PreOdds-v1-Apply.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chass-preodds-v1-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: chass/preodds-policy-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "chass/preodds-policy-v1"
          git fetch origin main
          BASE="$(git rev-parse origin/main)"
          test "$BASE" = "b83ac0906efe39ef6893fa52cb12a09d399157d6"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          test "$(git show origin/main:app.js | git hash-object --stdin)" = "e1f2b1c7e87d069e41b85197641adf726c72963b"
          test "$(git show origin/main:index.html | git hash-object --stdin)" = "463ee5b4ef06f2da01ed962854137afde028e346"
          test "$(git show origin/main:jra-odds-client.js | git hash-object --stdin)" = "d25278eefa56208453990b74e6a023da97a4d171"
          test "$(git show origin/main:publish-chass-chat-snapshot.mjs | git hash-object --stdin)" = "cffa88548bd5caf990fd949bd437bdb8d01b9cdd"

      - name: Apply PreOdds policy and Chat live-market overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 anchor, found {count}")
              return text.replace(old,new,1)

          # ---------- app.js ----------
          p='app.js'
          s=read(p)
          s=replace_once(s,
          """const ODDS_HISTORY='chass_v90_odds_history';
          let oddsTimer=null;""",
          """const ODDS_HISTORY='chass_v90_odds_history';
          const PREODDS_POLICY_VERSION='PREODDS-v1';
          const PREODDS_MARKET_ROLE='longshot_discovery_only';
          const PREODDS_FALLBACK_HOUR_JST=9,PREODDS_FALLBACK_MINUTE_JST=30;
          let oddsTimer=null,preOddsFallbackTimer=null;""",
          'app constants')

          s=replace_once(s,
          """oddsSnapshotType:d.oddsSnapshotType||(Array.isArray(d.odds)&&d.odds.length?'unknown':'none'),autoGenerated:true""",
          """oddsSnapshotType:d.oddsSnapshotType||(Array.isArray(d.odds)&&d.odds.length?'unknown':'none'),oddsUpdatedAt:Array.isArray(d.odds)&&d.odds.length?(d.acquiredAt||null):null,marketDataSource:Array.isArray(d.odds)&&d.odds.length?'NAR_OFFICIAL_PRE_ODDS':null,autoGenerated:true""",
          'NAR initial market metadata')

          old="""const applyMarketOddsBase=applyMarketOdds;
          applyMarketOdds=function(items,acquiredAt,options){return applyMarketOddsBase(items,acquiredAt,options)};
          async function syncLiveOdds(silent=false){
          """
          new="""function preOddsStats(record=state){
           const eligible=(record?.horses||[]).filter(isEligibleHorse),totalHorseCount=eligible.length,oddsHorseCount=eligible.filter(h=>num(h?.odds??h?.realOdds)!=null).length;
           return {totalHorseCount,oddsHorseCount,oddsCoverage:totalHorseCount?Number((oddsHorseCount/totalHorseCount).toFixed(4)):0,complete:totalHorseCount>0&&oddsHorseCount===totalHorseCount};
          }
          function preOddsFrozen(record=state){return record?.marketSnapshot?.marketPolicyVersion===PREODDS_POLICY_VERSION&&record?.marketSnapshot?.preOddsFrozen===true}
          function preOddsStamp(record=state,{acquiredAt=null,sourceOddsSnapshotType=null}={}){
           if(!record||record.validationCompleted)return false;
           const market=record.marketSnapshot;if(!market)return false;
           const stats=preOddsStats(record),hasAny=stats.oddsHorseCount>0,at=acquiredAt||market.acquiredAt||record.race?.oddsUpdatedAt||new Date().toISOString(),alreadyFrozen=preOddsFrozen(record);
           market.marketPolicyVersion=PREODDS_POLICY_VERSION;market.marketRole=PREODDS_MARKET_ROLE;market.sourceOddsSnapshotType=sourceOddsSnapshotType||market.sourceOddsSnapshotType||market.oddsSnapshotType||null;
           market.oddsHorseCount=stats.oddsHorseCount;market.totalHorseCount=stats.totalHorseCount;market.oddsCoverage=stats.oddsCoverage;market.evRankStatus=!hasAny?'unavailable':stats.complete?'complete':'partial';
           market.preOddsFrozen=alreadyFrozen||stats.complete;market.preOddsFrozenAt=market.preOddsFrozen?(market.preOddsFrozenAt||at):null;market.oddsSnapshotType=market.preOddsFrozen?'pre_frozen':hasAny?'pre_provisional':'none';
           record.race=record.race||{};record.race.marketPolicyVersion=PREODDS_POLICY_VERSION;record.race.marketRole=PREODDS_MARKET_ROLE;record.race.oddsSnapshotType=market.oddsSnapshotType;record.race.oddsType=market.preOddsFrozen?'事前オッズ（固定）':hasAny?'事前オッズ（暫定）':'オッズなし';
           record.race.oddsHorseCount=stats.oddsHorseCount;record.race.totalHorseCount=stats.totalHorseCount;record.race.oddsCoverage=stats.oddsCoverage;record.race.evRankStatus=market.evRankStatus;
           if(hasAny){record.race.oddsUpdatedAt=market.preOddsFrozenAt||at;record.race.marketDataAvailable=true}else record.race.marketDataAvailable=false;
           sealSnapshotIntegrity(record,true);
           return market.preOddsFrozen;
          }
          function preOddsFallbackTargetMs(date){
           if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(String(date||'')))return null;
           const target=Date.parse(`${date}T00:30:00.000Z`);
           return Number.isFinite(target)?target:null;
          }
          function schedulePreOddsFallback(record=state){
           if(preOddsFallbackTimer){clearTimeout(preOddsFallbackTimer);preOddsFallbackTimer=null}
           if(!record||record.validationCompleted||preOddsFrozen(record))return false;
           const target=preOddsFallbackTargetMs(record?.race?.raceDate),delay=target==null?null:target-Date.now();
           if(delay==null||delay<=0||delay>36*60*60_000)return false;
           preOddsFallbackTimer=setTimeout(async()=>{
            preOddsFallbackTimer=null;
            if(state.validationCompleted||preOddsFrozen(state))return;
            state.race.preOddsFallbackAttemptedAt=new Date().toISOString();
            try{await syncLiveOdds(true)}catch{}
            try{persist(existingValidated(raceId(state.race)))}catch{}
           },delay);
           return true;
          }
          const makeSnapshotPreOddsBase=makeSnapshot;
          makeSnapshot=function(...args){
           const sourceType=state?.race?.oddsSnapshotType||null,value=makeSnapshotPreOddsBase(...args);
           if(!state.validationCompleted)preOddsStamp(state,{acquiredAt:state?.marketSnapshot?.acquiredAt||state?.race?.oddsUpdatedAt||null,sourceOddsSnapshotType:sourceType});
           schedulePreOddsFallback(state);
           return value;
          };
          const applyMarketOddsBase=applyMarketOdds;
          applyMarketOdds=function(items,acquiredAt,options={}){
           if(!state.validationCompleted&&preOddsFrozen(state)&&options?.forcePreOddsRefresh!==true){
            state.oddsLastCheckedAt=acquiredAt||new Date().toISOString();state.lastOddsApplyChanged=false;
            return Number(state.marketSnapshot?.oddsHorseCount)||0;
           }
           const sourceOddsSnapshotType=options?.oddsSnapshotType||null,count=applyMarketOddsBase(items,acquiredAt,{...options,oddsSnapshotType:'pre_provisional'});
           if(!state.validationCompleted&&count)preOddsStamp(state,{acquiredAt,sourceOddsSnapshotType});
           return count;
          };
          async function syncLiveOdds(silent=false){
           if(!state.validationCompleted&&preOddsFrozen(state)){
            if($('liveOddsStatus'))$('liveOddsStatus').textContent='事前オッズは固定済みです。現在オッズはチャス側のLive Assessmentで確認します。';
            return {ok:true,status:'pre_odds_frozen',marketPolicyVersion:PREODDS_POLICY_VERSION};
           }
          """
          s=replace_once(s,old,new,'PreOdds wrapper')

          s=replace_once(s,
          """if(!silent)$('liveOddsStatus').textContent='NAR公式の現在オッズを確認中…';""",
          """if(!silent)$('liveOddsStatus').textContent='NAR公式の事前オッズを1回確認中…';""",
          'NAR odds loading label')

          s=replace_once(s,
          """render();persist(existingValidated(raceId(r)));const changed=state.lastOddsApplyChanged,t=new Date(changed?state.race.oddsUpdatedAt:state.oddsLastCheckedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});renderMarketDisplayState();$('liveOddsStatus').textContent=changed?`NAR公式 現在オッズ ${count}頭反映｜変更 ${t}｜人気・期待回収率・穴馬/危険馬を再計算済み`:`NAR公式 現在オッズ ${count}頭確認｜値変更なし ${t}`;""",
          """render();persist(existingValidated(raceId(r)));const changed=state.lastOddsApplyChanged,t=new Date(changed?state.race.oddsUpdatedAt:state.oddsLastCheckedAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'});renderMarketDisplayState();$('liveOddsStatus').textContent=preOddsFrozen(state)?`NAR公式 事前オッズ ${count}頭を固定｜${t}｜以後アプリでは追跡しません`:`NAR公式 事前オッズ ${count}頭を暫定反映｜${t}｜全頭揃うまで固定待ち`;""",
          'NAR odds applied label')

          s=replace_once(s,
          """function setAutoOdds(on){if(oddsTimer){clearInterval(oddsTimer);oddsTimer=null}if(on){syncLiveOdds();oddsTimer=setInterval(()=>syncLiveOdds(true),60000)}if($('autoOddsState')){$('autoOddsState').textContent=on?'ON':'OFF';$('autoOddsState').classList.toggle('is-on',on)}}""",
          """function setAutoOdds(){if(oddsTimer){clearInterval(oddsTimer);oddsTimer=null}if($('autoOdds')){$('autoOdds').checked=false;$('autoOdds').disabled=true}if($('autoOddsState')){$('autoOddsState').textContent='固定運用';$('autoOddsState').classList.remove('is-on')}}""",
          'disable 60-second polling')

          s=replace_once(s,
          """if(autoOddsRow)autoOddsRow.hidden=jra;""",
          """if(autoOddsRow)autoOddsRow.hidden=true;""",
          'hide polling row')

          s=replace_once(s,
          """$('liveOddsSync').textContent=jra?'JRA公式から現在オッズを取得':'NAR公式から現在オッズを取得'""",
          """$('liveOddsSync').textContent=jra?'JRA公式から事前オッズを取得・固定':'NAR公式から事前オッズを取得・固定'""",
          'market button labels')

          s=replace_once(s,
          """if(announce&&jra&&$('jraStatus'))$('jraStatus').textContent='JRA公式出馬表・単勝オッズ・発走後結果を利用できます。開催と結果は低頻度でバックグラウンド更新します。';""",
          """if(announce&&jra&&$('jraStatus'))$('jraStatus').textContent='JRA公式出馬表＋能力先行。オッズは最初の完全な事前Snapshotだけ固定し、現在オッズはチャス側で確認します。';""",
          'JRA mode status')

          s=replace_once(s,
          """if(raceTypeOf({race})==='JRA')return /predicted|forecast|予想/.test(snapshot+type)?'予想':'入力';""",
          """if(/pre_frozen|pre_provisional|事前/.test(snapshot+type))return '事前';if(raceTypeOf({race})==='JRA')return /predicted|forecast|予想/.test(snapshot+type)?'予想':'入力';""",
          'market source pre label')

          s=replace_once(s,
          """$('narSync').onclick=syncNar;$('liveOddsSync').onclick=()=>syncLiveOdds(false);$('autoOdds').onchange=e=>setAutoOdds(e.target.checked);""",
          """$('narSync').onclick=syncNar;$('liveOddsSync').onclick=()=>syncLiveOdds(false);$('autoOdds').onchange=e=>setAutoOdds(e.target.checked);setAutoOdds(false);""",
          'initialize fixed market UI')

          s=replace_once(s,
          """saveRaceRecord,persistRecordIfChanged,applyMarketOdds,currentPublicApiUrl""",
          """saveRaceRecord,persistRecordIfChanged,PREODDS_POLICY_VERSION,preOddsFrozen,preOddsStats,preOddsStamp,schedulePreOddsFallback,applyMarketOdds,currentPublicApiUrl""",
          'test hook exports')
          write(p,s)

          # ---------- index.html ----------
          p='index.html';s=read(p)
          s=replace_once(s,'<button id="quickOdds" type="button">現在オッズ</button>','<button id="quickOdds" type="button">事前オッズ</button>','quick odds label')
          s=replace_once(s,'<summary><span class="utility-icon market-bg">▥</span><strong>現在オッズ</strong><span id="liveOddsBadge" class="utility-value">未取得</span></summary>','<summary><span class="utility-icon market-bg">▥</span><strong>事前オッズ</strong><span id="liveOddsBadge" class="utility-value">未取得</span></summary>','market card title')
          s=replace_once(s,'<button id="liveOddsSync" class="primary wide">NAR公式から現在オッズを取得</button><p id="liveOddsStatus" class="muted status-line">予想データ読込後に取得できます。</p>','<button id="liveOddsSync" class="primary wide">NAR公式から事前オッズを取得・固定</button><p id="liveOddsStatus" class="muted status-line">前日取得を優先。未取得時は09:30 JSTに1回だけ確認します。</p><small class="muted">能力・AI勝率・TIMEはオッズ非依存。現在オッズはチャス側Live Assessmentで利用します。</small>','market card contents')
          s=replace_once(s,'<strong>60秒自動更新</strong><span id="autoOddsState" class="auto-odds-state">OFF</span><label class="switch"><input id="autoOdds" type="checkbox"><span></span></label>','<strong>自動追跡なし</strong><span id="autoOddsState" class="auto-odds-state">固定運用</span><label class="switch"><input id="autoOdds" type="checkbox" disabled><span></span></label>','polling UI')
          write(p,s)

          # ---------- jra-odds-client.js ----------
          p='jra-odds-client.js';s=read(p)
          s=replace_once(s,"// CHASS-JRA-SAVED-ODDS-OVERLAY-FALLBACK-v1.9.9.2","// CHASS-JRA-PREODDS-FREEZE-v1", 'JRA policy marker')
          s=replace_once(s,"const idleLabel='JRA公式から利用可能なオッズを取得';","const idleLabel='JRA公式から事前オッズを取得・固定';",'JRA idle label')
          s=replace_once(s,"if(button){button.disabled=true;button.textContent='オッズ取得中…'}if(status)status.textContent='JRA公式の利用可能な単勝オッズを確認中…';","if(button){button.disabled=true;button.textContent='事前オッズ確認中…'}if(status)status.textContent='JRA公式の事前単勝オッズを1回確認中…';",'JRA loading label')
          s=replace_once(s,"if(status)status.textContent='JRA公式出馬表を取得しました。利用可能な単勝オッズを自動連動しています…';","if(status)status.textContent='JRA公式出馬表を取得しました。事前単勝オッズを1回だけ確認します…';",'JRA race ready label')
          s=replace_once(s,"if(status)status.textContent='JRA出馬表取得後は現在オッズを優先し、未取得時は取得時刻付き保存オッズを利用します。';","if(status)status.textContent='JRA出馬表取得後に事前オッズを1回確認し、完全取得できたSnapshotを固定します。現在オッズはチャス側で確認します。';",'JRA active label')
          s=replace_once(s,
          """const meta=oddsMeta(data),timePart=meta.time?`｜取得 ${meta.time}`:'',savedNote=meta.freshness==='saved'?'｜現在値ではありません':'';
             if(status)status.textContent=`JRA公式 単勝オッズ ${data.quality.oddsHorseCount}/${data.quality.activeHorseCount}頭反映｜${meta.label}${timePart}${savedNote}`;""",
          """const meta=oddsMeta(data),timePart=meta.time?`｜取得 ${meta.time}`:'',savedNote=meta.freshness==='saved'?'｜保存値を事前候補として利用':'';
             if(status)status.textContent=`JRA公式 事前単勝オッズ ${data.quality.oddsHorseCount}/${data.quality.activeHorseCount}頭反映${timePart}${savedNote}`;""",
          'JRA applied label')
          write(p,s)

          # ---------- publish-chass-chat-snapshot.mjs ----------
          p='publish-chass-chat-snapshot.mjs';s=read(p)
          nar_old="""  ooi: { track: '大井', organization: 'NAR' },
            funabashi: { track: '船橋', organization: 'NAR' },
            kawasaki: { track: '川崎', organization: 'NAR' },
            urawa: { track: '浦和', organization: 'NAR' },
            monbetsu: { track: '門別', organization: 'NAR' },
            sonoda: { track: '園田', organization: 'NAR' },
            himeji: { track: '姫路', organization: 'NAR' },
            morioka: { track: '盛岡', organization: 'NAR' },
            mizusawa: { track: '水沢', organization: 'NAR' },
            kanazawa: { track: '金沢', organization: 'NAR' },
            kasamatsu: { track: '笠松', organization: 'NAR' },
            nagoya: { track: '名古屋', organization: 'NAR' },
            kochi: { track: '高知', organization: 'NAR' },
            saga: { track: '佐賀', organization: 'NAR' },
            obihiro: { track: '帯広', organization: 'NAR' },"""
          nar_new="""  ooi: { track: '大井', organization: 'NAR', code: '20' },
            funabashi: { track: '船橋', organization: 'NAR', code: '19' },
            kawasaki: { track: '川崎', organization: 'NAR', code: '21' },
            urawa: { track: '浦和', organization: 'NAR', code: '18' },
            monbetsu: { track: '門別', organization: 'NAR', code: '36' },
            sonoda: { track: '園田', organization: 'NAR', code: '27' },
            himeji: { track: '姫路', organization: 'NAR', code: '28' },
            morioka: { track: '盛岡', organization: 'NAR', code: '10' },
            mizusawa: { track: '水沢', organization: 'NAR', code: '11' },
            kanazawa: { track: '金沢', organization: 'NAR', code: '23' },
            kasamatsu: { track: '笠松', organization: 'NAR', code: '22' },
            nagoya: { track: '名古屋', organization: 'NAR', code: '24' },
            kochi: { track: '高知', organization: 'NAR', code: '31' },
            saga: { track: '佐賀', organization: 'NAR', code: '32' },
            obihiro: { track: '帯広', organization: 'NAR', code: '3' },"""
          s=replace_once(s,nar_old,nar_new,'NAR live market codes')

          anchor="""function normalizeName(value) {
            return String(value || '').normalize('NFKC').replace(/[\\s　]+/g, '').trim();
          }
          """
          insertion=anchor+"""
          function probability01(value) {
            const n = Number(value);
            if (!Number.isFinite(n)) return null;
            return n > 1 ? n / 100 : n;
          }

          export function mergeLiveMarket(snapshot, liveRaces = []) {
            const byRace = new Map((liveRaces || []).map(r => [Number(r.raceNumber), r]));
            let liveMarketHorseCount = 0;
            let liveMarketUnavailableCount = 0;
            let liveIdentityMismatchCount = 0;
            const liveTimes = [];
            const races = (snapshot?.races || []).map(race => {
              const live = byRace.get(Number(race.raceNumber)) || null;
              if (live?.acquiredAt) liveTimes.push(live.acquiredAt);
              const liveByNo = new Map((live?.odds || []).map(h => [Number(h.horseNo ?? h.horseNumber ?? h.no), h]));
              const horses = (race.horses || []).map(h => {
                const row = liveByNo.get(Number(h.horseNumber)) || null;
                const rowName = normalizeName(row?.horseName ?? row?.name ?? '');
                const sameName = !row || !rowName || rowName === normalizeName(h.horseName);
                const odds = sameName && Number.isFinite(Number(row?.odds)) && Number(row.odds) > 0 ? Number(row.odds) : null;
                if (row && !sameName) liveIdentityMismatchCount += 1;
                if (odds == null) {
                  liveMarketUnavailableCount += 1;
                  return { ...h, liveMarket: null };
                }
                liveMarketHorseCount += 1;
                const p = probability01(h.winProb);
                const expectedValue = p == null ? null : Number((p * odds).toFixed(4));
                return {
                  ...h,
                  liveMarket: {
                    odds,
                    popularity: Number.isFinite(Number(row?.popularity)) ? Number(row.popularity) : null,
                    expectedValue,
                    expectedValuePercent: expectedValue == null ? null : Number((expectedValue * 100).toFixed(1)),
                    acquiredAt: live?.acquiredAt ?? null,
                    source: live?.source ?? 'CHASS_OFFICIAL_LIVE_ODDS',
                    identityVerified: true
                  }
                };
              });
              return {
                ...race,
                liveMarket: live ? {
                  status: live.odds?.length ? 'available' : 'unavailable',
                  acquiredAt: live.acquiredAt ?? null,
                  source: live.source ?? 'CHASS_OFFICIAL_LIVE_ODDS'
                } : { status: 'unavailable', acquiredAt: null, source: null },
                horses
              };
            });
            return {
              ...snapshot,
              marketPolicy: {
                version: 'PREODDS-v1',
                appMarket: 'pre_odds_snapshot',
                liveMarket: 'chat_read_only',
                originalSignalsFrozen: true
              },
              liveMarketFreshness: { latestLiveOddsAt: maxIso(liveTimes) },
              diagnostics: {
                ...(snapshot?.diagnostics || {}),
                liveMarketHorseCount,
                liveMarketUnavailableCount,
                liveIdentityMismatchCount
              },
              races
            };
          }

          function raceStartMsJst(date, startTime) {
            const m = /^(\\d{1,2}):(\\d{2})$/.exec(String(startTime || ''));
            if (!m) return null;
            const hh = String(Number(m[1])).padStart(2, '0'), mm = m[2];
            const value = Date.parse(`${date}T${hh}:${mm}:00+09:00`);
            return Number.isFinite(value) ? value : null;
          }

          function needsLiveMarket(date, race, now = Date.now()) {
            if (race?.timestamps?.resultAt) return false;
            const start = raceStartMsJst(date, race?.startTime);
            return start == null || now <= start + 5 * 60_000;
          }

          async function fetchLiveMarkets(date, slug, snapshot) {
            const meta = TRACKS[slug], out = [];
            for (const race of snapshot?.races || []) {
              if (!needsLiveMarket(date, race)) continue;
              const q = new URLSearchParams({ date, race: String(race.raceNumber) });
              let url;
              if (meta.organization === 'NAR') {
                q.set('code', meta.code);
                url = `${WORKER_ORIGIN}/api/nar/odds?${q}`;
              } else {
                q.set('track', meta.track);
                url = `${WORKER_ORIGIN}/api/jra/odds?${q}`;
              }
              try {
                const response = await request(url, { accept: 'application/json', allow404: true, attempts: 1 });
                if (!response) continue;
                const payload = await response.json();
                const rows = Array.isArray(payload?.odds) ? payload.odds : [];
                if (!rows.length) continue;
                out.push({
                  raceNumber: Number(race.raceNumber),
                  acquiredAt: payload?.oddsAcquiredAt ?? payload?.acquiredAt ?? null,
                  source: meta.organization === 'NAR' ? 'NAR_OFFICIAL_LIVE_ODDS' : 'JRA_OFFICIAL_LIVE_ODDS',
                  odds: rows
                });
              } catch (error) {
                console.warn(JSON.stringify({ slug, race: race.raceNumber, liveMarket: 'unavailable', error: String(error?.message || error) }));
              }
              await new Promise(resolve => setTimeout(resolve, 80));
            }
            return out;
          }
          """
          s=replace_once(s,anchor,insertion,'live market helpers')

          old="""  return mergeChatSnapshot({ ability, marketText, slug });
          }"""
          new="""  const snapshot = mergeChatSnapshot({ ability, marketText, slug });
            const liveRaces = await fetchLiveMarkets(date, slug, snapshot);
            return mergeLiveMarket(snapshot, liveRaces);
          }"""
          s=replace_once(s,old,new,'attach live market')

          s=replace_once(s,
          """        warning: h.warning,
                })),""",
          """        warning: h.warning,
                  liveMarket: h.liveMarket ?? null,
                })),""",
          'day summary live market')
          write(p,s)

          # ---------- mirror tests ----------
          p='tests/chass-chat-snapshot.test.mjs';s=read(p)
          s=replace_once(s,
          """import { MIRROR_SCHEMA_VERSION, TRACKS, parseDayAiText, mergeChatSnapshot } from '../publish-chass-chat-snapshot.mjs';""",
          """import { MIRROR_SCHEMA_VERSION, TRACKS, parseDayAiText, mergeChatSnapshot, mergeLiveMarket } from '../publish-chass-chat-snapshot.mjs';""",
          'mirror test import')
          s=replace_once(s,
          """assert.deepEqual(TRACKS.ooi, { track: '大井', organization: 'NAR' });""",
          """assert.deepEqual(TRACKS.ooi, { track: '大井', organization: 'NAR', code: '20' });""",
          'mirror NAR registry test')
          s += """

          test('live market overlay stays separate from frozen app market and signals', () => {
            const base = mergeChatSnapshot({ ability, marketText, slug: 'ooi' });
            const out = mergeLiveMarket(base, [{
              raceNumber: 1,
              acquiredAt: '2026-09-15T04:00:00.000Z',
              source: 'NAR_OFFICIAL_LIVE_ODDS',
              odds: [{ horseNo: 2, horseName: 'テストツー', odds: 22.0, popularity: 8 }]
            }]);
            const horse = out.races[0].horses[1];
            assert.equal(horse.odds, 18.2);
            assert.equal(horse.diamond, '💎');
            assert.equal(horse.liveMarket.odds, 22);
            assert.equal(horse.liveMarket.expectedValue, 1.76);
            assert.equal(out.marketPolicy.liveMarket, 'chat_read_only');
            assert.equal(out.marketPolicy.originalSignalsFrozen, true);
          });

          test('live market identity mismatch fails closed without touching pre market', () => {
            const base = mergeChatSnapshot({ ability, marketText, slug: 'ooi' });
            const out = mergeLiveMarket(base, [{
              raceNumber: 1,
              acquiredAt: '2026-09-15T04:00:00.000Z',
              odds: [{ horseNo: 2, horseName: '別の馬', odds: 99, popularity: 12 }]
            }]);
            assert.equal(out.races[0].horses[1].odds, 18.2);
            assert.equal(out.races[0].horses[1].liveMarket, null);
            assert.equal(out.diagnostics.liveIdentityMismatchCount, 1);
          });
          """
          write(p,s)

          # ---------- focused static guard ----------
          Path('tests/preodds-policy.test.mjs').write_text(r"""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';

          const app = await readFile(new URL('../app.js', import.meta.url), 'utf8');
          const html = await readFile(new URL('../index.html', import.meta.url), 'utf8');
          const jra = await readFile(new URL('../jra-odds-client.js', import.meta.url), 'utf8');
          const mirror = await readFile(new URL('../publish-chass-chat-snapshot.mjs', import.meta.url), 'utf8');

          test('app uses PREODDS-v1 and freezes the first complete market snapshot', () => {
            assert.match(app, /PREODDS_POLICY_VERSION='PREODDS-v1'/);
            assert.match(app, /preOddsFrozen=true|preOddsFrozen=alreadyFrozen\\|\\|stats\\.complete/);
            assert.match(app, /marketRole=PREODDS_MARKET_ROLE/);
            assert.match(app, /事前オッズ（固定）/);
          });

          test('60-second odds polling is fully disabled', () => {
            assert.doesNotMatch(app, /setInterval\\(\\(\\)=>syncLiveOdds\\(true\\),60000\\)/);
            assert.match(app, /autoOddsState'\\)\\.textContent='固定運用'/);
            assert.match(html, /自動追跡なし/);
            assert.match(html, /id="autoOdds" type="checkbox" disabled/);
          });

          test('09:30 JST is a one-shot fallback and current odds move to Chat live assessment', () => {
            assert.match(app, /PREODDS_FALLBACK_HOUR_JST=9,PREODDS_FALLBACK_MINUTE_JST=30/);
            assert.match(app, /T00:30:00\\.000Z/);
            assert.match(html, /09:30 JSTに1回だけ確認/);
            assert.match(html, /現在オッズはチャス側Live Assessment/);
          });

          test('JRA client is one-shot pre-odds oriented', () => {
            assert.match(jra, /CHASS-JRA-PREODDS-FREEZE-v1/);
            assert.match(jra, /事前オッズを取得・固定/);
            assert.doesNotMatch(jra, /60秒/);
          });

          test('Chat mirror carries read-only live odds without changing Original Signal', () => {
            assert.match(mirror, /liveMarket: 'chat_read_only'/);
            assert.match(mirror, /originalSignalsFrozen: true/);
            assert.match(mirror, /export function mergeLiveMarket/);
            assert.match(mirror, /NAR_OFFICIAL_LIVE_ODDS/);
            assert.match(mirror, /JRA_OFFICIAL_LIVE_ODDS/);
          });
          """, encoding='utf-8')
          PY

      - name: Focused policy tests
        run: |
          node --check app.js
          node --check jra-odds-client.js
          node --check publish-chass-chat-snapshot.mjs
          node --test tests/preodds-policy.test.mjs tests/chass-chat-snapshot.test.mjs

      - name: Full regression
        run: npm run check

      - name: Final safety audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          # Remove the temporary one-shot workflow from the final net diff.
          git rm .github/workflows/CHASS-PreOdds-v1-Apply.yml
          git add app.js index.html jra-odds-client.js publish-chass-chat-snapshot.mjs tests/chass-chat-snapshot.test.mjs tests/preodds-policy.test.mjs

          CHANGED="$( { git diff --name-only origin/main --; git ls-files --others --exclude-standard; } | sort -u )"
          printf '%s\n' "$CHANGED"
          EXPECTED="$(printf '%s\n' \
            app.js \
            index.html \
            jra-odds-client.js \
            publish-chass-chat-snapshot.mjs \
            tests/chass-chat-snapshot.test.mjs \
            tests/preodds-policy.test.mjs | sort)"
          test "$CHANGED" = "$EXPECTED"

          ! grep -F "setInterval(()=>syncLiveOdds(true),60000)" app.js
          grep -F "PREODDS_POLICY_VERSION='PREODDS-v1'" app.js
          grep -F "liveMarket: 'chat_read_only'" publish-chass-chat-snapshot.mjs
          git diff --cached --check

      - name: Commit final six-file change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(market): freeze app pre-odds and isolate Chat live odds"
          git push origin HEAD:chass/preodds-policy-v1
