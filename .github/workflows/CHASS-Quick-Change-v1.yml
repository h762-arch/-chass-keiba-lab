name: CHASS Quick Change v1

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Select an approved CHASS change
        required: true
        type: choice
        options:
          - e1-v2-viewer-off-transition

permissions: {}

concurrency:
  group: chass-quick-change-${{ inputs.preset }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.meta.outputs.base_sha }}
      branch_name: ${{ steps.meta.outputs.branch_name }}
      pr_title: ${{ steps.meta.outputs.pr_title }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          test "$PRESET" = "e1-v2-viewer-off-transition"
          ACTUAL_BASE="$(git rev-parse HEAD)"
          echo "base_sha=$ACTUAL_BASE" >> "$GITHUB_OUTPUT"
          echo "branch_name=chass/e1-v2-viewer-off-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "pr_title=chore: disable JRA precomputed viewer for v2 transition" >> "$GITHUB_OUTPUT"

      - name: Apply Viewer OFF transition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("wrangler.jsonc")
          text = p.read_text(encoding="utf-8")
          old = '"ENABLE_PRECOMPUTED_VIEWER": "true"'
          new = '"ENABLE_PRECOMPUTED_VIEWER": "false"'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Viewer=true entry, found {text.count(old)}")
          p.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "wrangler.jsonc"
          grep -F '"ENABLE_PRECOMPUTED_VIEWER": "false"' wrangler.jsonc
          grep -F '"ENABLE_BACKGROUND_PRECOMPUTE": "true"' wrangler.jsonc
          grep -F '"ENABLE_JRA_DIRECT_FETCH": "false"' wrangler.jsonc
          grep -F '"ENABLE_JRA_ODDS_DIRECT_FETCH": "false"' wrangler.jsonc
          grep -F '"JRA_PRECOMPUTE_CALCULATION_VERSION": "jra-ability-data-v2"' wrangler.jsonc
          grep -F '"JRA_PRECOMPUTE_MODEL_VERSION": "10.0.1-jra-drive1-ability"' wrangler.jsonc
          grep -F '"JRA_PRECOMPUTE_SOURCE_MODE": "official-cache"' wrangler.jsonc
          grep -F '"JRA_PRECOMPUTE_MAX_JOBS": "1"' wrangler.jsonc

      - run: npm ci --ignore-scripts
      - run: npm ci --prefix mcp --ignore-scripts

      - name: Full regression check
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee /tmp/npm-check.log
          grep -E 'fail 0$' /tmp/npm-check.log
          grep -E 'skipped 0$' /tmp/npm-check.log

      - name: Save validated patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/chass-quick-change.patch
          test -s /tmp/chass-quick-change.patch
          cp /tmp/npm-check.log /tmp/npm-check-viewer-off.log

      - uses: actions/upload-artifact@v4
        with:
          name: validated-chass-quick-change-${{ github.run_id }}
          path: |
            /tmp/chass-quick-change.patch
            /tmp/npm-check-viewer-off.log
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.validate.outputs.base_sha }}
      BRANCH_NAME: ${{ needs.validate.outputs.branch_name }}
      PR_TITLE: ${{ needs.validate.outputs.pr_title }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: validated-chass-quick-change-${{ github.run_id }}
          path: /tmp/viewer-off-artifact

      - name: Reconfirm main and apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "::error::main moved after validation; refusing to publish"
            exit 1
          }
          git checkout -b "$BRANCH_NAME"
          git apply --check /tmp/viewer-off-artifact/chass-quick-change.patch
          git apply /tmp/viewer-off-artifact/chass-quick-change.patch
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "wrangler.jsonc"

      - name: Commit and push config-only transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- wrangler.jsonc
          git diff --cached --check
          git commit -m "$PR_TITLE"
          git push origin "$BRANCH_NAME"

      - name: Open pull request
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF_PR'
          Temporarily disable the JRA precomputed Viewer for the E1 calculationVersion v2 transition.

          Purpose:
          - E1 is merged and changes JRA EARLY calculationVersion to `jra-ability-data-v2`.
          - The Viewer intentionally does not fall back to v1 DATA.
          - Keep Viewer OFF while Production is deployed and v2 DATA is populated/verified.
          - Background precompute remains ON so v2 DATA can be generated.

          Safety:
          - Only `wrangler.jsonc` changes.
          - `ENABLE_PRECOMPUTED_VIEWER=false`.
          - `ENABLE_BACKGROUND_PRECOMPUTE=true`.
          - JRA direct fetch remains OFF.
          - Odds direct fetch remains OFF.
          - SOURCE remains `official-cache`.
          - MAX_JOBS remains 1.
          - No D1 migration.
          - No manual D1 write.
          - No Production deploy in this PR.
          - NAR unchanged.

          After merge:
          1. Deploy with mode `deploy`.
          2. Verify v2 DATA coverage and integrity.
          3. Only then create a separate Viewer ON PR.
          EOF_PR
          gh pr create             --repo "${{ github.repository }}"             --base main             --head "$BRANCH_NAME"             --title "$PR_TITLE"             --body-file /tmp/pr-body.md
