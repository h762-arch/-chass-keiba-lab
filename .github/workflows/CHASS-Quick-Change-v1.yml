name: CHASS Quick Change v1

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Select an approved CHASS change
        required: true
        type: choice
        options:
          - jra-early-signal-freeze-v1

permissions: {}

concurrency:
  group: chass-quick-change-${{ inputs.preset }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.meta.outputs.base_sha }}
      branch_name: ${{ steps.meta.outputs.branch_name }}
      pr_title: ${{ steps.meta.outputs.pr_title }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          case "$PRESET" in
            jra-early-signal-freeze-v1)
              echo "branch_name=chass/jra-early-signal-freeze-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "pr_title=feat: freeze JRA EARLY prediction revision" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::unsupported preset: $PRESET"; exit 1 ;;
          esac
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply preset safely
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import os

          if os.environ['PRESET'] != 'jra-early-signal-freeze-v1':
              raise SystemExit('unsupported preset')

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if s.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one target, found {s.count(old)}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # First non-empty DATA revision becomes the immutable EARLY reference.
          replace_once(
              'src/prediction/jra-precomputed-viewer-reader.mjs',
              "    ORDER BY revision DESC LIMIT 1`;",
              "      AND data_json IS NOT NULL AND data_json<>''\n    ORDER BY revision ASC LIMIT 1`;"
          )
          replace_once(
              'src/prediction/jra-precomputed-viewer-reader.mjs',
              "  const validatedAt=Date.parse(row.source_validated_at||'');\n  if(!Number.isFinite(validatedAt))return rejected('INVALID_FRESHNESS');\n  const age=now-validatedAt;\n  if(age<0||age>maxAgeMs)return rejected('STALE');",
              "  const validatedAt=Date.parse(row.source_validated_at||'');\n  const calculatedAt=Date.parse(row.data_calculated_at||row.calculated_at||'');\n  if(!Number.isFinite(validatedAt)||!Number.isFinite(calculatedAt))return rejected('INVALID_FRESHNESS');\n  if(validatedAt>now||calculatedAt>now)return rejected('FUTURE_TIMESTAMP');"
          )

          # Day/list selection uses the earliest non-empty DATA row and is deterministic.
          replace_once(
              'src/prediction/jra-precomputed-viewer-api.mjs',
              "    ORDER BY race_id ASC,revision DESC`;",
              "      AND data_json IS NOT NULL AND data_json<>''\n    ORDER BY race_id ASC,revision ASC`;"
          )
          replace_once(
              'src/prediction/jra-precomputed-viewer-api.mjs',
              "  const validatedAt=Date.parse(row.source_validated_at||'');\n  if(!Number.isFinite(validatedAt))return 'INVALID_FRESHNESS';\n  const age=now-validatedAt;\n  if(age<0||age>maxAgeMs)return 'STALE';",
              "  const validatedAt=Date.parse(row.source_validated_at||'');\n  const calculatedAt=Date.parse(row.data_calculated_at||row.calculated_at||'');\n  if(!Number.isFinite(validatedAt)||!Number.isFinite(calculatedAt))return 'INVALID_FRESHNESS';\n  if(validatedAt>now||calculatedAt>now)return 'FUTURE_TIMESTAMP';"
          )
          replace_once(
              'src/prediction/jra-precomputed-viewer-api.mjs',
              "  const latest=[];\n  const seen=new Set();\n  for(const row of rows){",
              "  const latest=[];\n  const seen=new Set();\n  const ordered=[...rows].sort((a,b)=>String(a?.race_id||'').localeCompare(String(b?.race_id||''),'ja')||(Number(a?.revision)||0)-(Number(b?.revision)||0));\n  for(const row of ordered){"
          )

          # Reader tests: frozen EARLY persists, future timestamps fail, no fallback.
          replace_once(
              'tests/jra-precomputed-viewer-reader.test.mjs',
              "    assert.equal(result.status,'READY');\n    assert.deepEqual(DB.calls[0].args,['JRA',raceId,JRA_PRECOMPUTED_VIEWER_CALCULATION_VERSION,JRA_PRECOMPUTED_VIEWER_MODEL_VERSION]);",
              "    assert.equal(result.status,'READY');\n    assert.match(DB.calls[0].sql,/data_json IS NOT NULL AND data_json<>''/);\n    assert.match(DB.calls[0].sql,/ORDER BY revision ASC LIMIT 1/);\n    assert.deepEqual(DB.calls[0].args,['JRA',raceId,JRA_PRECOMPUTED_VIEWER_CALCULATION_VERSION,JRA_PRECOMPUTED_VIEWER_MODEL_VERSION]);"
          )
          replace_once(
              'tests/jra-precomputed-viewer-reader.test.mjs',
              dedent("""\
              test('stale or future source validation fails closed',async()=>{
                const stale=await readJraPrecomputedViewerRace({env:{ENABLE_PRECOMPUTED_VIEWER:'true'},DB:db(row({source_validated_at:'2026-10-03T05:40:00Z'})),raceId,now});
                assert.equal(stale.reason,'STALE');
                const future=await readJraPrecomputedViewerRace({env:{ENABLE_PRECOMPUTED_VIEWER:'true'},DB:db(row({source_validated_at:'2026-10-03T06:06:00Z'})),raceId,now});
                assert.equal(future.reason,'STALE');
              });
              """),
              dedent("""\
              test('historical frozen EARLY remains readable while future timestamps fail closed',async()=>{
                const historical=await readJraPrecomputedViewerRace({env:{ENABLE_PRECOMPUTED_VIEWER:'true'},DB:db(row({source_validated_at:'2026-10-03T05:40:00Z',data_calculated_at:'2026-10-03T05:39:30Z'})),raceId,now});
                assert.equal(historical.status,'READY');
                const futureSource=await readJraPrecomputedViewerRace({env:{ENABLE_PRECOMPUTED_VIEWER:'true'},DB:db(row({source_validated_at:'2026-10-03T06:06:00Z'})),raceId,now});
                assert.equal(futureSource.status,'REJECTED');
                assert.equal(futureSource.reason,'FUTURE_TIMESTAMP');
                const futureCalculation=await readJraPrecomputedViewerRace({env:{ENABLE_PRECOMPUTED_VIEWER:'true'},DB:db(row({data_calculated_at:'2026-10-03T06:06:00Z'})),raceId,now});
                assert.equal(futureCalculation.status,'REJECTED');
                assert.equal(futureCalculation.reason,'FUTURE_TIMESTAMP');
              });

              test('malformed frozen EARLY candidate fails closed without falling forward',async()=>{
                let reads=0;
                const malformed=row({revision:1,data_json:'{bad'});
                const laterValid=row({revision:2,data_json:JSON.stringify(data())});
                const DB=db(()=>++reads===1?malformed:laterValid);
                const result=await readJraPrecomputedViewerRace({env:{ENABLE_PRECOMPUTED_VIEWER:'true'},DB,raceId,now});
                assert.equal(result.status,'REJECTED');
                assert.equal(result.reason,'MALFORMED_DATA');
                assert.equal(reads,1);
                assert.equal(DB.calls.length,1);
              });
              """)
          )

          # Wiring tests: old age is allowed, malformed earliest never falls forward, list freezes earliest.
          replace_once(
              'tests/jra-precomputed-viewer-wiring.test.mjs',
              dedent("""\
              test('stale or malformed precomputed DATA fails closed',async()=>{
                for(const bad of [
                  row('東京',1,{source_validated_at:'2026-10-03T23:00:00Z'}),
                  row('東京',1,{data_json:'{bad json'})
                ]){
                  const DB=new D1([bad]);
                  const response=await handleJraPrecomputedViewerPublicApi(req(`/api/chass/v1/public/day?date=${date}&track=東京&organization=JRA`),{ENABLE_PRECOMPUTED_VIEWER:'true'},DB,{now});
                  assert.equal(response.status,503);
                  const body=await response.json();
                  assert.equal(body.error.code,'PRECOMPUTED_VIEWER_UNAVAILABLE');
                }
              });
              """),
              dedent("""\
              test('historical frozen EARLY remains readable after the old freshness window',async()=>{
                const DB=new D1([row('東京',1,{source_validated_at:'2026-10-03T23:00:00Z',data_calculated_at:'2026-10-03T22:59:30Z'})]);
                const response=await handleJraPrecomputedViewerPublicApi(req(`/api/chass/v1/public/day?date=${date}&track=東京&organization=JRA`),{ENABLE_PRECOMPUTED_VIEWER:'true'},DB,{now});
                assert.equal(response.status,200);
                const body=await response.json();
                assert.equal(body.races.length,1);
              });

              test('malformed frozen EARLY fails closed without falling forward',async()=>{
                const DB=new D1([row('東京',1,{revision:2}),row('東京',1,{revision:1,data_json:'{bad json'})]);
                const response=await handleJraPrecomputedViewerPublicApi(req(`/api/chass/v1/public/day?date=${date}&track=東京&organization=JRA`),{ENABLE_PRECOMPUTED_VIEWER:'true'},DB,{now});
                assert.equal(response.status,503);
                const body=await response.json();
                assert.equal(body.error.code,'PRECOMPUTED_VIEWER_UNAVAILABLE');
              });

              test('future frozen EARLY timestamp fails closed',async()=>{
                const DB=new D1([row('東京',1,{source_validated_at:'2026-10-04T00:06:00Z'})]);
                const response=await handleJraPrecomputedViewerPublicApi(req(`/api/chass/v1/public/day?date=${date}&track=東京&organization=JRA`),{ENABLE_PRECOMPUTED_VIEWER:'true'},DB,{now});
                assert.equal(response.status,503);
                const body=await response.json();
                assert.equal(body.error.message,'FUTURE_TIMESTAMP');
              });
              """)
          )
          replace_once(
              'tests/jra-precomputed-viewer-wiring.test.mjs',
              dedent("""\
              test('list reader keeps latest revision per race and SELECTs exact versions only',async()=>{
                const older=row('東京',1,{revision:1,data_json:JSON.stringify(data('東京',1))});
                const newer=row('東京',1,{revision:3,data_json:JSON.stringify({...data('東京',1),race:{...data('東京',1).race,raceName:'NEW'}})});
                const DB=new D1([newer,older]);
                const read=await readJraPrecomputedViewerRaces({env:{ENABLE_PRECOMPUTED_VIEWER:'true'},DB,date,track:'東京',now});
                assert.equal(read.status,'READY');
                assert.equal(read.races.length,1);
                assert.equal(read.races[0].race.raceName,'NEW');
                assert.deepEqual(DB.calls[0].args,['JRA','20261004-JRA-','20261004-JRA-\\uffff',JRA_PRECOMPUTED_VIEWER_CALCULATION_VERSION,JRA_PRECOMPUTED_VIEWER_MODEL_VERSION]);
              });
              """),
              dedent("""\
              test('list reader freezes earliest nonempty DATA revision per race independent of DB row order',async()=>{
                const older=row('東京',1,{revision:1,data_json:JSON.stringify({...data('東京',1),race:{...data('東京',1).race,raceName:'EARLY'}})});
                const newer=row('東京',1,{revision:3,data_json:JSON.stringify({...data('東京',1),race:{...data('東京',1).race,raceName:'NEW'}})});
                const DB=new D1([newer,older]);
                const read=await readJraPrecomputedViewerRaces({env:{ENABLE_PRECOMPUTED_VIEWER:'true'},DB,date,track:'東京',now});
                assert.equal(read.status,'READY');
                assert.equal(read.races.length,1);
                assert.equal(read.races[0].race.raceName,'EARLY');
                assert.match(DB.calls[0].sql,/data_json IS NOT NULL AND data_json<>''/);
                assert.match(DB.calls[0].sql,/ORDER BY race_id ASC,revision ASC/);
                assert.deepEqual(DB.calls[0].args,['JRA','20261004-JRA-','20261004-JRA-\\uffff',JRA_PRECOMPUTED_VIEWER_CALCULATION_VERSION,JRA_PRECOMPUTED_VIEWER_MODEL_VERSION]);
              });
              """)
          )

          # Static safety guard.
          reader=Path('src/prediction/jra-precomputed-viewer-reader.mjs').read_text(encoding='utf-8')
          api=Path('src/prediction/jra-precomputed-viewer-api.mjs').read_text(encoding='utf-8')
          if 'ORDER BY revision ASC LIMIT 1' not in reader:
              raise SystemExit('EARLY single-reader ordering guard missing')
          if 'ORDER BY race_id ASC,revision ASC' not in api:
              raise SystemExit('EARLY list ordering guard missing')
          for forbidden in ('market_json','final_json','result_json'):
              if forbidden in reader:
                  raise SystemExit(f'reader selected forbidden layer: {forbidden}')
          PY

      - name: Enforce exact paths
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort -u > /tmp/actual
          cat > /tmp/expected <<'EOF_PATHS'
          src/prediction/jra-precomputed-viewer-api.mjs
          src/prediction/jra-precomputed-viewer-reader.mjs
          tests/jra-precomputed-viewer-reader.test.mjs
          tests/jra-precomputed-viewer-wiring.test.mjs
          EOF_PATHS
          sort -u -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - run: npm ci --ignore-scripts
      - run: npm ci --prefix mcp --ignore-scripts
      - run: npm run check

      - name: Save validated patch
        run: |
          set -euo pipefail
          git diff > /tmp/chass-quick-change.patch
          test -s /tmp/chass-quick-change.patch

      - uses: actions/upload-artifact@v4
        with:
          name: validated-chass-quick-change-${{ github.run_id }}
          path: /tmp/chass-quick-change.patch
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: validated-chass-quick-change-${{ github.run_id }}
          path: /tmp/validated

      - name: Create branch and commit
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          BRANCH_NAME: ${{ needs.validate.outputs.branch_name }}
          PR_TITLE: ${{ needs.validate.outputs.pr_title }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"
          git switch --detach "$EXPECTED_BASE_SHA"
          git switch -c "$BRANCH_NAME"
          git apply --index /tmp/validated/chass-quick-change.patch
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$PR_TITLE"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"

      - name: Create PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ needs.validate.outputs.branch_name }}
          PR_TITLE: ${{ needs.validate.outputs.pr_title }}
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF_BODY'
          Freeze JRA EARLY on the first nonempty DATA revision for the approved calculation/model version pair.

          - Later SOURCE/DATA revisions do not replace EARLY.
          - The frozen EARLY remains readable after the former 15-minute window.
          - Malformed, identity-invalid, probability-invalid, invalid-timestamp, or future-timestamp EARLY fails closed without falling forward.
          - MARKET/FINAL/RESULT stay outside the EARLY SELECT/projection.
          - Read path remains zero-write and zero-network.
          - JRA direct fetch settings are unchanged and stay OFF.
          - NAR is unchanged.
          - No D1 migration, production deploy, production D1 write, or runtime flag change is performed by this workflow.

          Legacy note: pre-E0 historical rows are not retroactively certified as formal EARLY KPI until separately audited. E0 formal KPI begins with post-deploy snapshots.
          EOF_BODY
          gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH_NAME" --title "$PR_TITLE" --body-file /tmp/pr-body.md
