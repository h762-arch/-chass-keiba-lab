name: CHASS Quick Change v1

on:
  workflow_dispatch:
    inputs:
      preset:
        description: Select an approved CHASS change
        required: true
        type: choice
        options:
          - jra-early-input-enrichment-v1

permissions: {}

concurrency:
  group: chass-quick-change-${{ inputs.preset }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.meta.outputs.base_sha }}
      branch_name: ${{ steps.meta.outputs.branch_name }}
      pr_title: ${{ steps.meta.outputs.pr_title }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          REVIEW_BASE: ef9a7569e083f8fed4d88d78719bf92b2773ffc8
        run: |
          set -euo pipefail
          test "$PRESET" = "jra-early-input-enrichment-v1"
          git diff --name-only "$REVIEW_BASE" HEAD | sort -u > /tmp/since-review-base
          printf '%s\n' '.github/workflows/CHASS-Quick-Change-v1.yml' > /tmp/allowed-main-drift
          diff -u /tmp/allowed-main-drift /tmp/since-review-base
          ACTUAL_BASE="$(git rev-parse HEAD)"
          echo "base_sha=$ACTUAL_BASE" >> "$GITHUB_OUTPUT"
          echo "branch_name=chass/jra-early-input-enrichment-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "pr_title=feat: enrich frozen JRA EARLY data inputs" >> "$GITHUB_OUTPUT"

