      - name: Enforce exact E1 paths and safety settings
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort -u > /tmp/actual
          cat > /tmp/expected <<'EOF_PATHS'
          scripts/jra-production-preflight.mjs
          src/prediction/jra-ability-result-projector.mjs
          src/prediction/jra-data-calculator.mjs
          src/prediction/jra-precomputed-viewer-reader.mjs
          tests/fixtures/jra/jra-early-enrichment-baseline.json
          tests/jra-early-input-enrichment.test.mjs
          tests/jra-precompute-cache-only-composition.test.mjs
          tests/jra-precompute-cache-only-source.test.mjs
          tests/jra-precompute-planning-budget.test.mjs
          tests/jra-precompute-planning-integration.test.mjs
          tests/jra-precompute-soak-guard.test.mjs
          wrangler.jsonc
          EOF_PATHS
          sort -u -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          grep -F '"JRA_PRECOMPUTE_CALCULATION_VERSION": "jra-ability-data-v2"' wrangler.jsonc
          grep -F '"JRA_PRECOMPUTE_MODEL_VERSION": "10.0.1-jra-drive1-ability"' wrangler.jsonc
          grep -F '"ENABLE_JRA_DIRECT_FETCH": "false"' wrangler.jsonc
          grep -F '"ENABLE_JRA_ODDS_DIRECT_FETCH": "false"' wrangler.jsonc
          grep -F '"JRA_PRECOMPUTE_SOURCE_MODE": "official-cache"' wrangler.jsonc
          grep -F '"JRA_PRECOMPUTE_MAX_JOBS": "1"' wrangler.jsonc

      - run: npm ci --ignore-scripts
      - run: npm ci --prefix mcp --ignore-scripts

      - name: Full regression check
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee /tmp/npm-check.log
          grep -E 'tests 898$' /tmp/npm-check.log
          grep -E 'pass 898$' /tmp/npm-check.log
          grep -E 'fail 0$' /tmp/npm-check.log
          grep -E 'skipped 0$' /tmp/npm-check.log

      - name: Save validated patch
        shell: bash
        run: |
          set -euo pipefail
          git diff > /tmp/chass-quick-change.patch
          test -s /tmp/chass-quick-change.patch
          cp /tmp/npm-check.log /tmp/npm-check-e1.log

      - uses: actions/upload-artifact@v4
        with:
          name: validated-chass-quick-change-${{ github.run_id }}
          path: |
            /tmp/chass-quick-change.patch
            /tmp/npm-check-e1.log
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.validate.outputs.base_sha }}
      BRANCH_NAME: ${{ needs.validate.outputs.branch_name }}
      PR_TITLE: ${{ needs.validate.outputs.pr_title }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: validated-chass-quick-change-${{ github.run_id }}
          path: /tmp/e1-artifact

      - name: Reconfirm main and apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "::error::main moved after validation; refusing to publish"
            exit 1
          }
          git checkout -b "$BRANCH_NAME"
          git apply --check /tmp/e1-artifact/chass-quick-change.patch
          git apply /tmp/e1-artifact/chass-quick-change.patch
          git diff --check
          git diff --name-only | sort -u > /tmp/actual
          cat > /tmp/expected <<'EOF_PATHS'
          scripts/jra-production-preflight.mjs
          src/prediction/jra-ability-result-projector.mjs
          src/prediction/jra-data-calculator.mjs
          src/prediction/jra-precomputed-viewer-reader.mjs
          tests/fixtures/jra/jra-early-enrichment-baseline.json
          tests/jra-early-input-enrichment.test.mjs
          tests/jra-precompute-cache-only-composition.test.mjs
          tests/jra-precompute-cache-only-source.test.mjs
          tests/jra-precompute-planning-budget.test.mjs
          tests/jra-precompute-planning-integration.test.mjs
          tests/jra-precompute-soak-guard.test.mjs
          wrangler.jsonc
          EOF_PATHS
          sort -u -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit and push reviewed E1 only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'scripts/jra-production-preflight.mjs' 'src/prediction/jra-ability-result-projector.mjs' 'src/prediction/jra-data-calculator.mjs' 'src/prediction/jra-precomputed-viewer-reader.mjs' 'tests/fixtures/jra/jra-early-enrichment-baseline.json' 'tests/jra-early-input-enrichment.test.mjs' 'tests/jra-precompute-cache-only-composition.test.mjs' 'tests/jra-precompute-cache-only-source.test.mjs' 'tests/jra-precompute-planning-budget.test.mjs' 'tests/jra-precompute-planning-integration.test.mjs' 'tests/jra-precompute-soak-guard.test.mjs' 'wrangler.jsonc'
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat: enrich frozen JRA EARLY data inputs"
          git push origin "$BRANCH_NAME"

      - name: Open pull request
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'EOF_PR'
