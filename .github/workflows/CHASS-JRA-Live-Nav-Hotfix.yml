name: CHASS JRA Live Navigation Hotfix

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "validate_only"
        type: choice
        options:
          - validate_only
          - apply_and_deploy
      require_live_jra:
        description: "9/12 中山1RのJRA公式ライブ取得が成功した場合だけ適用する"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: chass-jra-live-navigation-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture baseline
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Baseline: $(git rev-parse HEAD)"

      - name: Repository safety guard
        shell: bash
        run: |
          set -euo pipefail

          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          test -f worker.js
          test -f jra-race-fetch.mjs
          test -f jra-race-client.js
          test -f tests/jra-j2.test.mjs
          test -f migrations/0006_jra_background_refresh.sql
          test -f mcp/server.mjs

          FETCH_SHA="$(git hash-object jra-race-fetch.mjs)"
          CLIENT_SHA="$(git hash-object jra-race-client.js)"

          case "$FETCH_SHA" in
            fdb2bfd84d8db7e596b523cb908e19aaad813428|1c15319f4a7a56e835c23a821aeca13cb72dd8e7) ;;
            *)
              echo "::error::jra-race-fetch.mjs has changed from the reviewed baseline. Refusing to overwrite."
              echo "Current blob: $FETCH_SHA"
              exit 1
              ;;
          esac

          case "$CLIENT_SHA" in
            1818580f5f1b4935d9a99adab63a4ed3a0819468|461f4407244da2c81f960192fe913c3a026e7262) ;;
            *)
              echo "::error::jra-race-client.js has changed from the reviewed baseline. Refusing to overwrite."
              echo "Current blob: $CLIENT_SHA"
              exit 1
              ;;
          esac

          echo "Repository safety guard OK"

      - name: Materialize embedded reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/chass-jra-hotfix
          mkdir -p /tmp/chass-jra-hotfix

          cat > /tmp/chass-jra-hotfix/payload.b64 <<'CHASS_PAYLOAD'
