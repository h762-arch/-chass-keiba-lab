          CHASS_PAYLOAD

          base64 -d /tmp/chass-jra-hotfix/payload.b64 > /tmp/chass-jra-hotfix/payload.tar.gz

          EXPECTED="004ea70b913e9e1c997c8cb0937c373e2294846b81e9501d0b04132fbaecca3c"
