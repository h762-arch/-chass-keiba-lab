          test "$ACTUAL" = "$EXPECTED"

          mkdir -p /tmp/chass-jra-hotfix/files
          tar -xzf /tmp/chass-jra-hotfix/payload.tar.gz -C /tmp/chass-jra-hotfix/files

          find /tmp/chass-jra-hotfix/files -type f -printf '%P\n' | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
