          jra-race-fetch.mjs
          tests/jra-live-navigation-hotfix.test.mjs
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

          echo "Embedded patch whitelist OK"

      - name: Apply patch to temporary worktree state
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 /tmp/chass-jra-hotfix/files/jra-race-fetch.mjs jra-race-fetch.mjs
          install -m 0644 /tmp/chass-jra-hotfix/files/jra-race-client.js jra-race-client.js
          install -m 0644 /tmp/chass-jra-hotfix/files/tests/jra-live-navigation-hotfix.test.mjs tests/jra-live-navigation-hotfix.test.mjs

          git status --porcelain=v1 | sed -E 's/^.. //' | sort > /tmp/changed-files.txt
          cat > /tmp/allowed-files.txt <<'EOF'
          jra-race-client.js
          jra-race-fetch.mjs
          tests/jra-live-navigation-hotfix.test.mjs
          EOF
          sort -o /tmp/allowed-files.txt /tmp/allowed-files.txt

          echo "Changed files:"
          cat /tmp/changed-files.txt

          if [ -s /tmp/changed-files.txt ]; then
            diff -u /tmp/allowed-files.txt /tmp/changed-files.txt
          fi

          git diff --quiet -- worker.js app.js package.json wrangler.jsonc migrations/ mcp/ viewer/ || {
            echo "::error::Unrelated critical files changed."
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix mcp

      - name: Syntax and targeted JRA regression
        shell: bash
        run: |
          set -euo pipefail
          node --check jra-race-fetch.mjs
          node --check jra-race-client.js
          node --test tests/jra-live-navigation-hotfix.test.mjs tests/jra-j2.test.mjs

      - name: Full regression check
        run: npm run check

      - name: Live JRA smoke test - 2026/09/12 Nakayama 1R
        if: ${{ inputs.require_live_jra }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createJraRaceService } from './jra-race-fetch.mjs';

          const service = createJraRaceService({ timeoutMs: 20000 });
          const url = new URL('https://local.test/api/jra/race');
          url.searchParams.set('date', '2026-09-12');
          url.searchParams.set('track', '中山');
          url.searchParams.set('race', '1');

          const response = await service(new Request(url), { ENABLE_JRA_AUTO_FETCH: false });
          const body = await response.json();

          console.log(JSON.stringify({
            status: response.status,
            ok: body.ok,
            error: body.error ?? null,
            race: body.race ?? null,
            quality: body.quality ?? null,
            sourceUrl: body.sourceUrl ?? null,
            navigation: body.navigation ?? null
          }, null, 2));

          if (!response.ok || body.ok !== true) {
            throw new Error(`Live JRA smoke failed: ${body.error || response.status}`);
          }
          if (body.race?.date !== '2026-09-12') throw new Error('Live JRA date mismatch');
          if (body.race?.racecourse !== '中山') throw new Error('Live JRA track mismatch');
          if (Number(body.race?.raceNo) !== 1) throw new Error('Live JRA race mismatch');
          if (body.dataConfidence !== 'high') throw new Error('Live JRA dataConfidence is not high');
          if (!body.quality?.raceParsed || Number(body.quality?.horseCount) < 2) {
            throw new Error('Live JRA runner quality gate failed');
          }
          console.log('Live JRA 2026/09/12 中山1R OK');
          NODE

      - name: Verify main did not move during validation
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE="${{ steps.base.outputs.sha }}"
          REMOTE="$(git rev-parse origin/main)"
          echo "Baseline: $BASE"
          echo "Remote main: $REMOTE"
          if [ "$BASE" != "$REMOTE" ]; then
            echo "::error::main advanced while validation was running. Nothing will be committed."
            exit 1
          fi

      - name: Commit tested hotfix to main
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jra-race-fetch.mjs                   jra-race-client.js                   tests/jra-live-navigation-hotfix.test.mjs

          if git diff --cached --quiet; then
            echo "Hotfix is already applied; no new commit required."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Fix JRA official race-card live navigation"
            PATCH_SHA="$(git rev-parse HEAD)"
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$PATCH_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Cloudflare authentication preflight
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          }
          npx -y wrangler@4 whoami

      - name: Deploy CHASS Worker
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        run: npx -y wrangler@4 deploy

      - name: Production health smoke test
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://chass-keiba-lab7.h7625421.workers.dev/api/chass/v1/public/health"

          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$HEALTH_URL" -o /tmp/health.json; then
              break
            fi
            sleep 3
          done

          cat /tmp/health.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (body.ok !== true) throw new Error('Production health did not return ok=true');
          console.log('Production health OK');
          NODE

      - name: Production JRA smoke test - Nakayama 1R
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://chass-keiba-lab7.h7625421.workers.dev/api/jra/race"

          curl -fsS --max-time 25 --get "$BASE_URL"             --data-urlencode "date=2026-09-12"             --data-urlencode "track=中山"             --data-urlencode "race=1"             -o /tmp/jra-live.json

          cat /tmp/jra-live.json

          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/jra-live.json', 'utf8'));

          if (body.ok !== true) throw new Error(`Production JRA failed: ${body.error || 'unknown'}`);
          if (body.race?.date !== '2026-09-12') throw new Error('Production date mismatch');
          if (body.race?.racecourse !== '中山') throw new Error('Production track mismatch');
          if (Number(body.race?.raceNo) !== 1) throw new Error('Production race mismatch');
          if (body.dataConfidence !== 'high') throw new Error('Production confidence is not high');
          if (!body.quality?.raceParsed || Number(body.quality?.horseCount) < 2) {
            throw new Error('Production quality gate failed');
          }
          console.log('Production JRA 中山1R OK');
          NODE

      - name: Automatic source rollback on post-commit failure
        if: ${{ failure() && inputs.mode == 'apply_and_deploy' && steps.commit.outputs.committed == 'true' }}
        shell: bash
        run: |
          set +e
          PATCH_SHA="${{ steps.commit.outputs.sha }}"
          echo "::warning::Post-commit validation/deploy failed. Reverting hotfix commit $PATCH_SHA"

          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git revert --no-edit "$PATCH_SHA"
          REVERT_STATUS=$?
          if [ "$REVERT_STATUS" -eq 0 ]; then
            git push origin HEAD:main
          else
            echo "::error::Automatic git revert failed. Manual review required."
          fi

          if [ "$REVERT_STATUS" -eq 0 ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Attempting to redeploy reverted main..."
            npx -y wrangler@4 deploy || echo "::warning::Rollback deploy failed; source main was still reverted."
          fi

          exit 1

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CHASS JRA Live Navigation Hotfix"
            echo ""
            echo "- Mode: `${{ inputs.mode }}`"
            echo "- Baseline: `${{ steps.base.outputs.sha }}`"
            echo "- Patch payload SHA-256: `004ea70b913e9e1c997c8cb0937c373e2294846b81e9501d0b04132fbaecca3c`"
            echo "- Approved source scope: `jra-race-fetch.mjs`, `jra-race-client.js`, one regression test"
            echo "- D1 / migrations / NAR / prediction logic / viewer: unchanged"
            if [ "${{ inputs.mode }}" = "validate_only" ]; then
              echo "- No commit and no production deploy were requested."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
