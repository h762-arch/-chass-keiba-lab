name: CHASS Google Drive Service Account Reader Switch v1.2

"on":
  workflow_dispatch:
    inputs:
      commit_changes:
        description: "Commit verified Service Account Reader to current branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: chass-drive-service-account-reader-switch
  cancel-in-progress: false

jobs:
  switch-and-live-test:
    name: Switch Reader auth and verify live Sheet access
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENABLE_DRIVE_READ_IMPORT: "true"
      CHASS_DRIVE_SPREADSHEET_ID: "1dqFySEgG6cYEXIx8BmOw7tPOe7wI90H_No1FRoXlgoI"
      GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Confirm repository
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          node -e "const p=require('./package.json'); if(p.name!=='chass-keiba-lab') process.exit(2); console.log('repo:',p.name,'version:',p.version)"

      - name: Validate registered Service Account secret safely
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const raw = process.env.GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON || '';
          if (!raw) {
            console.error('::error::GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON is not configured.');
            process.exit(1);
          }

          let data;
          try {
            data = JSON.parse(raw);
          } catch {
            console.error('::error::GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON is not valid JSON.');
            process.exit(1);
          }

          if (
            data?.type !== 'service_account' ||
            typeof data?.client_email !== 'string' ||
            !data.client_email.endsWith('.iam.gserviceaccount.com') ||
            typeof data?.private_key !== 'string' ||
            !data.private_key.includes('BEGIN PRIVATE KEY')
          ) {
            console.error('::error::Service Account JSON is missing required fields.');
            process.exit(1);
          }

          console.log('Service Account secret: configured and structurally valid.');
          NODE

      - name: Record protected existing-file hashes
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js worker.js server.mjs research-storage-sync.mjs package.json wrangler.jsonc; do
            if [ -f "$f" ]; then sha256sum "$f"; fi
          done > /tmp/chass-protected-before.sha256

      - name: Install Service Account Reader v1.2
        shell: bash
        run: |
          set -euo pipefail
          cat > google-drive-readonly-import.mjs <<'CHASS_READER_EOF'
          /**
           * CHASS Google Drive Read-Only Import
           * Service Account edition.
           *
           * Safety constraints:
           * - Google Sheets read-only scope only.
           * - No Drive/Sheets write operations.
           * - No D1 writes.
           * - No prediction snapshot mutation.
           * - No browser-direct Google API access.
           * - JRA/NAR allowlists remain physically separated.
           * - Feature flag defaults OFF.
           */
          
          const GOOGLE_TOKEN_ENDPOINT = 'https://oauth2.googleapis.com/token';
          const GOOGLE_SHEETS_BASE = 'https://sheets.googleapis.com/v4/spreadsheets';
          const READ_ONLY_SCOPE = 'https://www.googleapis.com/auth/spreadsheets.readonly';
          const DEFAULT_TIMEOUT_MS = 12_000;
          
          export const CHASS_DRIVE_READONLY_SCHEMA_VERSION = '1.2-service-account';
          
          export const CHASS_DRIVE_SHEET_ALLOWLIST = Object.freeze({
            JRA: Object.freeze([
              'JRA_予想アーカイブ',
              'JRA_レース結果',
              'JRA_レース後検証',
              'JRA_指数マスター',
              'JRA_改善履歴',
              'JRA_指数隣接研究',
              'JRA_指数クラスター事前検証',
            ]),
            NAR: Object.freeze([
              'NAR_予想アーカイブ',
              'NAR_レース結果',
              'NAR_レース後検証',
              'NAR_指数マスター',
              'NAR_改善履歴',
              'NAR_指数隣接研究',
            ]),
          });
          
          export const CHASS_DRIVE_LEGACY_DENYLIST = Object.freeze([
            '予想アーカイブ',
            'レース結果',
            'レース後検証',
            'CHASS指数マスター',
            'モデル改善履歴',
          ]);
          
          function bool(value) {
            return /^(1|true|on|yes)$/i.test(String(value ?? '').trim());
          }
          
          function nonEmpty(value) {
            const s = String(value ?? '').trim();
            return s || null;
          }
          
          function safeErrorMessage(error) {
            return String(error?.message || error || 'unknown_error').slice(0, 240);
          }
          
          function makeError(code, message, details = {}) {
            const error = new Error(message || code);
            error.code = code;
            Object.assign(error, details);
            return error;
          }
          
          function assertServerSide() {
            if (typeof window !== 'undefined' && typeof document !== 'undefined') {
              throw makeError(
                'DRIVE_READ_BROWSER_FORBIDDEN',
                'Google Drive read import is server-side only.',
              );
            }
          }
          
          export function driveReadImportEnabled(env = {}) {
            return bool(env.ENABLE_DRIVE_READ_IMPORT);
          }
          
          function parseServiceAccountJson(raw) {
            const text = nonEmpty(raw);
            if (!text) return null;
          
            let data;
            try {
              data = JSON.parse(text);
            } catch {
              throw makeError(
                'DRIVE_READ_SERVICE_ACCOUNT_JSON_INVALID',
                'Service account JSON is invalid.',
              );
            }
          
            if (data?.type !== 'service_account') {
              throw makeError(
                'DRIVE_READ_SERVICE_ACCOUNT_TYPE_INVALID',
                'Credential is not a Google service account.',
              );
            }
          
            const clientEmail = nonEmpty(data?.client_email);
            const privateKey = nonEmpty(data?.private_key);
            const projectId = nonEmpty(data?.project_id);
          
            if (!clientEmail || !privateKey) {
              throw makeError(
                'DRIVE_READ_SERVICE_ACCOUNT_JSON_INCOMPLETE',
                'Service account JSON is missing required fields.',
              );
            }
          
            if (!clientEmail.endsWith('.iam.gserviceaccount.com')) {
              throw makeError(
                'DRIVE_READ_SERVICE_ACCOUNT_EMAIL_INVALID',
                'Service account email is invalid.',
              );
            }
          
            return {
              clientEmail,
              privateKey,
              projectId,
            };
          }
          
          export function getDriveReadConfig(env = {}) {
            const serviceAccountRaw = nonEmpty(env.GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON);
            let serviceAccount = null;
            let serviceAccountValid = false;
            let serviceAccountErrorCode = null;
          
            if (serviceAccountRaw) {
              try {
                serviceAccount = parseServiceAccountJson(serviceAccountRaw);
                serviceAccountValid = Boolean(serviceAccount);
              } catch (error) {
                serviceAccountErrorCode = nonEmpty(error?.code) || 'DRIVE_READ_SERVICE_ACCOUNT_JSON_INVALID';
              }
            }
          
            return {
              enabled: driveReadImportEnabled(env),
              spreadsheetId: nonEmpty(env.CHASS_DRIVE_SPREADSHEET_ID),
              serviceAccountPresent: Boolean(serviceAccountRaw),
              serviceAccountValid,
              serviceAccountErrorCode,
              serviceAccount,
              scope: READ_ONLY_SCOPE,
            };
          }
          
          export function getDriveReadReadiness(env = {}) {
            const cfg = getDriveReadConfig(env);
            const missing = [];
          
            if (!cfg.spreadsheetId) missing.push('CHASS_DRIVE_SPREADSHEET_ID');
            if (!cfg.serviceAccountPresent) missing.push('GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON');
          
            return {
              schemaVersion: CHASS_DRIVE_READONLY_SCHEMA_VERSION,
              authMode: 'service_account',
              enabled: cfg.enabled,
              configured: missing.length === 0 && cfg.serviceAccountValid,
              missing,
              credentialValid: cfg.serviceAccountValid,
              credentialErrorCode: cfg.serviceAccountErrorCode,
              mode: 'read_only',
              scope: cfg.scope,
              browserDirectGoogleAccess: false,
              d1WriteEnabled: false,
              predictionSnapshotMutationEnabled: false,
            };
          }
          
          function requireDriveReadConfig(env = {}) {
            assertServerSide();
            const readiness = getDriveReadReadiness(env);
          
            if (!readiness.enabled) {
              throw makeError('DRIVE_READ_DISABLED', 'ENABLE_DRIVE_READ_IMPORT is not enabled.');
            }
          
            if (readiness.missing.length) {
              throw makeError(
                'DRIVE_READ_CONFIG_INCOMPLETE',
                `Missing Drive read configuration: ${readiness.missing.join(', ')}`,
                { missing: readiness.missing },
              );
            }
          
            if (!readiness.credentialValid) {
              throw makeError(
                readiness.credentialErrorCode || 'DRIVE_READ_SERVICE_ACCOUNT_JSON_INVALID',
                'Service account credential is invalid.',
              );
            }
          
            return getDriveReadConfig(env);
          }
          
          function withTimeout(timeoutMs = DEFAULT_TIMEOUT_MS) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort('timeout'), Math.max(1, timeoutMs));
            return {
              signal: controller.signal,
              clear: () => clearTimeout(timer),
            };
          }
          
          async function parseJsonResponse(response, codePrefix) {
            const text = await response.text();
            let data = null;
          
            if (text) {
              try {
                data = JSON.parse(text);
              } catch {
                throw makeError(
                  `${codePrefix}_RESPONSE_INVALID`,
                  'Google API returned non-JSON data.',
                  { status: response.status },
                );
              }
            }
          
            return data;
          }
          
          function classifyGoogleStatus(status, prefix = 'DRIVE_READ') {
            if (status === 400) return `${prefix}_BAD_REQUEST`;
            if (status === 401) return `${prefix}_AUTH_FAILED`;
            if (status === 403) return `${prefix}_PERMISSION_DENIED`;
            if (status === 404) return `${prefix}_NOT_FOUND`;
            if (status === 429) return `${prefix}_RATE_LIMITED`;
            if (status >= 500) return `${prefix}_UPSTREAM_ERROR`;
            return `${prefix}_HTTP_${status}`;
          }
          
          function bytesToBase64Url(bytes) {
            let binary = '';
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
              binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary)
              .replaceAll('+', '-')
              .replaceAll('/', '_')
              .replace(/=+$/g, '');
          }
          
          function utf8ToBase64Url(value) {
            return bytesToBase64Url(new TextEncoder().encode(String(value)));
          }
          
          function pemPkcs8ToArrayBuffer(pem) {
            const base64 = String(pem)
              .replace('-----BEGIN PRIVATE KEY-----', '')
              .replace('-----END PRIVATE KEY-----', '')
              .replace(/\s+/g, '');
          
            if (!base64) {
              throw makeError(
                'DRIVE_READ_SERVICE_ACCOUNT_PRIVATE_KEY_INVALID',
                'Service account private key is invalid.',
              );
            }
          
            try {
              const binary = atob(base64);
              const bytes = new Uint8Array(binary.length);
              for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
              return bytes.buffer;
            } catch {
              throw makeError(
                'DRIVE_READ_SERVICE_ACCOUNT_PRIVATE_KEY_INVALID',
                'Service account private key is invalid.',
              );
            }
          }
          
          async function createServiceAccountAssertion(serviceAccount, nowMs = Date.now()) {
            const subtle = globalThis.crypto?.subtle;
            if (!subtle) {
              throw makeError(
                'DRIVE_READ_CRYPTO_UNAVAILABLE',
                'Web Crypto API is unavailable.',
              );
            }
          
            const iat = Math.floor(Number(nowMs) / 1000) - 30;
            const exp = iat + 3600;
            const header = { alg: 'RS256', typ: 'JWT' };
            const payload = {
              iss: serviceAccount.clientEmail,
              scope: READ_ONLY_SCOPE,
              aud: GOOGLE_TOKEN_ENDPOINT,
              iat,
              exp,
            };
          
            const unsigned = `${utf8ToBase64Url(JSON.stringify(header))}.${utf8ToBase64Url(JSON.stringify(payload))}`;
          
            let key;
            try {
              key = await subtle.importKey(
                'pkcs8',
                pemPkcs8ToArrayBuffer(serviceAccount.privateKey),
                { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' },
                false,
                ['sign'],
              );
            } catch {
              throw makeError(
                'DRIVE_READ_SERVICE_ACCOUNT_PRIVATE_KEY_INVALID',
                'Service account private key could not be imported.',
              );
            }
          
            const signature = await subtle.sign(
              'RSASSA-PKCS1-v1_5',
              key,
              new TextEncoder().encode(unsigned),
            );
          
            return `${unsigned}.${bytesToBase64Url(new Uint8Array(signature))}`;
          }
          
          export async function getGoogleServiceAccountAccessToken(env = {}, options = {}) {
            const cfg = requireDriveReadConfig(env);
            const fetcher = options.fetcher || fetch;
            const timeout = withTimeout(options.timeoutMs);
          
            try {
              const assertion = await createServiceAccountAssertion(
                cfg.serviceAccount,
                options.nowMs,
              );
          
              const body = new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion,
              });
          
              const response = await fetcher(GOOGLE_TOKEN_ENDPOINT, {
                method: 'POST',
                headers: { 'content-type': 'application/x-www-form-urlencoded' },
                body,
                signal: timeout.signal,
              });
          
              const data = await parseJsonResponse(response, 'DRIVE_READ_TOKEN');
          
              if (!response.ok) {
                throw makeError(
                  classifyGoogleStatus(response.status, 'DRIVE_READ_TOKEN'),
                  `Google service-account token request failed with HTTP ${response.status}.`,
                  { status: response.status },
                );
              }
          
              const accessToken = nonEmpty(data?.access_token);
              if (!accessToken) {
                throw makeError(
                  'DRIVE_READ_TOKEN_RESPONSE_INVALID',
                  'Google token response had no access token.',
                );
              }
          
              return {
                accessToken,
                tokenType: nonEmpty(data?.token_type) || 'Bearer',
                expiresIn: Number(data?.expires_in) || null,
                scope: READ_ONLY_SCOPE,
              };
            } catch (error) {
              if (error?.name === 'AbortError') {
                throw makeError(
                  'DRIVE_READ_TOKEN_TIMEOUT',
                  'Google service-account token request timed out.',
                );
              }
              if (error?.code) throw error;
              throw makeError('DRIVE_READ_TOKEN_NETWORK_ERROR', safeErrorMessage(error));
            } finally {
              timeout.clear();
            }
          }
          
          // Backward-compatible export name for existing integrations.
          // Authentication is service-account based in schema v1.2.
          export async function refreshGoogleReadAccessToken(env = {}, options = {}) {
            return getGoogleServiceAccountAccessToken(env, options);
          }
          
          async function googleSheetsGet(url, accessToken, options = {}) {
            const fetcher = options.fetcher || fetch;
            const timeout = withTimeout(options.timeoutMs);
          
            try {
              const response = await fetcher(url, {
                method: 'GET',
                headers: {
                  authorization: `Bearer ${accessToken}`,
                  accept: 'application/json',
                },
                signal: timeout.signal,
              });
          
              const data = await parseJsonResponse(response, 'DRIVE_READ_SHEETS');
          
              if (!response.ok) {
                throw makeError(
                  classifyGoogleStatus(response.status, 'DRIVE_READ_SHEETS'),
                  `Google Sheets API failed with HTTP ${response.status}.`,
                  { status: response.status },
                );
              }
          
              return data;
            } catch (error) {
              if (error?.name === 'AbortError') {
                throw makeError(
                  'DRIVE_READ_SHEETS_TIMEOUT',
                  'Google Sheets API request timed out.',
                );
              }
              if (error?.code) throw error;
              throw makeError('DRIVE_READ_SHEETS_NETWORK_ERROR', safeErrorMessage(error));
            } finally {
              timeout.clear();
            }
          }
          
          function normalizeOrganization(value) {
            const org = String(value ?? '').trim().toUpperCase();
            if (org !== 'JRA' && org !== 'NAR') {
              throw makeError(
                'DRIVE_READ_ORGANIZATION_REQUIRED',
                'organization must be explicitly JRA or NAR.',
              );
            }
            return org;
          }
          
          function allAllowedTitles() {
            return new Set([
              ...CHASS_DRIVE_SHEET_ALLOWLIST.JRA,
              ...CHASS_DRIVE_SHEET_ALLOWLIST.NAR,
            ]);
          }
          
          export function assertAllowedSheet(sheetTitle, organization = null) {
            const title = String(sheetTitle ?? '').trim();
          
            if (!title) {
              throw makeError('DRIVE_READ_SHEET_REQUIRED', 'sheet title is required.');
            }
          
            if (CHASS_DRIVE_LEGACY_DENYLIST.includes(title)) {
              throw makeError(
                'DRIVE_READ_LEGACY_SHEET_DENIED',
                `Legacy sheet is denied: ${title}`,
              );
            }
          
            if (organization) {
              const org = normalizeOrganization(organization);
              if (!CHASS_DRIVE_SHEET_ALLOWLIST[org].includes(title)) {
                throw makeError(
                  'DRIVE_READ_SHEET_NOT_ALLOWLISTED',
                  `Sheet is not allowlisted for ${org}: ${title}`,
                );
              }
              return { organization: org, sheetTitle: title };
            }
          
            if (!allAllowedTitles().has(title)) {
              throw makeError(
                'DRIVE_READ_SHEET_NOT_ALLOWLISTED',
                `Sheet is not allowlisted: ${title}`,
              );
            }
          
            const org = title.startsWith('JRA_')
              ? 'JRA'
              : title.startsWith('NAR_')
                ? 'NAR'
                : null;
          
            if (!org) {
              throw makeError(
                'DRIVE_READ_ORGANIZATION_REQUIRED',
                `Cannot infer explicit organization from sheet title: ${title}`,
              );
            }
          
            return { organization: org, sheetTitle: title };
          }
          
          function escapeA1SheetTitle(title) {
            return `'${String(title).replaceAll("'", "''")}'`;
          }
          
          function normalizeHeaders(row = []) {
            const seen = new Map();
            return row.map((value, index) => {
              const base = nonEmpty(value) || `column_${index + 1}`;
              const count = (seen.get(base) || 0) + 1;
              seen.set(base, count);
              return count === 1 ? base : `${base}__${count}`;
            });
          }
          
          function rowHasValue(row = []) {
            return row.some((value) => String(value ?? '').trim() !== '');
          }
          
          export function valuesToRecords(values = []) {
            const rows = Array.isArray(values) ? values : [];
            if (!rows.length) return { headers: [], rows: [], records: [] };
          
            const headers = normalizeHeaders(Array.isArray(rows[0]) ? rows[0] : []);
            const dataRows = rows
              .slice(1)
              .filter((row) => Array.isArray(row) && rowHasValue(row));
          
            const records = dataRows.map((row) => {
              const record = {};
              for (let i = 0; i < headers.length; i += 1) {
                record[headers[i]] = row[i] ?? '';
              }
              return record;
            });
          
            return { headers, rows: dataRows, records };
          }
          
          export async function readChassSpreadsheetCatalog(env = {}, options = {}) {
            const cfg = requireDriveReadConfig(env);
            const token = options.accessToken
              ? { accessToken: options.accessToken }
              : await getGoogleServiceAccountAccessToken(env, options);
          
            const fields = encodeURIComponent(
              'properties(title,locale,timeZone),sheets(properties(sheetId,title,index,hidden))',
            );
            const url = `${GOOGLE_SHEETS_BASE}/${encodeURIComponent(cfg.spreadsheetId)}?includeGridData=false&fields=${fields}`;
            const data = await googleSheetsGet(url, token.accessToken, options);
          
            const sheets = (data?.sheets || []).map((sheet) => ({
              sheetId: sheet?.properties?.sheetId ?? null,
              title: String(sheet?.properties?.title || ''),
              index: Number(sheet?.properties?.index) || 0,
              hidden: Boolean(sheet?.properties?.hidden),
            }));
          
            return {
              spreadsheetId: cfg.spreadsheetId,
              title: nonEmpty(data?.properties?.title),
              locale: nonEmpty(data?.properties?.locale),
              timeZone: nonEmpty(data?.properties?.timeZone),
              sheets,
              accessToken: token.accessToken,
            };
          }
          
          export async function readChassArchiveSheet(env = {}, sheetTitle, options = {}) {
            const cfg = requireDriveReadConfig(env);
            const checked = assertAllowedSheet(sheetTitle, options.organization || null);
            const token = options.accessToken
              ? { accessToken: options.accessToken }
              : await getGoogleServiceAccountAccessToken(env, options);
          
            const maxColumn = nonEmpty(options.maxColumn) || 'ZZ';
            if (!/^[A-Z]{1,3}$/.test(maxColumn)) {
              throw makeError('DRIVE_READ_RANGE_INVALID', 'maxColumn must be A-ZZZ.');
            }
          
            const maxRowsRaw = Number(options.maxRows);
            const maxRows = Number.isInteger(maxRowsRaw) && maxRowsRaw > 0
              ? Math.min(maxRowsRaw, 5000)
              : null;
          
            const a1 = maxRows
              ? `${escapeA1SheetTitle(checked.sheetTitle)}!A1:${maxColumn}${maxRows}`
              : `${escapeA1SheetTitle(checked.sheetTitle)}!A:${maxColumn}`;
          
            const params = new URLSearchParams({
              majorDimension: 'ROWS',
              valueRenderOption: 'UNFORMATTED_VALUE',
              dateTimeRenderOption: 'FORMATTED_STRING',
            });
          
            const url = `${GOOGLE_SHEETS_BASE}/${encodeURIComponent(cfg.spreadsheetId)}/values/${encodeURIComponent(a1)}?${params}`;
            const data = await googleSheetsGet(url, token.accessToken, options);
            const converted = valuesToRecords(data?.values || []);
          
            return {
              schemaVersion: CHASS_DRIVE_READONLY_SCHEMA_VERSION,
              source: 'google_sheets',
              authMode: 'service_account',
              mode: 'read_only',
              organization: checked.organization,
              spreadsheetId: cfg.spreadsheetId,
              sheetTitle: checked.sheetTitle,
              range: nonEmpty(data?.range) || a1,
              rowCount: converted.records.length,
              headers: converted.headers,
              records: converted.records,
              ...(options.includeRows ? { rows: converted.rows } : {}),
            };
          }
          
          export async function readChassArchiveOrganization(env = {}, organization, options = {}) {
            const org = normalizeOrganization(organization);
            const catalog = await readChassSpreadsheetCatalog(env, options);
            const existing = new Set(
              catalog.sheets.filter((s) => !s.hidden).map((s) => s.title),
            );
          
            const requested = Array.isArray(options.sheetNames) && options.sheetNames.length
              ? options.sheetNames.map((name) => assertAllowedSheet(name, org).sheetTitle)
              : [...CHASS_DRIVE_SHEET_ALLOWLIST[org]];
          
            const available = requested.filter((name) => existing.has(name));
            const missing = requested.filter((name) => !existing.has(name));
            const sheets = {};
          
            for (const name of available) {
              sheets[name] = await readChassArchiveSheet(env, name, {
                ...options,
                organization: org,
                accessToken: catalog.accessToken,
              });
            }
          
            return {
              schemaVersion: CHASS_DRIVE_READONLY_SCHEMA_VERSION,
              source: 'google_sheets',
              authMode: 'service_account',
              mode: 'read_only',
              organization: org,
              spreadsheet: {
                id: catalog.spreadsheetId,
                title: catalog.title,
                locale: catalog.locale,
                timeZone: catalog.timeZone,
              },
              availableSheets: available,
              missingSheets: missing,
              sheets,
            };
          }
          
          export async function readChassArchive(env = {}, options = {}) {
            const org = normalizeOrganization(options.organization);
            return readChassArchiveOrganization(env, org, options);
          }
          
          export function sanitizeDriveReadError(error) {
            return {
              code: nonEmpty(error?.code) || 'DRIVE_READ_UNKNOWN_ERROR',
              message: safeErrorMessage(error),
              status: Number(error?.status) || null,
            };
          }
          CHASS_READER_EOF

      - name: Install Service Account Reader tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests
          cat > tests/google-drive-readonly-import.test.mjs <<'CHASS_TEST_EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { webcrypto } from 'node:crypto';
          
          if (!globalThis.crypto) globalThis.crypto = webcrypto;
          
          import {
            CHASS_DRIVE_SHEET_ALLOWLIST,
            assertAllowedSheet,
            driveReadImportEnabled,
            getDriveReadReadiness,
            getGoogleServiceAccountAccessToken,
            readChassArchiveSheet,
            valuesToRecords,
          } from '../google-drive-readonly-import.mjs';
          
          function arrayBufferToBase64(buffer) {
            return Buffer.from(new Uint8Array(buffer)).toString('base64');
          }
          
          async function makeServiceAccountJson() {
            const pair = await crypto.subtle.generateKey(
              {
                name: 'RSASSA-PKCS1-v1_5',
                modulusLength: 2048,
                publicExponent: new Uint8Array([1, 0, 1]),
                hash: 'SHA-256',
              },
              true,
              ['sign', 'verify'],
            );
          
            const pkcs8 = await crypto.subtle.exportKey('pkcs8', pair.privateKey);
            const b64 = arrayBufferToBase64(pkcs8).match(/.{1,64}/g).join('\n');
          
            return JSON.stringify({
              type: 'service_account',
              project_id: 'chass-test',
              private_key_id: 'test-key',
              private_key: `-----BEGIN PRIVATE KEY-----\n${b64}\n-----END PRIVATE KEY-----\n`,
              client_email: 'chass-drive-reader@chass-test.iam.gserviceaccount.com',
              client_id: '1234567890',
              token_uri: 'https://oauth2.googleapis.com/token',
            });
          }
          
          async function completeEnv() {
            return {
              ENABLE_DRIVE_READ_IMPORT: 'true',
              CHASS_DRIVE_SPREADSHEET_ID: 'sheet-123',
              GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON: await makeServiceAccountJson(),
            };
          }
          
          test('Drive read import defaults disabled', () => {
            assert.equal(driveReadImportEnabled({}), false);
            assert.equal(driveReadImportEnabled({ ENABLE_DRIVE_READ_IMPORT: 'false' }), false);
            assert.equal(driveReadImportEnabled({ ENABLE_DRIVE_READ_IMPORT: 'true' }), true);
          });
          
          test('readiness requires service-account JSON and does not expose secret contents', async () => {
            const readiness = getDriveReadReadiness({
              ENABLE_DRIVE_READ_IMPORT: 'true',
              CHASS_DRIVE_SPREADSHEET_ID: 'sheet-123',
            });
          
            assert.equal(readiness.authMode, 'service_account');
            assert.equal(readiness.configured, false);
            assert.deepEqual(readiness.missing, ['GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON']);
          
            const env = await completeEnv();
            const configured = getDriveReadReadiness(env);
            assert.equal(configured.configured, true);
            assert.equal(configured.credentialValid, true);
            assert.equal(JSON.stringify(configured).includes('PRIVATE KEY'), false);
            assert.equal(JSON.stringify(configured).includes('chass-drive-reader@'), false);
          });
          
          test('JRA and NAR sheet allowlists remain isolated', () => {
            const jra = CHASS_DRIVE_SHEET_ALLOWLIST.JRA[0];
            const nar = CHASS_DRIVE_SHEET_ALLOWLIST.NAR[0];
          
            assert.deepEqual(assertAllowedSheet(jra, 'JRA'), {
              organization: 'JRA',
              sheetTitle: jra,
            });
          
            assert.deepEqual(assertAllowedSheet(nar, 'NAR'), {
              organization: 'NAR',
              sheetTitle: nar,
            });
          
            assert.throws(() => assertAllowedSheet(nar, 'JRA'), {
              code: 'DRIVE_READ_SHEET_NOT_ALLOWLISTED',
            });
          
            assert.throws(() => assertAllowedSheet(jra, 'NAR'), {
              code: 'DRIVE_READ_SHEET_NOT_ALLOWLISTED',
            });
          });
          
          test('legacy common sheets are denied', () => {
            assert.throws(() => assertAllowedSheet('CHASS指数マスター'), {
              code: 'DRIVE_READ_LEGACY_SHEET_DENIED',
            });
          });
          
          test('valuesToRecords keeps deterministic de-duplicated headers', () => {
            const converted = valuesToRecords([
              ['馬番', '馬名', '馬名'],
              [1, 'テストA', '別名A'],
              [2, 'テストB'],
              ['', '', ''],
            ]);
          
            assert.deepEqual(converted.headers, ['馬番', '馬名', '馬名__2']);
            assert.equal(converted.records.length, 2);
            assert.deepEqual(converted.records[1], {
              馬番: 2,
              馬名: 'テストB',
              馬名__2: '',
            });
          });
          
          test('service-account token exchange uses JWT bearer POST without client secret or refresh token', async () => {
            const env = await completeEnv();
            const calls = [];
          
            const fetcher = async (url, init = {}) => {
              const body = init.body instanceof URLSearchParams ? init.body : new URLSearchParams(init.body);
              calls.push({
                url: String(url),
                method: init.method || 'GET',
                grantType: body.get('grant_type'),
                assertion: body.get('assertion'),
              });
          
              return new Response(JSON.stringify({
                access_token: 'access-token',
                token_type: 'Bearer',
                expires_in: 3600,
              }), {
                status: 200,
                headers: { 'content-type': 'application/json' },
              });
            };
          
            const token = await getGoogleServiceAccountAccessToken(env, {
              fetcher,
              nowMs: 1_700_000_000_000,
            });
          
            assert.equal(token.accessToken, 'access-token');
            assert.equal(calls.length, 1);
            assert.equal(calls[0].method, 'POST');
            assert.equal(
              calls[0].grantType,
              'urn:ietf:params:oauth:grant-type:jwt-bearer',
            );
            assert.equal(calls[0].assertion.split('.').length, 3);
            assert.equal(JSON.stringify(calls).includes('refresh_token'), false);
            assert.equal(JSON.stringify(calls).includes('client_secret'), false);
          });
          
          test('sheet data path uses Google Sheets GET only and supports bounded live-test range', async () => {
            const env = await completeEnv();
            const calls = [];
          
            const fetcher = async (url, init = {}) => {
              const call = { url: String(url), method: init.method || 'GET' };
              calls.push(call);
          
              if (call.url.includes('oauth2.googleapis.com/token')) {
                return new Response(JSON.stringify({
                  access_token: 'access-token',
                  token_type: 'Bearer',
                  expires_in: 3600,
                }), {
                  status: 200,
                  headers: { 'content-type': 'application/json' },
                });
              }
          
              return new Response(JSON.stringify({
                range: "'JRA_指数マスター'!A1:A2",
                values: [
                  ['開催日'],
                  ['2026-09-13'],
                ],
              }), {
                status: 200,
                headers: { 'content-type': 'application/json' },
              });
            };
          
            const result = await readChassArchiveSheet(
              env,
              'JRA_指数マスター',
              {
                organization: 'JRA',
                maxColumn: 'A',
                maxRows: 2,
                fetcher,
              },
            );
          
            assert.equal(result.authMode, 'service_account');
            assert.equal(result.mode, 'read_only');
            assert.equal(result.organization, 'JRA');
            assert.equal(result.rowCount, 1);
          
            const sheetsCalls = calls.filter((c) => c.url.includes('sheets.googleapis.com'));
            assert.equal(sheetsCalls.length, 1);
            assert.equal(sheetsCalls[0].method, 'GET');
            assert.match(decodeURIComponent(sheetsCalls[0].url), /JRA_指数マスター.*A1:A2/);
          
            const joined = calls.map((c) => `${c.method} ${c.url}`).join('\n');
            assert.equal(/values:append|:batchUpdate|\/values\/[^?]+:(?:append|update)/i.test(joined), false);
          });
          CHASS_TEST_EOF

      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check google-drive-readonly-import.mjs
          node --check tests/google-drive-readonly-import.test.mjs

      - name: Verify read-only safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("google-drive-readonly-import.mjs").read_text(encoding="utf-8")

          required = [
              "GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON",
              "service_account",
              "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "https://www.googleapis.com/auth/spreadsheets.readonly",
              "method: 'GET'",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit("Missing Service Account/read-only markers: " + ", ".join(missing))

          forbidden = [
              r"GOOGLE_DRIVE_READ_CLIENT_SECRET",
              r"GOOGLE_DRIVE_READ_REFRESH_TOKEN",
              r"grant_type:\s*['\"]refresh_token",
              r"values:append",
              r":batchUpdate",
              r"drive\.files\.create",
              r"drive\.files\.update",
              r"drive\.files\.delete",
              r"\.prepare\(",
              r"\.run\(",
          ]
          found = [pattern for pattern in forbidden if re.search(pattern, text, re.I)]
          if found:
              raise SystemExit("Forbidden legacy/write marker found: " + ", ".join(found))

          print("Service Account read-only safety contract: PASS")
          PY

      - name: Run Reader-only tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/google-drive-readonly-import.test.mjs

      - name: Live verify private CHASS Sheet access
        id: live
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            getDriveReadReadiness,
            readChassArchiveSheet,
            readChassSpreadsheetCatalog,
          } from './google-drive-readonly-import.mjs';

          const env = {
            ENABLE_DRIVE_READ_IMPORT: process.env.ENABLE_DRIVE_READ_IMPORT,
            CHASS_DRIVE_SPREADSHEET_ID: process.env.CHASS_DRIVE_SPREADSHEET_ID,
            GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON:
              process.env.GOOGLE_DRIVE_READ_SERVICE_ACCOUNT_JSON,
          };

          const readiness = getDriveReadReadiness(env);
          if (!readiness.configured || !readiness.credentialValid) {
            console.error('::error::Service Account Reader is not configured.');
            process.exit(1);
          }

          const catalog = await readChassSpreadsheetCatalog(env);
          if (catalog.title !== 'CHASS競馬研究所_アーカイブマスター') {
            console.error('::error::Connected spreadsheet title does not match CHASS master.');
            process.exit(1);
          }

          const visibleTitles = new Set(
            catalog.sheets.filter((sheet) => !sheet.hidden).map((sheet) => sheet.title),
          );

          if (!visibleTitles.has('JRA_指数マスター')) {
            console.error('::error::JRA_指数マスター is not visible to the Service Account.');
            process.exit(1);
          }

          const sample = await readChassArchiveSheet(
            env,
            'JRA_指数マスター',
            {
              organization: 'JRA',
              maxColumn: 'A',
              maxRows: 2,
              accessToken: catalog.accessToken,
            },
          );

          console.log('Live Google Sheets authentication: PASS');
          console.log('Private CHASS master access: PASS');
          console.log('JRA_指数マスター bounded read: PASS');
          console.log(`Visible sheet count: ${catalog.sheets.length}`);
          console.log(`Sample parsed data rows: ${sample.rowCount}`);

          {
            const fs = await import('node:fs');
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `sheet_count=${catalog.sheets.length}\nsample_rows=${sample.rowCount}\n`,
            );
          }
          NODE

      - name: Verify protected app files are unchanged
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js worker.js server.mjs research-storage-sync.mjs package.json wrangler.jsonc; do
            if [ -f "$f" ]; then sha256sum "$f"; fi
          done > /tmp/chass-protected-after.sha256
          diff -u /tmp/chass-protected-before.sha256 /tmp/chass-protected-after.sha256

      - name: Restrict repository changes to Reader files
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(google-drive-readonly-import\.mjs|tests/google-drive-readonly-import\.test\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected file changes detected:"
            echo "$unexpected"
            exit 1
          fi
          echo "Only Reader implementation/test files changed."

      - name: Write verified summary
        shell: bash
        env:
          SHEET_COUNT: ${{ steps.live.outputs.sheet_count }}
          SAMPLE_ROWS: ${{ steps.live.outputs.sample_rows }}
        run: |
          set -euo pipefail
          reader_sha="$(sha256sum google-drive-readonly-import.mjs | awk '{print $1}')"
          {
            echo "## CHASS Google Drive Service Account Reader v1.2"
            echo
            echo "- Service Account secret validation: PASS"
            echo "- Reader syntax: PASS"
            echo "- Reader-only tests: PASS"
            echo "- Read-only safety contract: PASS"
            echo "- Live Google authentication: PASS"
            echo "- Private CHASS master access: PASS"
            echo "- JRA bounded read: PASS"
            echo "- Visible Sheet count: ${SHEET_COUNT:-unknown}"
            echo "- Sample parsed data rows: ${SAMPLE_ROWS:-unknown}"
            echo "- Existing protected app files changed: NO"
            echo "- Drive sharing settings changed by workflow: NO"
            echo "- D1 writes added: NO"
            echo "- OAuth Refresh Token required: NO"
            echo "- Reader SHA-256: \`$reader_sha\`"
            echo
            echo "> This verifies GitHub Actions -> Service Account -> private Google Sheet read access."
            echo "> It does not yet place the Service Account secret into Cloudflare Worker runtime."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit verified Service Account Reader
        if: ${{ inputs.commit_changes }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- google-drive-readonly-import.mjs tests/google-drive-readonly-import.test.mjs \
             && [ -z "$(git status --porcelain --untracked-files=all -- google-drive-readonly-import.mjs tests/google-drive-readonly-import.test.mjs)" ]; then
            echo "Service Account Reader is already installed and identical."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add google-drive-readonly-import.mjs tests/google-drive-readonly-import.test.mjs
          git commit -m "Switch Drive reader to service account auth"
          git push

      - name: Final status
        shell: bash
        run: |
          set -euo pipefail
          echo "CHASS Service Account Reader switch and live verification completed successfully."
