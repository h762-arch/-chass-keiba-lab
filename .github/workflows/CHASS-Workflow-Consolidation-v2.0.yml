name: CHASS Workflow Consolidation v2.6 Root Slim Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Batch10はまずaudit_onlyのみ"
        required: true
        default: "audit_only"
        type: choice
        options:
          - audit_only

permissions:
  contents: read

concurrency:
  group: chass-root-slim-batch10-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Safety preflight
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.mode }}" = "audit_only"
          test "$GITHUB_REF_NAME" = "chass/root-slim-batch10"
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"

          # Canonical entry/config files must exist and stay at root during this audit.
          for KEEP in \
            README.md package.json package-lock.json server.mjs worker.js app.js \
            index.html styles.css wrangler.jsonc .gitignore .assetsignore \
            openapi.json manifest.webmanifest d1-schema.sql chass-latest.js
          do
            test -e "$KEEP" || {
              echo "::error::Required root file missing: $KEEP"
              exit 1
            }
          done

          test -d .github/workflows
          test -d tests
          test -d scripts
          test -d mcp
          test -d migrations
          test -d viewer
          test -d archive

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install root and MCP dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix mcp

      - name: Baseline full regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Build root dependency inventory
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          root = Path(".")
          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()

          # Current root files only; directories are separately listed.
          root_files = sorted(
              p.name for p in root.iterdir()
              if p.is_file() and p.name not in {".DS_Store"}
          )
          root_dirs = sorted(
              p.name for p in root.iterdir()
              if p.is_dir() and p.name not in {".git", "node_modules"}
          )

          # Files that must remain at root for now.
          hard_keep = {
              ".assetsignore", ".gitignore",
              "README.md", "package.json", "package-lock.json",
              "server.mjs", "worker.js", "app.js",
              "index.html", "styles.css", "wrangler.jsonc",
              "openapi.json", "manifest.webmanifest",
              "d1-schema.sql", "chass-latest.js",
          }

          # Candidate families. This audit does NOT move anything.
          fixture_patterns = (
              "-fixture.", "fixtures.", "kawasaki.json",
          )
          doc_names = {
              "AI_BRIDGE.md",
              "CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md",
          }
          research_names = {
              "calibration-research.js",
              "similarity-intelligence.mjs",
              "longshot-scenario.js",
              "research-storage-sync.mjs",
          }

          # Runtime-ish files whose relocation needs import/workflow updates.
          runtime_prefixes = (
              "jra-", "nar-", "meeting-",
              "google-drive-", "publish-ai-",
          )

          text_exts = {
              ".js", ".mjs", ".cjs", ".json", ".jsonc", ".yml", ".yaml",
              ".md", ".html", ".css", ".txt", ".sql", ".webmanifest"
          }

          # Read all tracked text files except archives, so historic copies do not
          # create false dependencies.
          searchable = []
          for rel in tracked:
              if rel.startswith("archive/"):
                  continue
              p = Path(rel)
              if not p.is_file():
                  continue
              if p.suffix.lower() not in text_exts and p.name not in {
                  ".gitignore", ".assetsignore"
              }:
                  continue
              try:
                  txt = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              searchable.append((rel, txt))

          rows = []
          for name in root_files:
              refs = []
              token = name
              for rel, txt in searchable:
                  if rel == name:
                      continue
                  # Exact filename occurrence is intentionally conservative.
                  if token in txt:
                      refs.append(rel)

              # Classify by current role, not by desired final location.
              if name in hard_keep:
                  cls = "KEEP_ROOT"
              elif name in doc_names or name.endswith(".md") or name.endswith(".txt"):
                  cls = "DOC_CANDIDATE"
              elif (
                  any(x in name for x in fixture_patterns)
                  or name == "nar-fixtures.mjs"
              ):
                  cls = "FIXTURE_CANDIDATE"
              elif name in research_names:
                  cls = "RESEARCH_CANDIDATE"
              elif name.startswith(runtime_prefixes) or name.startswith("jra"):
                  cls = "RUNTIME_REFACTOR_LATER"
              elif name.endswith((".js", ".mjs")):
                  cls = "SOURCE_REVIEW"
              else:
                  cls = "REVIEW"

              rows.append({
                  "file": name,
                  "class": cls,
                  "referenceCount": len(refs),
                  "references": refs[:30],
              })

          # Explicitly inspect the two config surfaces most likely to break after moves.
          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          wrangler = Path("wrangler.jsonc").read_text(encoding="utf-8")

          report = {
              "rootFileCount": len(root_files),
              "rootDirectoryCount": len(root_dirs),
              "rootDirectories": root_dirs,
              "packageScripts": package.get("scripts", {}),
              "wranglerMain": re.search(r'"main"\s*:\s*"([^"]+)"', wrangler).group(1),
              "wranglerAssetsDirectory": re.search(
                  r'"directory"\s*:\s*"([^"]+)"', wrangler
              ).group(1),
              "files": rows,
          }

          Path("/tmp/batch10-root-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          classes = {}
          for row in rows:
              classes.setdefault(row["class"], []).append(row)

          with Path("/tmp/batch10-summary.md").open("w", encoding="utf-8") as f:
              f.write("## CHASS Root Slim Batch10 — Audit\n\n")
              f.write(f"- Branch: `{subprocess.check_output(['git','branch','--show-current'], text=True).strip()}`\n")
              f.write(f"- Root files: **{len(root_files)}**\n")
              f.write(f"- Root directories: **{len(root_dirs)}**\n")
              f.write("- Changes applied: **NO**\n")
              f.write("- main direct push: **NO**\n")
              f.write("- Full regression before analysis: **PASS**\n")
              f.write(f"- Wrangler main: `{report['wranglerMain']}`\n")
              f.write(f"- Wrangler assets.directory: `{report['wranglerAssetsDirectory']}`\n\n")

              order = [
                  "KEEP_ROOT",
                  "FIXTURE_CANDIDATE",
                  "DOC_CANDIDATE",
                  "RESEARCH_CANDIDATE",
                  "RUNTIME_REFACTOR_LATER",
                  "SOURCE_REVIEW",
                  "REVIEW",
              ]
              for cls in order:
                  vals = classes.get(cls, [])
                  if not vals:
                      continue
                  f.write(f"### {cls} ({len(vals)})\n")
                  for row in vals:
                      f.write(
                          f"- `{row['file']}` — refs: {row['referenceCount']}"
                      )
                      if row["references"]:
                          shown = ", ".join(f"`{x}`" for x in row["references"][:6])
                          f.write(f" — {shown}")
                          if row["referenceCount"] > 6:
                              f.write(" …")
                      f.write("\n")
                  f.write("\n")

              f.write("### Safety interpretation\n")
              f.write("- `KEEP_ROOT`: Batch10でも移動しない\n")
              f.write("- `FIXTURE_CANDIDATE`: 最初の移動候補。参照先を同時修正してからテスト\n")
              f.write("- `DOC_CANDIDATE`: docs/移動候補。README等のリンク更新が必要なら同時修正\n")
              f.write("- `RESEARCH_CANDIDATE`: src/research/候補。import参照を確認して別フェーズ\n")
              f.write("- `RUNTIME_REFACTOR_LATER`: JRA/NAR/Drive実行系。Production Smoke込みで後段\n")
              f.write("- 今回はauditのみ。rename/deleteは0件\n")

          print(Path("/tmp/batch10-summary.md").read_text(encoding="utf-8"))
          PY

      - name: Publish Batch10 audit summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/batch10-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Batch10 audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: chass-root-slim-batch10-audit
          path: /tmp/batch10-root-audit.json
          if-no-files-found: error
          retention-days: 14
