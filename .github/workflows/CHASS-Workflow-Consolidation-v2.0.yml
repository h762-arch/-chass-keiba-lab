name: CHASS Workflow Consolidation v2.7.1 Root Slim Phase B

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit_only=参照確認 / apply=research系4ファイルをsrc/researchへ移動"
        required: true
        default: "audit_only"
        type: choice
        options:
          - audit_only
          - apply

permissions:
  contents: write

concurrency:
  group: chass-root-slim-batch10-phaseb-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  phase_b:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install root and MCP dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix mcp

      - name: Phase B safety preflight
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          test "$MODE" = "audit_only" -o "$MODE" = "apply"
          test "$GITHUB_REF_NAME" = "chass/root-slim-batch10-phaseb"

          if [ "$MODE" = "apply" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::apply on main is forbidden."
            exit 1
          fi

          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"

          for FILE in \
            calibration-research.js \
            similarity-intelligence.mjs \
            longshot-scenario.js \
            research-storage-sync.mjs
          do
            test -f "$FILE" || {
              echo "::error::Phase B source missing: $FILE"
              exit 1
            }
          done

          # Exact reference topology established by v2.7 audit.
          grep -Fq "calibration-research.js" index.html
          grep -Fq "../calibration-research.js" tests/calibration-research.test.mjs

          grep -Fq "./similarity-intelligence.mjs" worker.js
          grep -Fq "../similarity-intelligence.mjs" tests/similarity-intelligence.test.mjs
          grep -Fq "../similarity-intelligence.mjs" tests/background-historical-collector.test.mjs

          grep -Fq "longshot-scenario.js" index.html
          grep -Fq "../longshot-scenario.js" tests/longshot-scenario.test.mjs

          grep -Fq "./research-storage-sync.mjs" worker.js
          grep -Fq "../research-storage-sync.mjs" tests/research-storage-sync.test.mjs
          grep -Fq "../research-storage-sync.mjs" tests/google-drive-production.test.mjs

          for FILE in \
            calibration-research.js \
            similarity-intelligence.mjs \
            longshot-scenario.js \
            research-storage-sync.mjs
          do
            grep -Fq "node --check $FILE" package.json
          done

          # Core entry/config files are not relocated in Phase B.
          for KEEP in \
            README.md app.js worker.js server.mjs index.html styles.css \
            package.json package-lock.json wrangler.jsonc openapi.json d1-schema.sql
          do
            test -f "$KEEP"
          done

          {
            echo "## CHASS Root Slim Batch10 — Phase B Preflight"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Mode: \`$MODE\`"
            echo "- Research source moves: **4**"
            echo "- Destination: \`src/research/\`"
            echo "- Runtime entry files moved: **0**"
            echo "- Delete operations: **0**"
            echo "- main direct push: **NO**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Baseline full regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Apply Phase B research layout
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = "chass/root-slim-batch10-phaseb"
          test "$GITHUB_REF_NAME" != "main"

          mkdir -p src/research

          git mv calibration-research.js src/research/calibration-research.js
          git mv similarity-intelligence.mjs src/research/similarity-intelligence.mjs
          git mv longshot-scenario.js src/research/longshot-scenario.js
          git mv research-storage-sync.mjs src/research/research-storage-sync.mjs

          python3 - <<'PY'
          from pathlib import Path

          exact = {
              "worker.js": [
                  ("'./similarity-intelligence.mjs'",
                   "'./src/research/similarity-intelligence.mjs'"),
                  ("'./research-storage-sync.mjs'",
                   "'./src/research/research-storage-sync.mjs'"),
              ],
              "tests/calibration-research.test.mjs": [
                  ("'../calibration-research.js'",
                   "'../src/research/calibration-research.js'"),
              ],
              "tests/similarity-intelligence.test.mjs": [
                  ("'../similarity-intelligence.mjs'",
                   "'../src/research/similarity-intelligence.mjs'"),
              ],
              "tests/background-historical-collector.test.mjs": [
                  ("'../similarity-intelligence.mjs'",
                   "'../src/research/similarity-intelligence.mjs'"),
              ],
              "tests/longshot-scenario.test.mjs": [
                  ("'../longshot-scenario.js'",
                   "'../src/research/longshot-scenario.js'"),
              ],
              "tests/research-storage-sync.test.mjs": [
                  ("'../research-storage-sync.mjs'",
                   "'../src/research/research-storage-sync.mjs'"),
              ],
              "tests/google-drive-production.test.mjs": [
                  ("'../research-storage-sync.mjs'",
                   "'../src/research/research-storage-sync.mjs'"),
              ],
          }

          for filename, pairs in exact.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              before = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(
                          f"Expected exact reference missing: {filename}: {old}"
                      )
                  text = text.replace(old, new)
              if text == before:
                  raise SystemExit(f"No reference update made: {filename}")
              path.write_text(text, encoding="utf-8")

          # Browser script paths: preserve any existing ./ or / prefix by replacing
          # only the filename token.
          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          for old, new in [
              ("calibration-research.js",
               "src/research/calibration-research.js"),
              ("longshot-scenario.js",
               "src/research/longshot-scenario.js"),
          ]:
              if old not in text:
                  raise SystemExit(f"index reference missing: {old}")
              text = text.replace(old, new)
          index.write_text(text, encoding="utf-8")

          # Update syntax-check paths without changing the command ordering.
          package = Path("package.json")
          text = package.read_text(encoding="utf-8")
          for old, new in [
              ("node --check calibration-research.js",
               "node --check src/research/calibration-research.js"),
              ("node --check similarity-intelligence.mjs",
               "node --check src/research/similarity-intelligence.mjs"),
              ("node --check longshot-scenario.js",
               "node --check src/research/longshot-scenario.js"),
              ("node --check research-storage-sync.mjs",
               "node --check src/research/research-storage-sync.mjs"),
          ]:
              if old not in text:
                  raise SystemExit(f"package check reference missing: {old}")
              text = text.replace(old, new)
          package.write_text(text, encoding="utf-8")

          # google-drive-production.test.mjs also has a runtimeFiles array string.
          gd = Path("tests/google-drive-production.test.mjs")
          text = gd.read_text(encoding="utf-8")
          old = "'../research-storage-sync.mjs'"
          new = "'../src/research/research-storage-sync.mjs'"
          if old in text:
              text = text.replace(old, new)
          gd.write_text(text, encoding="utf-8")
          PY

          # New destinations exist; old root paths are gone.
          for FILE in \
            calibration-research.js \
            similarity-intelligence.mjs \
            longshot-scenario.js \
            research-storage-sync.mjs
          do
            test ! -e "$FILE"
            test -f "src/research/$FILE"
          done

          # Runtime and browser references point to the new canonical paths.
          grep -Fq "./src/research/similarity-intelligence.mjs" worker.js
          grep -Fq "./src/research/research-storage-sync.mjs" worker.js
          grep -Fq "src/research/calibration-research.js" index.html
          grep -Fq "src/research/longshot-scenario.js" index.html

          # Ensure no active tracked file still references an old root location by
          # path form. Filename mentions inside the consolidation workflow itself
          # are expected and excluded.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          old_path_tokens = [
              "'./similarity-intelligence.mjs'",
              "'./research-storage-sync.mjs'",
              "'../calibration-research.js'",
              "'../similarity-intelligence.mjs'",
              "'../longshot-scenario.js'",
              "'../research-storage-sync.mjs'",
          ]

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()

          offenders = []
          for rel in tracked:
              if rel.startswith("archive/"):
                  continue
              if rel == ".github/workflows/CHASS-Workflow-Consolidation-v2.0.yml":
                  continue
              p = Path(rel)
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              for token in old_path_tokens:
                  if token in text:
                      offenders.append(f"{rel}: {token}")

          if offenders:
              raise SystemExit(
                  "Old research path references remain:\n" + "\n".join(offenders)
              )
          PY

      - name: Post-move module resolution checks
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          node --check src/research/calibration-research.js
          node --check src/research/similarity-intelligence.mjs
          node --check src/research/longshot-scenario.js
          node --check src/research/research-storage-sync.mjs

          node --input-type=module -e "await import('./src/research/similarity-intelligence.mjs')"
          node --input-type=module -e "await import('./src/research/research-storage-sync.mjs')"

          # Browser entry points must reference files that actually exist.
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("index.html").read_text(encoding="utf-8")
          for wanted in [
              "src/research/calibration-research.js",
              "src/research/longshot-scenario.js",
          ]:
              if wanted not in text:
                  raise SystemExit(f"Browser research script missing: {wanted}")
              if not Path(wanted).is_file():
                  raise SystemExit(f"Browser research script file missing: {wanted}")
          PY

      - name: Post-move full regression
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Commit Phase B
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          python3 - <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/CHASS-Workflow-Consolidation-v2.0.yml",
              "package.json",
              "index.html",
              "worker.js",
              "tests/calibration-research.test.mjs",
              "tests/similarity-intelligence.test.mjs",
              "tests/background-historical-collector.test.mjs",
              "tests/longshot-scenario.test.mjs",
              "tests/research-storage-sync.test.mjs",
              "tests/google-drive-production.test.mjs",
              "calibration-research.js",
              "similarity-intelligence.mjs",
              "longshot-scenario.js",
              "research-storage-sync.mjs",
              "src/research/calibration-research.js",
              "src/research/similarity-intelligence.mjs",
              "src/research/longshot-scenario.js",
              "src/research/research-storage-sync.mjs",
          }

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "Unexpected changed files: " + ", ".join(unexpected)
              )
          PY

          test -n "$(git diff --cached --name-only)"

          git commit -m "refactor: move research modules under src batch10 phase b"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "## CHASS Root Slim Batch10 — Phase B Applied"
            echo
            echo "- Research modules moved: **4**"
            echo "- Destination: \`src/research/\`"
            echo "- Runtime/browser/test references updated: **YES**"
            echo "- Full regression after move: **PASS**"
            echo "- Deleted: **0**"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- main direct push: **NO**"
          } >> "$GITHUB_STEP_SUMMARY"
