name: CHASS Workflow Consolidation v2.6.2 Root Slim Phase A

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit_only=確認 / apply=fixtures+docsを正式配置へ移動"
        required: true
        default: "audit_only"
        type: choice
        options:
          - audit_only
          - apply

permissions:
  contents: write

concurrency:
  group: chass-root-slim-batch10-phase-a-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  phase_a:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install root and MCP dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix mcp

      - name: Phase A safety preflight
        id: audit
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          test "$MODE" = "audit_only" -o "$MODE" = "apply"
          test "$GITHUB_REF_NAME" = "chass/root-slim-batch10"

          if [ "$MODE" = "apply" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::apply on main is forbidden."
            exit 1
          fi

          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"

          # Phase A is deliberately limited to fixtures and two documents.
          for FILE in \
            jra-program-fixture.html \
            jra-race-card-fixture.html \
            jra-result-fixture.html \
            nar-fixtures.mjs \
            AI_BRIDGE.md \
            CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md
          do
            test -f "$FILE" || {
              echo "::error::Phase A source missing: $FILE"
              exit 1
            }
          done

          # Exact current references observed in Batch10 audit.
          grep -Fq "../jra-program-fixture.html" tests/jra-j1.test.mjs
          grep -Fq "../jra-race-card-fixture.html" tests/jra-j2.test.mjs
          grep -Fq "../jra-race-card-fixture.html" tests/jra-j3.test.mjs
          grep -Fq "../jra-race-card-fixture.html" tests/jra-j4.test.mjs
          grep -Fq "../jra-result-fixture.html" tests/jra-j4.test.mjs

          grep -Fq "nar-fixtures.mjs" regression.test.mjs
          grep -Fq "nar-fixtures.mjs" tests/auto-result-queue.test.mjs
          grep -Fq "nar-fixtures.mjs" README.md
          grep -Fq "CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md" README.md

          # kawasaki.json is a published/snapshot-style root artifact, not a test fixture.
          # Keep it in root until its external/static role is separately proven safe to move.
          test -f kawasaki.json

          # Runtime/config surfaces remain untouched in Phase A.
          for KEEP in \
            app.js worker.js server.mjs package.json package-lock.json wrangler.jsonc \
            jra-race-fetch.mjs jra-odds-fetch.mjs jra-result-fetch.mjs \
            google-drive-readonly-api.mjs google-drive-readonly-import.mjs
          do
            test -f "$KEEP"
          done

          {
            echo "## CHASS Root Slim Batch10 — Phase A Audit v2.6.2"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Mode: \`$MODE\`"
            echo "- Fixture moves: **4**"
            echo "- Document moves: **2**"
            echo "- Runtime/source module moves: **0**"
            echo "- Delete operations: **0**"
            echo "- main direct push: **NO**"
            echo
            echo "### Planned destinations"
            echo "- \`tests/fixtures/jra/\`"
            echo "- \`tests/fixtures/nar/\`"
            echo "- \`docs/\`"
            echo "- \`docs/reports/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Baseline full regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Apply Phase A moves and reference updates
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "chass/root-slim-batch10"
          test "$GITHUB_REF_NAME" != "main"

          mkdir -p tests/fixtures/jra tests/fixtures/nar docs/reports

          git mv jra-program-fixture.html tests/fixtures/jra/jra-program-fixture.html
          git mv jra-race-card-fixture.html tests/fixtures/jra/jra-race-card-fixture.html
          git mv jra-result-fixture.html tests/fixtures/jra/jra-result-fixture.html
          git mv nar-fixtures.mjs tests/fixtures/nar/nar-fixtures.mjs
          git mv AI_BRIDGE.md docs/AI_BRIDGE.md
          git mv CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md docs/reports/CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/jra-j1.test.mjs": [
                  ("../jra-program-fixture.html",
                   "./fixtures/jra/jra-program-fixture.html"),
              ],
              "tests/jra-j2.test.mjs": [
                  ("../jra-race-card-fixture.html",
                   "./fixtures/jra/jra-race-card-fixture.html"),
              ],
              "tests/jra-j3.test.mjs": [
                  ("../jra-race-card-fixture.html",
                   "./fixtures/jra/jra-race-card-fixture.html"),
              ],
              "tests/jra-j4.test.mjs": [
                  ("../jra-race-card-fixture.html",
                   "./fixtures/jra/jra-race-card-fixture.html"),
                  ("../jra-result-fixture.html",
                   "./fixtures/jra/jra-result-fixture.html"),
              ],
              "regression.test.mjs": [
                  ("./nar-fixtures.mjs",
                   "./tests/fixtures/nar/nar-fixtures.mjs"),
              ],
              "tests/auto-result-queue.test.mjs": [
                  ("../nar-fixtures.mjs",
                   "./fixtures/nar/nar-fixtures.mjs"),
              ],
              "README.md": [
                  ("CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md",
                   "docs/reports/CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md"),
                  ("nar-fixtures.mjs",
                   "tests/fixtures/nar/nar-fixtures.mjs"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected reference missing before replacement: {filename}: {old}")
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f"No update made: {filename}")
              path.write_text(text, encoding="utf-8")
          PY

          # Destination guards.
          test -f tests/fixtures/jra/jra-program-fixture.html
          test -f tests/fixtures/jra/jra-race-card-fixture.html
          test -f tests/fixtures/jra/jra-result-fixture.html
          test -f tests/fixtures/nar/nar-fixtures.mjs
          test -f docs/AI_BRIDGE.md
          test -f docs/reports/CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md

          # Old root paths must be gone.
          for OLD in \
            jra-program-fixture.html \
            jra-race-card-fixture.html \
            jra-result-fixture.html \
            nar-fixtures.mjs \
            AI_BRIDGE.md \
            CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md
          do
            test ! -e "$OLD"
          done

          # Updated references must point at new locations.
          grep -Fq "./fixtures/jra/jra-program-fixture.html" tests/jra-j1.test.mjs
          grep -Fq "./fixtures/jra/jra-race-card-fixture.html" tests/jra-j2.test.mjs
          grep -Fq "./fixtures/jra/jra-race-card-fixture.html" tests/jra-j3.test.mjs
          grep -Fq "./fixtures/jra/jra-race-card-fixture.html" tests/jra-j4.test.mjs
          grep -Fq "./fixtures/jra/jra-result-fixture.html" tests/jra-j4.test.mjs
          grep -Fq "./tests/fixtures/nar/nar-fixtures.mjs" regression.test.mjs
          grep -Fq "./fixtures/nar/nar-fixtures.mjs" tests/auto-result-queue.test.mjs
          grep -Fq "docs/reports/CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md" README.md

      - name: Post-move full regression
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Commit Phase A
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          # Allow only the seven moves, their known reference updates,
          # and the consolidation workflow itself.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          allowed_exact = {
              ".github/workflows/CHASS-Workflow-Consolidation-v2.0.yml",
              "README.md",
              "regression.test.mjs",
              "tests/jra-j1.test.mjs",
              "tests/jra-j2.test.mjs",
              "tests/jra-j3.test.mjs",
              "tests/jra-j4.test.mjs",
              "tests/auto-result-queue.test.mjs",
              "tests/fixtures/jra/jra-program-fixture.html",
              "tests/fixtures/jra/jra-race-card-fixture.html",
              "tests/fixtures/jra/jra-result-fixture.html",
              "tests/fixtures/nar/nar-fixtures.mjs",
              "docs/AI_BRIDGE.md",
              "docs/reports/CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md",
          }

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          unexpected = sorted(changed - allowed_exact)
          if unexpected:
              raise SystemExit("Unexpected changed files: " + ", ".join(unexpected))
          PY

          test -n "$(git diff --cached --name-only)"

          git commit -m "refactor: organize fixtures and docs batch10 phase a"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "## CHASS Root Slim Batch10 — Phase A Applied v2.6.2"
            echo
            echo "- Fixtures moved: **4**"
            echo "- Documents moved: **2**"
            echo "- Runtime/source modules moved: **0**"
            echo "- Deleted: **0**"
            echo "- Full regression after move: **PASS**"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- main direct push: **NO**"
          } >> "$GITHUB_STEP_SUMMARY"
