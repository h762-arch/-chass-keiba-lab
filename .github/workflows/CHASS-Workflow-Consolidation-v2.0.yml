name: CHASS Workflow Consolidation v2.4

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit_only=確認のみ / apply=Batch8旧Workflowをarchiveして残骸を削除"
        required: true
        default: "audit_only"
        type: choice
        options:
          - audit_only
          - apply

permissions:
  contents: write

concurrency:
  group: chass-workflow-consolidation-v24-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Batch 8 safety audit
        id: audit
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          test "$MODE" = "audit_only" -o "$MODE" = "apply"
          test "$GITHUB_REF_NAME" = "chass/workflow-unification-batch8"

          if [ "$MODE" = "apply" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::apply on main is forbidden."
            exit 1
          fi

          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"

          # Replacement must already be present and be the tested Batch8 version.
          RUNTIME=".github/workflows/CHASS-JRA-Integrated-Race-Odds-Cache-Refresh-v2.0.yml"
          test -f "$RUNTIME"
          grep -Fq "name: CHASS JRA Runtime Refresh v3.0.1" "$RUNTIME"
          grep -Fq 'cron: "15 21,0,3,6,9,12 * * *"' "$RUNTIME"
          grep -Fq 'cron: "15 21 * * 5,6"' "$RUNTIME"
          grep -Fq 'cron: "*/15 0-7 * * 6,0"' "$RUNTIME"
          grep -Fq 'cron: "*/10 0-8 * * 6,0"' "$RUNTIME"
          grep -Fq 'official_only=1' "$RUNTIME"

          # Result parser fix verified before cleanup.
          test -f jra-result-fetch.mjs
          grep -Fq "JRA_RESULT_PARSER_VERSION='jra-official-result-v1.3'" jra-result-fetch.mjs
          grep -Fq "const postIndex=html.indexOf('発走時刻')" jra-result-fetch.mjs
          grep -Fq "JRA_RACE_MISMATCH" jra-result-fetch.mjs

          OFFICIAL=".github/workflows/CHASS-JRA-Official-Cache-Refresh-v1.3.yml"
          RESULT=".github/workflows/CHASS-JRA-Result-Cache-Bridge-v1.0.yml"
          PATCH=".github/workflows/_chass_patch.py"
          MANIFEST=".github/workflows/_chass_manifest.json"

          for FILE in "$OFFICIAL" "$RESULT" "$PATCH" "$MANIFEST"; do
            test -f "$FILE" || {
              echo "::error::Expected Batch8 cleanup source missing: $FILE"
              exit 1
            }
          done

          grep -Fq "name: CHASS JRA Official Cache Refresh v1.3 Unified" "$OFFICIAL"
          grep -Fq "name: CHASS JRA Result Cache Refresh v1.1" "$RESULT"

          # Confirm the two old scheduled jobs are genuinely superseded by v3.0.1.
          grep -Fq '15 21,0,3,6,9,12 * * *' "$OFFICIAL"
          grep -Fq '*/10 0-8 * * 6,0' "$RESULT"

          # Operational workflows that must remain active.
          for KEEP in \
            .github/workflows/CHASS-JRA-Cloudflare-Diagnostic-v4.yml \
            .github/workflows/CHASS-JRA-D1-Retention-v1.0.yml \
            .github/workflows/CHASS-JRA-Health-Smoke-v1.0.yml \
            .github/workflows/CHASS-JRA-Integrated-Race-Odds-Cache-Refresh-v2.0.yml \
            .github/workflows/CHASS-JRA-Odds-Cache-Diagnostic-Backfill-v1.8.7.yml \
            .github/workflows/CHASS-Maintenance-Runner-v1.2.yml \
            .github/workflows/CHASS-Workflow-Consolidation-v2.0.yml \
            .github/workflows/finalize-deploy.yml \
            .github/workflows/publish-ai-snapshot.yml
          do
            test -f "$KEEP" || {
              echo "::error::Critical retained workflow missing: $KEEP"
              exit 1
            }
          done

          {
            echo "## CHASS Workflow Consolidation v2.4 — Batch 8 Audit"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Mode: \`$MODE\`"
            echo "- Replacement: Runtime Refresh v3.0.1"
            echo "- Result parser: v1.3"
            echo "- Archive candidates: 2"
            echo "- Residue delete candidates: 2"
            echo
            echo "### Archive"
            echo "- \`$OFFICIAL\`"
            echo "- \`$RESULT\`"
            echo
            echo "### Delete residue"
            echo "- \`$PATCH\`"
            echo "- \`$MANIFEST\`"
            echo
            echo "- main direct push: NO"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "official=$OFFICIAL" >> "$GITHUB_OUTPUT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Apply Batch 8 cleanup
        if: ${{ inputs.mode == 'apply' }}
        id: apply
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF_NAME" = "chass/workflow-unification-batch8"
          test "$GITHUB_REF_NAME" != "main"

          OFFICIAL="${{ steps.audit.outputs.official }}"
          RESULT="${{ steps.audit.outputs.result }}"
          PATCH="${{ steps.audit.outputs.patch }}"
          MANIFEST="${{ steps.audit.outputs.manifest }}"

          STAMP="$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S)"
          DEST="archive/workflows/superseded/${STAMP}-consolidation-batch8"
          mkdir -p "$DEST"

          git mv "$OFFICIAL" "$DEST/$(basename "$OFFICIAL")"
          git mv "$RESULT" "$DEST/$(basename "$RESULT")"
          git rm "$PATCH" "$MANIFEST"

          # Final guards before commit.
          test -f ".github/workflows/CHASS-JRA-Integrated-Race-Odds-Cache-Refresh-v2.0.yml"
          grep -Fq "name: CHASS JRA Runtime Refresh v3.0.1" \
            ".github/workflows/CHASS-JRA-Integrated-Race-Odds-Cache-Refresh-v2.0.yml"
          test ! -e "$OFFICIAL"
          test ! -e "$RESULT"
          test ! -e "$PATCH"
          test ! -e "$MANIFEST"
          test -f "$DEST/$(basename "$OFFICIAL")"
          test -f "$DEST/$(basename "$RESULT")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "::error::No Batch8 cleanup changes found."
            exit 1
          fi

          git commit -m "chore: finalize workflow consolidation batch8"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "## Batch 8 cleanup applied"
            echo
            echo "- Archived old scheduled workflows: 2"
            echo "- Deleted stale helper residue: 2"
            echo "- Active replacement retained: Runtime Refresh v3.0.1"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- main direct push: NO"
            echo "- Archive: \`$DEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
