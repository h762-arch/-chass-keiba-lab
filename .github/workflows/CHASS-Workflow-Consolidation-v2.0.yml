name: CHASS Workflow Consolidation v2.2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit_only=確認のみ / apply=作業ブランチで旧Workflowをarchiveへ移動"
        required: true
        default: "audit_only"
        type: choice
        options: [audit_only, apply]

permissions:
  contents: write

concurrency:
  group: chass-workflow-consolidation-v22-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Audit Batch 5 replacements and candidates
        id: audit
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$MODE" = "audit_only" -o "$MODE" = "apply"
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"

          if [ "$MODE" = "apply" ] && [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::apply on main is forbidden."
            exit 1
          fi

          HEALTH=".github/workflows/CHASS-JRA-Health-Smoke-v1.0.yml"
          DIAG=".github/workflows/CHASS-JRA-Cloudflare-Diagnostic-v4.yml"
          test -f "$HEALTH"
          test -f "$DIAG"

          grep -Fq "app_all" "$HEALTH"
          grep -Fq "official_d1" "$HEALTH"
          grep -Fq "drive_fallback" "$HEALTH"
          grep -Fq "official_only=1" "$HEALTH"
          grep -Fq "JRA_DRIVE_FRIDAY_BASE" "$HEALTH"

          grep -Fq "service_safe" "$DIAG"
          grep -Fq "transport_1042" "$DIAG"
          grep -Fq "Temporary diagnostic Worker only" "$DIAG"

          cat > /tmp/batch5.tsv <<'EOF'
          .github/workflows/CHASS-JRA-All-Races-App-Smoke-v1.0.yml	CHASS-JRA-Health-Smoke-v1.0.yml
          .github/workflows/CHASS-JRA-Official-D1-Only-Smoke-v1.0.yml	CHASS-JRA-Health-Smoke-v1.0.yml
          .github/workflows/CHASS-JRA-Drive-Fallback-Real-Data-Smoke-v1.0.1.yml	CHASS-JRA-Health-Smoke-v1.0.yml
          .github/workflows/CHASS-JRA-Cloudflare-1042-Diagnostic-v3.yml	CHASS-JRA-Cloudflare-Diagnostic-v4.yml
          .github/workflows/CHASS-JRA-Cloudflare-Diagnostic-Safe.yml	CHASS-JRA-Cloudflare-Diagnostic-v4.yml
          EOF

          SAFE=0
          BLOCKED=0
          MISSING=0
          : > /tmp/batch5-safe.tsv
          : > /tmp/batch5-blocked.tsv

          while IFS=$'\t' read -r OLD NEW; do
            [ -n "$OLD" ] || continue
            if [ ! -f "$OLD" ]; then
              printf 'MISSING\t%s\talready archived/absent\n' "$OLD" >> /tmp/batch5-blocked.tsv
              MISSING=$((MISSING+1))
              continue
            fi

            AUTO="$(node --input-type=module - "$OLD" <<'NODE'
          import fs from 'node:fs';
          const lines=fs.readFileSync(process.argv[2],'utf8').split(/\r?\n/);
          let inOn=false; const auto=[];
          for(const line of lines){
            if(!inOn){if(/^(?:"on"|on):\s*$/.test(line))inOn=true;continue;}
            if(/^[^\s#][^:]*:\s*/.test(line))break;
            const m=/^ {2}([A-Za-z0-9_-]+):\s*/.exec(line);
            if(m && ['schedule','push','pull_request','workflow_call','workflow_run','repository_dispatch'].includes(m[1])) auto.push(m[1]);
          }
          process.stdout.write(auto.join(','));
          NODE
            )"
            if [ -n "$AUTO" ]; then
              printf 'BLOCKED\t%s\tautomatic trigger: %s\n' "$OLD" "$AUTO" >> /tmp/batch5-blocked.tsv
              BLOCKED=$((BLOCKED+1))
              continue
            fi

            printf '%s\t%s\n' "$OLD" "$NEW" >> /tmp/batch5-safe.tsv
            SAFE=$((SAFE+1))
          done < /tmp/batch5.tsv

          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          echo "blocked=$BLOCKED" >> "$GITHUB_OUTPUT"
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

          {
            echo "## CHASS Workflow Consolidation v2.2 — Batch 5 Audit"
            echo
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo "- Mode: \`$MODE\`"
            echo "- Safe archive candidates: $SAFE"
            echo "- Blocked: $BLOCKED"
            echo "- Already absent: $MISSING"
            echo
            echo "| Archive | Replacement |"
            echo "|---|---|"
            while IFS=$'\t' read -r OLD NEW; do echo "| \`$OLD\` | \`$NEW\` |"; done < /tmp/batch5-safe.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MODE" = "apply" ] && [ "$BLOCKED" -ne 0 ]; then
            echo "::error::Blocked candidates exist. Nothing moved."
            exit 1
          fi

      - name: Archive superseded Batch 5 workflows
        if: ${{ inputs.mode == 'apply' }}
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.audit.outputs.safe }}" -eq 5

          STAMP="$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S)"
          DEST="archive/workflows/superseded/${STAMP}-consolidation-batch5"
          mkdir -p "$DEST"

          MOVED=0
          while IFS=$'\t' read -r OLD NEW; do
            [ -f "$OLD" ] || continue
            git mv "$OLD" "$DEST/$(basename "$OLD")"
            MOVED=$((MOVED+1))
          done < /tmp/batch5-safe.tsv
          test "$MOVED" -eq 5

          test -f .github/workflows/CHASS-JRA-Health-Smoke-v1.0.yml
          test -f .github/workflows/CHASS-JRA-Cloudflare-Diagnostic-v4.yml
          test -f .github/workflows/CHASS-JRA-Integrated-Race-Odds-Cache-Refresh-v2.0.yml
          test -f .github/workflows/CHASS-JRA-Official-Cache-Refresh-v1.3.yml
          test -f .github/workflows/CHASS-JRA-D1-Retention-v1.0.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unify JRA smoke and diagnostic workflows"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "moved=$MOVED" >> "$GITHUB_OUTPUT"
          echo "archive=$DEST" >> "$GITHUB_OUTPUT"

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo
            echo "### Result"
            if [ "${{ inputs.mode }}" = "audit_only" ]; then
              echo "✅ Audit only — repository was not modified."
            else
              echo "- Archived old workflows: ${{ steps.apply.outputs.moved || '0' }}"
              echo "- Archive: \`${{ steps.apply.outputs.archive || 'n/a' }}\`"
              echo "- Replacements kept: 2"
              echo "- Net active workflow reduction after merge: 3"
              echo "- main direct push: NO"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
