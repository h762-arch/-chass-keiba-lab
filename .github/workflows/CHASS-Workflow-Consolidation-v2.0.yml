name: CHASS Workflow Consolidation v2.7 Root Slim Phase B Audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Phase Bはresearch系4ファイルの参照監査のみ"
        required: true
        default: "audit_only"
        type: choice
        options:
          - audit_only

permissions:
  contents: read

concurrency:
  group: chass-root-slim-batch10-phaseb-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install root and MCP dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix mcp

      - name: Phase B safety preflight
        shell: bash
        run: |
          set -euo pipefail

          test "${{ inputs.mode }}" = "audit_only"
          test "$GITHUB_REF_NAME" = "chass/root-slim-batch10-phaseb"

          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"

          for FILE in \
            calibration-research.js \
            similarity-intelligence.mjs \
            longshot-scenario.js \
            research-storage-sync.mjs
          do
            test -f "$FILE" || {
              echo "::error::Phase B research source missing: $FILE"
              exit 1
            }
          done

          test -f tests/fixtures/jra/jra-program-fixture.html
          test -f tests/fixtures/jra/jra-race-card-fixture.html
          test -f tests/fixtures/jra/jra-result-fixture.html
          test -f tests/fixtures/nar/nar-fixtures.mjs
          test -f docs/AI_BRIDGE.md
          test -f docs/reports/CHASS-KEIBA-LAB-Ver10.0.1-REPORT.md

          for KEEP in \
            README.md package.json package-lock.json \
            app.js worker.js server.mjs index.html styles.css \
            wrangler.jsonc openapi.json d1-schema.sql
          do
            test -f "$KEEP"
          done

      - name: Baseline full regression
        shell: bash
        run: |
          set -euo pipefail
          npm run check

      - name: Build Phase B reference inventory
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          candidates = [
              "calibration-research.js",
              "similarity-intelligence.mjs",
              "longshot-scenario.js",
              "research-storage-sync.mjs",
          ]

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()

          text_exts = {
              ".js", ".mjs", ".cjs", ".json", ".jsonc",
              ".yml", ".yaml", ".md", ".html", ".css",
              ".txt", ".sql", ".webmanifest",
          }

          searchable = []
          self_workflow = ".github/workflows/CHASS-Workflow-Consolidation-v2.0.yml"

          for rel in tracked:
              if rel.startswith("archive/"):
                  continue
              if rel == self_workflow:
                  continue
              p = Path(rel)
              if not p.is_file():
                  continue
              if p.suffix.lower() not in text_exts and p.name not in {
                  ".gitignore", ".assetsignore"
              }:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              searchable.append((rel, text))

          rows = []
          for candidate in candidates:
              refs = []
              for rel, text in searchable:
                  if rel == candidate:
                      continue
                  if candidate in text:
                      refs.append(rel)

              package_refs = [x for x in refs if x == "package.json"]
              runtime_refs = [
                  x for x in refs
                  if x.endswith((".js", ".mjs", ".cjs"))
                  and not x.startswith("tests/")
                  and x != "regression.test.mjs"
              ]
              test_refs = [
                  x for x in refs
                  if x.startswith("tests/") or x == "regression.test.mjs"
              ]
              html_refs = [x for x in refs if x.endswith(".html")]
              workflow_refs = [x for x in refs if x.startswith(".github/workflows/")]
              docs_refs = [x for x in refs if x.endswith(".md")]

              if runtime_refs or html_refs or workflow_refs:
                  risk = "HIGH_COUPLING"
              elif test_refs or package_refs:
                  risk = "MEDIUM_COUPLING"
              else:
                  risk = "LOW_COUPLING"

              rows.append({
                  "file": candidate,
                  "referenceCount": len(refs),
                  "references": refs,
                  "packageRefs": package_refs,
                  "runtimeRefs": runtime_refs,
                  "testRefs": test_refs,
                  "htmlRefs": html_refs,
                  "workflowRefs": workflow_refs,
                  "docsRefs": docs_refs,
                  "risk": risk,
              })

          payload = {
              "schemaVersion": 1,
              "branch": subprocess.check_output(
                  ["git", "branch", "--show-current"], text=True
              ).strip(),
              "mode": "audit_only",
              "candidateCount": len(candidates),
              "changesApplied": False,
              "mainDirectPush": False,
              "candidates": rows,
          }

          Path("/tmp/batch10-phaseb-audit.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          with Path("/tmp/batch10-phaseb-summary.md").open(
              "w", encoding="utf-8"
          ) as f:
              f.write("## CHASS Root Slim Batch10 — Phase B Research Audit\n\n")
              f.write(f"- Branch: `{payload['branch']}`\n")
              f.write("- Mode: `audit_only`\n")
              f.write("- Research candidates: **4**\n")
              f.write("- Changes applied: **NO**\n")
              f.write("- Delete operations: **0**\n")
              f.write("- main direct push: **NO**\n")
              f.write("- Baseline full regression: **PASS**\n\n")

              for row in rows:
                  f.write(f"### `{row['file']}` — {row['risk']}\n")
                  f.write(f"- references: **{row['referenceCount']}**\n")
                  if row["references"]:
                      for ref in row["references"]:
                          f.write(f"  - `{ref}`\n")
                  else:
                      f.write("  - none\n")
                  f.write("\n")

              f.write("### Phase B interpretation\n")
              f.write("- `HIGH_COUPLING`: runtime/html/workflow参照あり。単純移動禁止、参照修正＋Smokeが必要\n")
              f.write("- `MEDIUM_COUPLING`: package/test中心。移動時はnpm scripts/test pathを同時修正\n")
              f.write("- `LOW_COUPLING`: 直接参照が見つからない候補。それでも移動前後のfull regression必須\n")
              f.write("- 今回は監査のみ。ファイル移動・削除・pushは実行しない\n")

          print(Path("/tmp/batch10-phaseb-summary.md").read_text(
              encoding="utf-8"
          ))
          PY

      - name: Publish Phase B audit summary
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/batch10-phaseb-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase B audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: chass-root-slim-batch10-phaseb-audit
          path: /tmp/batch10-phaseb-audit.json
          if-no-files-found: error
          retention-days: 14
