name: CHASS JRA Market EV Consistency Hotfix v1.1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "validate_only"
        type: choice
        options:
          - validate_only
          - apply_and_deploy

permissions:
  contents: write

concurrency:
  group: chass-jra-market-ev-consistency-v11
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_BASE_URL: https://chass-keiba-lab7.h7625421.workers.dev

    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Capture baseline
        id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Safety guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').name")" = "chass-keiba-lab"
          test "$(node -p "require('./package.json').version")" = "10.0.1"
          test "$(git hash-object app.js)" = "d997b9847475b8270688f0807958c99b1a476a20"
          grep -Fq "function applyMarketOdds" app.js
          grep -Fq "function mergeExisting" app.js
          grep -Fq "function migrateSnapshotRecord" app.js
          grep -Fq "h.ev=o.ev" app.js
          test ! -e tests/market-ev-consistency.test.mjs

      - name: Build isolated candidate
        shell: bash
        env:
          PATCHER_B64: 
        run: |
          set -euo pipefail
          rm -rf /tmp/chass-market-ev-v10
          git worktree add --detach /tmp/chass-market-ev-v10 HEAD
          cd /tmp/chass-market-ev-v10
          printf '%s' "$PATCHER_B64" | base64 -d > /tmp/chass-market-ev-patcher.py
          python3 /tmp/chass-market-ev-patcher.py

          git status --porcelain=v1 -uall | sed -E 's/^.. //' | sort > /tmp/actual.txt
          printf '%s\n' app.js tests/market-ev-consistency.test.mjs | sort > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/actual.txt

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/chass-market-ev-v10
          npm ci
          npm ci --prefix mcp

      - name: Market consistency tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/chass-market-ev-v10
          node --check app.js
          node --test tests/market-ev-consistency.test.mjs
          npm run check

      - name: Verify expected screenshot examples
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const rows = [
            {horse:4, odds:15.4, win:23.4, expected:3.6036},
            {horse:12, odds:36.1, win:2.8, expected:1.0108},
            {horse:13, odds:26.0, win:1.7, expected:0.4420},
            {horse:9, odds:3.5, win:1.4, expected:0.0490}
          ];
          for (const r of rows) {
            const actual = Number((r.odds * r.win / 100).toFixed(4));
            if (Math.abs(actual - r.expected) > 1e-9) throw new Error(`EV check failed horse ${r.horse}`);
          }
          console.log('Screenshot EV consistency examples: PASS');
          NODE

      - name: Validate-only summary
        if: ${{ inputs.mode == 'validate_only' }}
        shell: bash
        run: |
          {
            echo "## CHASS JRA Market EV Consistency Hotfix v1.1 - VALIDATION SUCCESS"
            echo
            echo "- Current odds x current AI win consistency: PASS"
            echo "- Unchanged odds + changed AI prediction invalidation: PASS"
            echo "- Old EV / 💎 / ⚠️ carry-over removal: PASS"
            echo "- Active stored-race repair: PASS"
            echo "- Validated historical snapshot protection: PASS"
            echo "- Full regression: PASS"
            echo "- Main commit: NOT PERFORMED"
            echo "- Production deploy: NOT PERFORMED"
            echo
            echo "Next: rerun with mode=apply_and_deploy."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cloudflare authentication preflight
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx -y wrangler@4 whoami

      - name: Verify main did not move
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "${{ steps.base.outputs.sha }}" = "$(git rev-parse origin/main)"

      - name: Apply hotfix source
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/chass-market-ev-v10/app.js app.js
          cp /tmp/chass-market-ev-v10/tests/market-ev-consistency.test.mjs tests/market-ev-consistency.test.mjs

          git diff --quiet --             worker.js jra-model.js jra-race-fetch.mjs jra-odds-fetch.mjs jra-result-fetch.mjs             jra-official-cache.mjs wrangler.jsonc migrations/ viewer/ mcp/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/market-ev-consistency.test.mjs
          git commit -m "Fix stale JRA market EV and value flags"
          SHA="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "done=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: npx -y wrangler@4 deploy

      - name: Production smoke
        if: ${{ inputs.mode == 'apply_and_deploy' }}
        shell: bash
        env:
          HOTFIX_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail

          HOME_PASS=0
          for DELAY in 0 2 5 10; do
            [ "$DELAY" -eq 0 ] || sleep "$DELAY"
            HOME_CODE="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/home.html -w '%{http_code}' "$PRODUCTION_BASE_URL/?chass_smoke=$HOTFIX_SHA" || true)"
            echo "HOME HTTP=$HOME_CODE"
            if [ "$HOME_CODE" = "200" ] && grep -Fq "チャス競馬研究所" /tmp/home.html; then
              HOME_PASS=1
              break
            fi
          done
          test "$HOME_PASS" = "1"

          # app.js is an intentional public frontend asset.
          APP_PASS=0
          for DELAY in 0 2 5 10; do
            [ "$DELAY" -eq 0 ] || sleep "$DELAY"
            APP_CODE="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' -o /tmp/app.js -w '%{http_code}' "$PRODUCTION_BASE_URL/app.js?chass_smoke=$HOTFIX_SHA" || true)"
            echo "APP.JS HTTP=$APP_CODE"
            if [ "$APP_CODE" = "200" ] \
              && grep -Fq "marketPredictionBasisSignature" /tmp/app.js \
              && grep -Fq "marketDerivedVersion='MDV-2'" /tmp/app.js \
              && ! grep -Fq "h.ev=o.ev" /tmp/app.js; then
              APP_PASS=1
              break
            fi
          done
          test "$APP_PASS" = "1"

          for path in "/.git/config" "/worker.js" "/wrangler.jsonc"; do
            CODE="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$PRODUCTION_BASE_URL$path")"
            echo "PRIVATE $path -> $CODE"
            [ "$CODE" != "200" ]
          done
          echo "Production home/app.js/private-boundary smoke: PASS"

      - name: Roll back on production failure
        if: ${{ failure() && inputs.mode == 'apply_and_deploy' && steps.commit.outputs.done == 'true' }}
        shell: bash
        run: |
          set +e
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "${{ steps.commit.outputs.sha }}"
          git push origin HEAD:main
          npx -y wrangler@4 deploy

      - name: Production success summary
        if: ${{ success() && inputs.mode == 'apply_and_deploy' }}
        shell: bash
        run: |
          {
            echo "## CHASS JRA Market EV Consistency Hotfix v1.1 - PRODUCTION SUCCESS"
            echo
            echo "- EV source: current odds x current AI win"
            echo "- Same-odds / changed-model stale cache: FIXED"
            echo "- Old EV / 💎 / ⚠️ carry-over on active races: REMOVED"
            echo "- Active saved races: SAFE REPAIR ENABLED"
            echo "- Validated historical races: PRESERVED"
            echo "- Race/Odds/Result Bridges: UNCHANGED"
            echo "- Prediction/TIME model: UNCHANGED"
            echo "- NAR / Viewer / D1 schema: UNCHANGED"
            echo "- v1.0 false-failure smoke (/app.js treated as private): FIXED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary worktree
        if: always()
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/chass-market-ev-v10 2>/dev/null
          git worktree prune 2>/dev/null
